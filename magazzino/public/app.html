<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magazzino centrale · To Smile</title>
<meta name="description" content="Disponibilità degli articoli del magazzino centrale To Smile, prenotazioni e riordino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#4CAAAA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magazzino">
<style>
/* Layout: barra in alto con schede (Magazzino / Prenotazioni per i clienti; Richieste / Articoli / Riordino / Fornitori
   per l'amministratore), contenuto sotto; il carrello del cliente è una barra fissa in basso che apre un pannello. */
:root{
  --teal:#4CAAAA; --purple:#8C6898; --yellow:#E8E560; --teal-ink:#2A7C7D; --purple-ink:#6E4C7B; --olive-ink:#77731A;
  --bg:#FBFBF8; --surface:#FFFFFF; --surface-2:#F4F4EF; --fg:#2B3033; --muted:#6B7276; --line:#E6E6DF;
  --danger:#B3261E; --danger-bg:#FBEAEA; --ok:#2A7C7D; --ok-bg:#E5F3F3; --warn:#77731A; --warn-bg:#FBF9DA;
  --f-display:"Fira Sans","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --teal-ink:#6CC7C7; --purple-ink:#C3A6D0; --olive-ink:#E8E560;
  --bg:#15191B; --surface:#1D2326; --surface-2:#252C30; --fg:#ECEFF0; --muted:#A3AAAE; --line:#2F383C;
  --danger:#F2B8B5; --danger-bg:#3A2222; --ok:#6CC7C7; --ok-bg:#1F3436; --warn:#E8E560; --warn-bg:#35341C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--f-body);min-height:100vh}
a{color:var(--teal-ink)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2}
h1{font-size:clamp(24px,3.6vw,32px);font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 0}
.top-in{max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand b{font:800 18px var(--f-display);display:flex;gap:8px;align-items:center}
.brand b svg{width:26px;height:26px}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who .name{font-size:13.5px;color:var(--muted);font-weight:600;margin-right:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--yellow);color:#3A3816;font-size:12px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom))}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:9px 14px;border-radius:11px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:40px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0F1A1B}}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 55%,transparent);outline-offset:2px}
input,select,textarea{font:15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
label.f small{font-weight:500;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools .search{flex:1 1 220px;max-width:360px}
.pill{display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.no{background:var(--danger-bg);color:var(--danger)}
.pill.purple{background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--purple-ink)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.cat-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.cat-title h2{font-size:17px}
.cat-title .line{flex:1;height:1px;background:var(--line)}
/* catalogo cliente */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{padding:14px;display:flex;flex-direction:column;gap:10px}
.item .nm{font-weight:700;font-size:15.5px;line-height:1.3}
.item .cd{font-size:12.5px;color:var(--muted)}
.item .av{display:flex;align-items:baseline;gap:6px}
.item .av b{font:800 22px var(--f-display);color:var(--teal-ink)}
.item.zero .av b{color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.qty button{appearance:none;border:0;background:var(--surface-2);width:40px;height:40px;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.qty button:disabled{opacity:.35;cursor:default}
.qty input{border:0;border-radius:0;text-align:center;width:56px;min-height:40px;padding:0;font-weight:700;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.item .act{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.06)}
.cartbar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
/* tabelle admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.off td{opacity:.55}
.tbl-wrap{overflow-x:auto}
.rowact{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
/* richieste */
.req{padding:16px;display:flex;flex-direction:column;gap:12px}
.req.pending{border-color:color-mix(in srgb,var(--yellow) 80%,var(--line));box-shadow:inset 4px 0 0 var(--yellow)}
.req-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.req-h .meta{font-size:13.5px;color:var(--muted)}
.req-lines{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.req-lines div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.req-lines div:last-child{border-bottom:0}
.req-lines .short{color:var(--danger);font-weight:700}
.req-act{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--ok-bg);color:var(--fg);border-radius:12px;padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px;font-size:14px}
.banner .grow b{display:block}
.sup{padding:16px;display:flex;flex-direction:column;gap:12px}
.sup-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
/* finestre */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,24,26,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.msg{border-radius:10px;padding:9px 12px;font-size:14px}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.mov{font-size:13.5px}
.mov td{padding:6px 8px}
@media (max-width:700px){
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tbl.cards td{border:0;padding:2px 6px}
  .tbl.cards td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12.5px}
  .tbl.cards td.full{grid-column:1/-1}
  .tbl.cards .num{text-align:left}
}
/* categorie a fisarmonica: se ne apre una alla volta */
.acc{margin-bottom:8px}
.acc-h{appearance:none;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;min-height:54px}
.acc-h:hover{border-color:var(--teal)}
.acc-h h2{font-size:17px;flex:1 1 auto;min-width:120px}
.acc-h .chev{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--surface-2);font-weight:800;transition:transform .15s;flex:none}
.acc.open>.acc-h{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.acc.open>.acc-h .chev{transform:rotate(90deg)}
.acc-b{padding:10px 0 14px}
.acc-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:10px}
.acc-h:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 55%,transparent);outline-offset:2px}
/* bolla */
dialog.wide{width:min(940px,calc(100vw - 24px))}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover{border-color:var(--teal)}
.drop input{width:auto;min-height:0;border:0;background:none;padding:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .pdf{width:72px;height:96px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);font-weight:800;color:var(--danger);background:var(--danger-bg)}
.brows{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding-right:2px}
.br{display:grid;grid-template-columns:28px minmax(0,1.5fr) 150px minmax(0,1.3fr);gap:8px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.br.off{opacity:.5}
.br.todo{border-color:color-mix(in srgb,var(--yellow) 85%,var(--line));box-shadow:inset 4px 0 0 var(--yellow)}
.br input[type=checkbox]{width:20px;height:20px;min-height:0}
.br .q{display:flex;gap:6px;align-items:center}
.br .q input{width:80px;text-align:right}
.br .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:700px){.br{grid-template-columns:28px 1fr}.br>.q,.br>.dest{grid-column:2}.brows{max-height:none;overflow:visible}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note.warn{background:var(--warn-bg);color:var(--fg)}
.note.danger{background:var(--danger-bg);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <b><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E8E560"/><path d="M6 14 16 8l10 6v11H6z" fill="none" stroke="#3A3816" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 25v-7h10v7M11 21.5h10" fill="none" stroke="#3A3816" stroke-width="2.2"/></svg>Magazzino centrale</b>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<main id="main"><p class="muted">Caricamento…</p></main>
<div class="cartbar" id="cartbar" hidden></div>
<dialog id="dlg"><form id="dlgf" method="dialog" novalidate></form></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = d => d ? new Date(d).toLocaleString('it-IT', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';
const fmtD = d => d ? new Date(d).toLocaleDateString('it-IT', {day: '2-digit', month: '2-digit', year: 'numeric'}) : '—';
const store = { get(k, d) { try { const v = localStorage.getItem('mag_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mag_' + k, JSON.stringify(v)); } catch {} } };

let S = { me: null, categorie: [], articoli: [], prenotazioni: [], fornitori: [], carrello: [], ordini: [], links: {} };
let view = null, catAperta = store.get('catAperta', ''), query = '';
let cart = store.get('cart', {}); // cliente: { articoloId: quantita }
const isAdmin = () => S.me && S.me.role === 'admin';

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3200); }
async function api(path, opt = {}) {
  const r = await fetch(path, { method: opt.method || 'GET', headers: opt.body ? {'Content-Type': 'application/json'} : {},
    body: opt.body ? JSON.stringify(opt.body) : undefined, credentials: 'same-origin' });
  if (r.status === 401) { location.reload(); throw new Error('Sessione scaduta'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Operazione non riuscita');
  return j;
}
async function load() {
  S = await api('/api/state');
  // il carrello del cliente non può superare le disponibilità aggiornate
  for (const id of Object.keys(cart)) {
    const a = S.articoli.find(x => x.id === id);
    if (!a || a.disponibile <= 0) delete cart[id]; else if (cart[id] > a.disponibile) cart[id] = a.disponibile;
  }
  store.set('cart', cart);
}

/* ---------------- intestazione ---------------- */
const pendingCount = () => S.prenotazioni.filter(p => p.stato === 'in_attesa').length;
function tabsFor() {
  if (isAdmin()) return [['richieste', 'Richieste', pendingCount()], ['articoli', 'Articoli'],
    ['riordino', 'Riordino', S.carrello.length + S.ordini.filter(o => o.stato === 'da_inviare').length], ['fornitori', 'Fornitori']];
  return [['catalogo', 'Magazzino'], ['mie', 'Le mie prenotazioni', pendingCount()]];
}
function renderTop() {
  $('#tabs').innerHTML = tabsFor().map(([k, l, n]) => `<button class="tab" role="tab" aria-selected="${view === k}" data-tab="${k}">${l}${n ? ` <span class="count">${n}</span>` : ''}</button>`).join('');
  const bell = PUSH.state === 'on' ? `<button class="btn sm ghost" data-push-off title="Notifiche attive su questo dispositivo">🔔 Attive</button>`
    : PUSH.state === 'off' ? `<button class="btn sm" data-push-on>🔔 Attiva notifiche</button>` : '';
  $('#who').innerHTML = `<span class="name">${esc(S.me.name)}${isAdmin() ? ' · Amministratore' : ''}</span>${bell}
    <a class="btn sm" href="${esc(S.links.home || 'https://appgestione.it')}">Le mie app</a><button class="btn sm" data-logout>Esci</button>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab); return; }
  if (e.target.closest('[data-logout]')) { const r = await api('/api/logout', {method: 'POST', body: {}}).catch(() => ({})); location.href = r.home || S.links.home || '/'; }
  if (e.target.closest('[data-push-on]')) pushEnable();
  if (e.target.closest('[data-push-off]')) { if (confirm('Disattivare le notifiche su questo dispositivo?')) pushDisable(); }
});
function go(v) { view = v; store.set('view_' + (isAdmin() ? 'a' : 'c'), v); history.replaceState(null, '', '/?vista=' + v); render(); window.scrollTo({top: 0}); }
function render() {
  renderTop();
  ({ catalogo: renderCatalogo, mie: renderMie, richieste: renderRichieste, articoli: renderArticoli, riordino: renderRiordino, fornitori: renderFornitori }[view] || (() => {}))();
  renderCartbar();
}

/* ================= CLIENTE ================= */
function catOptions() { return S.categorie.filter(c => S.articoli.some(a => a.categoriaId === c.id && (isAdmin() || a.disponibile > 0 || cart[a.id]))); }
function filtroArticoli(list) {
  const q = query.trim().toLowerCase();
  return list.filter(a => !q || `${a.nome} ${a.codice}`.toLowerCase().includes(q));
}
function toolsHtml(placeholder) {
  return `<div class="tools"><input class="search" type="search" id="q" placeholder="${placeholder}" value="${esc(query)}" aria-label="Cerca">
    ${query ? '' : '<span class="muted" style="font-size:13.5px">Tocca una categoria per vederne gli articoli.</span>'}</div>`;
}
let redrawCats = null;
function bindTools(redraw) {
  redrawCats = redraw;
  $('#q').addEventListener('input', e => { query = e.target.value; redraw(); });
}
// Fisarmonica: una categoria aperta alla volta; durante una ricerca si aprono tutte quelle con risultati.
const aperta = id => !!query.trim() || catAperta === id;
function accHead(c, extra) {
  const op = aperta(c.id);
  return `<button type="button" class="acc-h" data-acc="${c.id}" aria-expanded="${op}"><span class="chev" aria-hidden="true">›</span><h2>${esc(c.nome)}</h2>${extra}</button>`;
}
document.addEventListener('click', e => {
  const h = e.target.closest('[data-acc]'); if (!h || !redrawCats) return;
  if (query.trim()) return;
  catAperta = catAperta === h.dataset.acc ? '' : h.dataset.acc; store.set('catAperta', catAperta);
  redrawCats();
  const el = document.querySelector(`[data-acc="${CSS.escape(h.dataset.acc)}"]`);
  if (el && catAperta && el.getBoundingClientRect().top < 70) el.scrollIntoView({ block: 'start', behavior: 'smooth' });

function renderCatalogo() {

function itemCard(a) {
  const inCart = cart[a.id] || 0, max = a.disponibile;
  return `<article class="card item ${max ? '' : 'zero'}" data-art="${a.id}">
    <div><div class="nm">${esc(a.nome)}</div>${a.codice ? `<div class="cd">Cod. ${esc(a.codice)}</div>` : ''}</div>
    <div class="av"><b>${max}</b><span class="muted">${esc(a.unita)} disponibili</span></div>
    ${max ? `<div class="act"><div class="qty"><button type="button" data-dec aria-label="Meno" ${inCart ? '' : 'disabled'}>−</button>
      <input type="number" inputmode="numeric" min="0" max="${max}" value="${inCart}" data-qty aria-label="Quantità di ${esc(a.nome)}">
      <button type="button" data-inc aria-label="Più" ${inCart >= max ? 'disabled' : ''}>+</button></div>
      ${inCart ? '<span class="pill ok">Nel carrello</span>' : ''}</div>` : '<span class="pill">Esaurito</span>'}
  </article>`;

function setCart(id, n) {
  const a = S.articoli.find(x => x.id === id); if (!a) return;
  n = Math.max(0, Math.min(a.disponibile, Math.round(Number(n) || 0)));
  if (n) cart[id] = n; else delete cart[id];
  store.set('cart', cart);
  const el = document.querySelector(`[data-art="${id}"]`); if (el) el.outerHTML = itemCard(a);
  renderCartbar();
}
document.addEventListener('click', e => {
  const card = e.target.closest('[data-art]'); if (!card) return;
  if (e.target.closest('[data-inc]')) setCart(card.dataset.art, (cart[card.dataset.art] || 0) + 1);
  if (e.target.closest('[data-dec]')) setCart(card.dataset.art, (cart[card.dataset.art] || 0) - 1);
});
document.addEventListener('change', e => {
  const i = e.target.closest('[data-qty]'); if (!i) return;
  const id = i.closest('[data-art]').dataset.art, a = S.articoli.find(x => x.id === id);
  if (Number(i.value) > a.disponibile) toast(`Ne restano solo ${a.disponibile} ${a.unita}`);
  setCart(id, i.value);
});
function renderCartbar() {
  const bar = $('#cartbar');
  const n = Object.keys(cart).length;
  if (isAdmin() || view !== 'catalogo' || !n) { bar.hidden = true; return; }
  const pezzi = Object.values(cart).reduce((a, b) => a + b, 0);
  bar.hidden = false;
  bar.innerHTML = `<div class="in"><div><b>${n} ${n === 1 ? 'articolo' : 'articoli'}</b> <span class="muted">· ${pezzi} in tutto</span></div>

}
function openCart() {
  const righe = Object.entries(cart).map(([id, q]) => ({ a: S.articoli.find(x => x.id === id), q })).filter(r => r.a);
  open(`<div class="dlg-h"><h2>La tua prenotazione</h2><button class="btn sm ghost" value="cancel" aria-label="Chiudi">✕</button></div>
    <table class="tbl"><tbody>${righe.map(r => `<tr><td>${esc(r.a.nome)}<div class="muted" style="font-size:12.5px">disponibili ${r.a.disponibile} ${esc(r.a.unita)}</div></td>
      <td class="num"><input type="number" min="0" max="${r.a.disponibile}" value="${r.q}" data-cart-q="${r.a.id}" style="width:84px;text-align:right" aria-label="Quantità"></td><td style="width:1%">${esc(r.a.unita)}</td></tr>`).join('')}</tbody></table>
    <label class="f">Note per il magazzino <small>Facoltative: ad esempio quando passi a ritirare</small><textarea id="c-note" maxlength="500"></textarea></label>
    <div class="msg err" role="alert"></div>
    <div class="dlg-f"><button class="btn" value="svuota" formnovalidate>Svuota</button><button class="btn primary" value="save">Invia prenotazione</button></div>`, async v => {
    if (v === 'svuota') { cart = {}; store.set('cart', cart); closeDlg(); render(); return; }
    document.querySelectorAll('[data-cart-q]').forEach(i => setCart(i.dataset.cartQ, i.value));
    const lines = Object.entries(cart).map(([articoloId, quantita]) => ({ articoloId, quantita }));
    if (!lines.length) throw new Error('Il carrello è vuoto.');
    try {
      const r = await api('/api/prenotazioni', { method: 'POST', body: { righe: lines, note: $('#c-note').value } });
      cart = {}; store.set('cart', cart); closeDlg();
      await load(); go('mie'); toast(`Prenotazione n. ${r.numero} inviata`);
    } catch (err) { await load().catch(() => {}); throw err; }
  });
}
const STATO = { in_attesa: ['In attesa', 'warn'], confermata: ['Confermata', 'ok'], rifiutata: ['Rifiutata', 'no'], annullata: ['Annullata', ''] };

function statoScorta(a) {
  if (!a.attivo) return '<span class="pill">Disattivato</span>';
  if (a.giacenza === 0) return '<span class="pill no">Esaurito</span>';
  if (a.scortaMinima && a.giacenza <= a.scortaMinima) return '<span class="pill warn">Sotto scorta</span>';
  return '';
}
function renderArticoli() {

      <button class="btn primary" data-new-art>+ Articolo</button></div></div>

    const head = accHead(c, `<span class="muted" style="font-size:13px">${l.length} ${l.length === 1 ? 'articolo' : 'articoli'}</span>${sotto ? ` <span class="pill warn">${sotto} sotto scorta</span>` : ''}${esa ? ` <span class="pill no">${esa} esauriti</span>` : ''}`);

        ${l.map(a => `<tr class="${a.attivo ? '' : 'off'}"><td class="full"><b>${esc(a.nome)}</b> ${statoScorta(a)}${a.codice ? `<div class="muted" style="font-size:12.5px">Cod. ${esc(a.codice)}</div>` : ''}</td>

// Elimina la macro categoria; se contiene articoli li elimina tutti, dopo una conferma scritta.
async function eliminaCategoria(c) {
  const l = S.articoli.filter(a => a.categoriaId === c.id);
  if (!l.length) {
    if (!confirm(`Eliminare la macro categoria «${c.nome}»? È vuota.`)) return;
    try { await api('/api/categorie/' + c.id, { method: 'DELETE' }); await load(); render(); toast('Categoria eliminata'); } catch (e) { toast(e.message); }
    return;
  }
  const pezzi = l.reduce((t, a) => t + (a.giacenza || 0), 0);
  open(`<div class="dlg-h"><h2>Eliminare «${esc(c.nome)}» e tutto il suo contenuto?</h2></div>
    <div class="note danger">Verranno eliminati <b>definitivamente</b> la macro categoria e i suoi <b>${l.length} ${l.length === 1 ? 'articolo' : 'articoli'}</b>${pezzi ? ` (in giacenza ${pezzi} in tutto)` : ''}, con i loro movimenti.
      Le prenotazioni e gli ordini passati restano nello storico. <b>L'operazione non si può annullare.</b></div>
    <div class="req-lines" style="max-height:30vh;overflow:auto">${l.slice(0, 50).map(a => `<div><span>${esc(a.nome)}</span><span class="muted">${a.giacenza} ${esc(a.unita)}</span></div>`).join('')}${l.length > 50 ? `<div class="muted">… e altri ${l.length - 50}</div>` : ''}</div>
    <label class="f">Per confermare scrivi ELIMINA<input id="del-ok" autocomplete="off" autocapitalize="characters" placeholder="ELIMINA"></label>
    <div class="msg err" role="alert"></div>
    <div class="dlg-f"><button class="btn" value="cancel" formnovalidate>Annulla</button><button class="btn danger" value="save">Elimina tutto</button></div>`, async () => {
    if ($('#del-ok').value.trim().toUpperCase() !== 'ELIMINA') throw new Error('Scrivi ELIMINA per confermare.');
    const r = await api('/api/categorie/' + c.id + '?tutto=1', { method: 'DELETE' });
    if (catAperta === c.id) { catAperta = ''; store.set('catAperta', ''); }
    closeDlg(); await load(); render(); toast(`Eliminata «${c.nome}» con ${r.articoli} articoli`);
  });
}

// Foto → riduzione a JPEG (max 2000 px) nel browser; PDF così com'è.
async function preparaFile(file) {
  const leggiURL = b => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(b); });
  if (file.type === 'application/pdf') {
    if (file.size > 15e6) throw new Error(`«${file.name}» è troppo grande (max 15 MB).`);
    return { tipo: 'application/pdf', dati: await leggiURL(file), nome: file.name };
  }
  try {
    const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86));
    return { tipo: 'image/jpeg', dati: await leggiURL(blob), nome: file.name };
  } catch {
    if (/^image\/(jpeg|png|webp|gif)$/.test(file.type) && file.size < 4.5e6) return { tipo: file.type, dati: await leggiURL(file), nome: file.name };
    throw new Error(`«${file.name}»: formato della foto non leggibile. Scatta la foto dalla fotocamera o usa JPG/PNG/PDF.`);
  }
}

function ordineCard(o) {
  return `<article class="card req ${o.stato === 'da_inviare' ? 'pending' : ''}">
    <div class="req-h"><div><h3>Ordine n. ${o.numero} · ${esc(o.fornitore)}</h3><div class="meta">Creato ${fmtDT(o.creatoIl)}${o.creatoDa ? ` da ${esc(o.creatoDa)}` : ''}${o.inviatoIl ? ` · inviato ${fmtD(o.inviatoIl)}` : ''}${o.ricevutoIl ? ` · ricevuto ${fmtD(o.ricevutoIl)}` : ''}</div></div>
      <span class="pill ${STATO_O[o.stato][1]}">${STATO_O[o.stato][0]}</span></div>
    <div class="req-lines">${o.righe.map(r => `<div><span>${esc(r.nome)}${r.codice ? ` <span class="muted">· ${esc(r.codice)}</span>` : ''}</span><span>${r.quantita} ${esc(r.unita)}${r.ricevuta != null && r.ricevuta !== r.quantita ? ` <span class="muted">(ricevuti ${r.ricevuta})</span>` : ''}</span></div>`).join('')}</div>
    ${o.note ? `<div class="note"><b>Note:</b> ${esc(o.note)}</div>` : ''}
    ${o.stato === 'da_inviare' || o.stato === 'inviato' ? `<div class="req-act">
      ${o.email ? `<button class="btn sm ${o.stato === 'da_inviare' ? 'primary' : ''}" data-oinvia="${o.id}">${o.stato === 'inviato' ? 'Invia di nuovo' : 'Invia email'}</button>` : ''}
      <button class="btn sm" data-ostampa="${o.id}">Stampa / PDF</button>
      ${o.stato === 'da_inviare' ? `<button class="btn sm" data-osegna="${o.id}">Segna come inviato</button>` : ''}
      <button class="btn sm ok" data-oric="${o.id}">Merce ricevuta</button>
      <button class="btn sm ghost danger" data-oann="${o.id}">Annulla ordine</button></div>`
      : `<div class="req-act"><button class="btn sm" data-ostampa="${o.id}">Stampa / PDF</button></div>`}
  </article>`;
}
function bindOrdini() {
  const act = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await fn(S.ordini.find(o => o.id === Object.values(b.dataset)[0])); } catch (e) { toast(e.message); }
    b.disabled = false;
  });
  act('[data-oinvia]', async o => { await api(`/api/ordini/${o.id}/invia`, { method: 'POST', body: {} }); await load(); render(); toast(`Ordine inviato a ${o.email}`); });
  act('[data-osegna]', async o => { await api(`/api/ordini/${o.id}/segna-inviato`, { method: 'POST', body: {} }); await load(); render(); });
  act('[data-oann]', async o => { if (!confirm(`Annullare l'ordine n. ${o.numero}?`)) return; await api(`/api/ordini/${o.id}/annulla`, { method: 'POST', body: {} }); await load(); render(); toast('Ordine annullato'); });
  act('[data-ostampa]', async o => stampa(o));
  act('[data-oric]', async o => ricevi(o));
}
function ricevi(o) {
  open(`<div class="dlg-h"><h2>Merce ricevuta · ordine n. ${o.numero}</h2></div>
    <p class="muted" style="margin:0">Controlla le quantità arrivate: la giacenza aumenta di questi numeri.</p>
    <table class="tbl"><tbody>${o.righe.map(r => `<tr><td>${esc(r.nome)}<div class="muted" style="font-size:12.5px">ordinati ${r.quantita} ${esc(r.unita)}</div></td>
      <td class="num"><input type="number" min="0" inputmode="numeric" value="${r.quantita}" data-ric="${r.id}" style="width:90px;text-align:right" aria-label="Ricevuti"></td></tr>`).join('')}</tbody></table>
    <div class="msg err" role="alert"></div>
    <div class="dlg-f"><button class="btn" value="cancel" formnovalidate>Annulla</button><button class="btn primary" value="save">Carica in magazzino</button></div>`, async () => {
    const righe = [...document.querySelectorAll('[data-ric]')].map(i => ({ id: i.dataset.ric, ricevuta: i.value }));
    await api(`/api/ordini/${o.id}/ricevuto`, { method: 'POST', body: { righe } });
    closeDlg(); await load(); render(); toast('Merce caricata: giacenze aggiornate');
  });
}
function stampa(o) {
  const w = window.open('', '_blank');
  if (!w) { toast('Consenti le finestre a comparsa per stampare'); return; }
  w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Ordine n. ${o.numero}</title>
    <style>body{font:14px/1.5 Arial,sans-serif;color:#222;margin:32px}h1{font-size:20px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin-top:18px}
    td,th{border-bottom:1px solid #ccc;padding:8px;text-align:left}td.n,th.n{text-align:right}.m{color:#666}</style></head><body>
    <h1>Ordine n. ${o.numero}</h1><div class="m">To Smile · Magazzino centrale · ${fmtD(o.creatoIl)}</div>
    <p><b>Fornitore:</b> ${esc(o.fornitore)}${o.email ? ` · ${esc(o.email)}` : ''}</p>
    <table><thead><tr><th>Articolo</th><th>Codice</th><th class="n">Quantità</th></tr></thead><tbody>
    ${o.righe.map(r => `<tr><td>${esc(r.nome)}</td><td>${esc(r.codice || '')}</td><td class="n">${r.quantita} ${esc(r.unita)}</td></tr>`).join('')}</tbody></table>
    ${o.note ? `<p><b>Note:</b> ${esc(o.note)}</p>` : ''}<p class="m">Richiesto da: ${esc(S.me.name)}</p>
    <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ---- fornitori ---- */
function renderFornitori() {
  $('#main').innerHTML = `<div class="head"><div><h1>Fornitori</h1><p>Associa a ogni articolo il suo fornitore: gli ordini di riordino partono già divisi per fornitore.</p></div>
    <button class="btn primary" data-new-for>+ Fornitore</button></div>
    ${S.fornitori.length ? `<div class="card tbl-wrap"><table class="tbl cards"><thead><tr><th>Fornitore</th><th>Email ordini</th><th>Telefono</th><th class="num">Articoli</th><th></th></tr></thead><tbody>
      ${S.fornitori.map(f => `<tr><td class="full"><b>${esc(f.nome)}</b>${f.piva ? ` <span class="muted" style="font-size:12.5px">P.IVA ${esc(f.piva)}</span>` : ''}${f.note ? `<div class="muted" style="font-size:12.5px">${esc(f.note)}</div>` : ''}</td>
        <td data-l="Email">${f.email ? esc(f.email) : '<span class="pill warn">Manca</span>'}</td><td data-l="Telefono">${esc(f.telefono || '—')}</td>
        <td class="num" data-l="Articoli">${S.articoli.filter(a => a.fornitoreId === f.id).length}</td>
        <td><div class="rowact"><button class="btn sm" data-edit-for="${f.id}">Modifica</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="card empty"><b>Nessun fornitore</b>Aggiungili per inviare gli ordini di riordino via email.</div>'}`;
  $('[data-new-for]').onclick = () => editFornitore();
  document.querySelectorAll('[data-edit-for]').forEach(b => b.onclick = () => editFornitore(S.fornitori.find(f => f.id === b.dataset.editFor)));
}
function editFornitore(f) {
  open(`<div class="dlg-h"><h2>${f ? 'Modifica fornitore' : 'Nuovo fornitore'}</h2></div>
    <label class="f">Nome<input id="f-nome" maxlength="120" value="${esc(f?.nome || '')}"></label>
    <div class="grid2"><label class="f">Email per gli ordini<input id="f-email" type="email" maxlength="160" value="${esc(f?.email || '')}"></label>
      <label class="f">Telefono<input id="f-tel" maxlength="40" value="${esc(f?.telefono || '')}"></label></div>
    <div class="grid2"><label class="f">Partita IVA<input id="f-piva" maxlength="20" value="${esc(f?.piva || '')}"></label>
      <label class="f">Indirizzo<input id="f-ind" maxlength="200" value="${esc(f?.indirizzo || '')}"></label></div>
    <label class="f">Note<textarea id="f-note" maxlength="500">${esc(f?.note || '')}</textarea></label>
    <div class="msg err" role="alert"></div>
    <div class="dlg-f">${f ? '<button class="btn danger" value="delete" formnovalidate style="margin-right:auto">Elimina</button>' : ''}<button class="btn" value="cancel" formnovalidate>Annulla</button><button class="btn primary" value="save">Salva</button></div>`, async v => {
    if (v === 'delete') {
      if (!confirm(`Eliminare «${f.nome}»? Gli articoli restano, senza fornitore.`)) return;
      await api('/api/fornitori/' + f.id, { method: 'DELETE' }); closeDlg(); await load(); render(); return;
    }
    const body = { nome: $('#f-nome').value, email: $('#f-email').value, telefono: $('#f-tel').value, note: $('#f-note').value, piva: $('#f-piva').value, indirizzo: $('#f-ind').value };
    if (f) await api('/api/fornitori/' + f.id, { method: 'PUT', body }); else await api('/api/fornitori', { method: 'POST', body });
    closeDlg(); await load(); render(); toast('Fornitore salvato');
  });
}

/* ---------------- finestre ---------------- */
const dlg = $('#dlg'), dlgf = $('#dlgf');
let onSave = null;
function open(html, save, opt = {}) {
  dlg.classList.toggle('wide', !!opt.wide); dlgf.innerHTML = html; onSave = save; dlg.showModal();
  if (!opt.nofocus) dlgf.querySelector('input:not([disabled]):not([type=file]),textarea,select')?.focus();
}
function closeDlg() { if (dlg.open) dlg.close(); }
dlgf.addEventListener('submit', async e => {
  e.preventDefault();
  const v = e.submitter?.value;
  if (v === 'cancel' || !onSave) return closeDlg();
  const err = dlgf.querySelector('.msg.err'); if (err) err.textContent = '';
  const btns = [...dlgf.querySelectorAll('button')]; btns.forEach(b => b.disabled = true);
  try { await onSave(v); } catch (x) { if (err) err.textContent = x.message; else toast(x.message); }
  btns.forEach(b => b.disabled = false);
});

/* ---------------- notifiche sul dispositivo ---------------- */
const PUSH = { sw: null, sub: null, state: 'checking' };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function pushInit() {
  if (!('serviceWorker' in navigator)) { PUSH.state = 'unsupported'; return; }
  try { PUSH.sw = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; } catch { PUSH.state = 'unsupported'; return; }
  if (!('PushManager' in window) || !('Notification' in window)) { PUSH.state = isIOS && !standalone ? 'ios-install' : 'unsupported'; return; }
  PUSH.sub = await PUSH.sw.pushManager.getSubscription();
  if (Notification.permission === 'denied') PUSH.state = 'denied';
  else if (PUSH.sub && Notification.permission === 'granted') { PUSH.state = 'on'; api('/api/push/subscribe', { method: 'POST', body: { subscription: PUSH.sub.toJSON() } }).catch(() => {}); }
  else PUSH.state = 'off';
}
async function pushEnable() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { PUSH.state = perm === 'denied' ? 'denied' : 'off'; render(); return toast('Notifiche non attivate'); }
    const { key } = await api('/api/push/key');
    PUSH.sub = await PUSH.sw.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api('/api/push/subscribe', { method: 'POST', body: { subscription: PUSH.sub.toJSON() } });
    PUSH.state = 'on'; render();
    const t = await api('/api/push/test', { method: 'POST', body: {} });
    toast(t.ok ? 'Notifiche attive: ti è arrivata una prova' : 'Notifiche attivate');
  } catch (e) { toast('Non è stato possibile attivare le notifiche'); }
}
async function pushDisable() {
  try { if (PUSH.sub) { await api('/api/push/unsubscribe', { method: 'POST', body: { endpoint: PUSH.sub.endpoint } }); await PUSH.sub.unsubscribe(); } } catch {}
  PUSH.sub = null; PUSH.state = 'off'; render(); toast('Notifiche disattivate su questo dispositivo');
}
function pushBanner() {
  if (store.get('pushLater', 0) > Date.now()) return '';
  const later = `<button class="btn sm ghost" data-push-later>Più tardi</button>`;
  const perChi = isAdmin() ? 'Ricevi sul telefono ogni nuova prenotazione da confermare.' : "Ricevi sul telefono l'esito delle tue prenotazioni.";
  if (PUSH.state === 'off') return `<div class="banner"><div class="grow"><b>Attiva le notifiche</b>${perChi}</div>${later}<button class="btn sm primary" data-push-on>Attiva</button></div>`;
  if (PUSH.state === 'ios-install') return `<div class="banner"><div class="grow"><b>Installa l'app per ricevere le notifiche</b>Su iPhone tocca Condividi in Safari, poi «Aggiungi alla schermata Home». Apri il Magazzino dall'icona e attiva le notifiche.</div>${later}</div>`;
  return '';
}
document.addEventListener('click', e => { if (e.target.closest('[data-push-later]')) { store.set('pushLater', Date.now() + 3 * 24 * 3600e3); render(); } });

/* ---------------- avvio e aggiornamento automatico ---------------- */
async function refresh() {
  if (dlg.open || document.activeElement?.matches('input,textarea,select')) return; // non disturbare chi sta scrivendo
  try { const prima = pendingCount(); await load(); render(); if (isAdmin() && pendingCount() > prima) toast('Nuova prenotazione da gestire'); } catch {}
}
(async () => {
  try { await load(); }
  catch (e) { $('#main').innerHTML = `<div class="card empty"><b>Non riesco a caricare il magazzino</b>${esc(e.message)}</div>`; return; }
  const qv = new URLSearchParams(location.search).get('vista');
  const valid = tabsFor().map(t => t[0]);
  view = valid.includes(qv) ? qv : store.get('view_' + (isAdmin() ? 'a' : 'c'), valid[0]);
  if (!valid.includes(view)) view = valid[0];
  if (isAdmin() && pendingCount() && !qv) view = 'richieste';
  render();
  pushInit().then(render);
  setInterval(refresh, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
