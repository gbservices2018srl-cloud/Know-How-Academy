<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4CAAAA">

<title>CRM Commerciale · To Smile</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:400,500,600,700,800">
<style>
/* Colori e caratteri To Smile (gli stessi di Comunicazioni, Calendario e Turni), con tema scuro automatico */
:root{
  --bg:#EFF5F5; --dot:#D3E2E2; --surface:#FFFFFF; --surface-2:#F5F9F9; --surface-3:#EAF1F1; --fg:#1F2A2B; --muted:#5E6B6C;
  --line:#DCE7E7; --accent:#2B8384; --accent-soft:#DCEFEF; --accent-fg:#FFFFFF;
  --brand-teal:#4CAAAA; --brand-purple:#8C6898; --brand-yellow:#E8E564; --purple-soft:#EFE7F2;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#8A4A12; --warn-soft:#FBEBDD; --giallo-soft:#FFF4C2; --giallo:#8A6D00;
  --shadow:0 1px 2px rgba(20,48,48,.05),0 8px 28px rgba(20,48,48,.09);
  --f-display:"Fira Sans",system-ui,sans-serif; --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101818; --dot:#1E2B2B; --surface:#172121; --surface-2:#1D2929; --surface-3:#223030; --fg:#E7F0F0; --muted:#9FB0B0;
  --line:#2A3939; --accent:#62C3C3; --accent-soft:#163536; --accent-fg:#062222;
  --brand-teal:#62C3C3; --brand-purple:#B597C2; --purple-soft:#2E2433;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#6FD39C; --ok-soft:#173326; --warn:#F0B07A; --warn-soft:#3A2817; --giallo-soft:#3A3413; --giallo:#F2D56B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-attachment:fixed;
  color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 -1px color-mix(in srgb,var(--brand-yellow) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{height:40px;width:auto;flex:none;display:block}
.brand .sep{width:1px;height:26px;background:var(--line);flex:none}
.brand h1{font:600 16px/1.1 var(--f-display);margin:0;white-space:nowrap;color:var(--muted)}
@media (max-width:900px){.brand h1,.brand .sep{display:none}.who b{display:none}.who{padding:3px}}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;text-decoration:none}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;flex:none;min-height:40px;text-decoration:none;color:inherit}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) max(48px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:inherit;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.wide{min-height:52px;font-size:16px;width:100%}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px;min-height:38px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
h2.view{font:700 26px/1.15 var(--f-display);letter-spacing:-.015em;margin:0}
h3{font:700 17px/1.2 var(--f-display);margin:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head p{margin:4px 0 0;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ko{background:var(--danger-soft);color:var(--danger)}
.tag.todo{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--surface-3);color:var(--muted)}
.tag.q{background:var(--purple-soft);color:var(--brand-purple)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.avvisi{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.avviso{display:flex;gap:8px;align-items:flex-start;padding:8px 11px;border-radius:10px;font-size:14px;font-weight:600}
.avviso.rosso{background:var(--danger-soft);color:var(--danger)}
.avviso.giallo{background:var(--warn-soft);color:var(--warn)}
/* pagina d'ingresso */
.hello{font:800 28px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.big{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:200px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 55%,var(--line))}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--bc)}
.big .bi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 16%,transparent);color:var(--bc)}
.big .bi svg{width:28px;height:28px}
.big h2{font:800 21px/1.15 var(--f-display);margin:0}
.big p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.big .st{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big .go{color:var(--accent);font-weight:700}
/* moduli */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-weight:700;font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;min-height:42px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.ko{background:var(--danger);color:#fff}
.seg button.on.att{background:var(--brand-purple);color:#fff}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:92vw;box-shadow:var(--shadow)}
dialog.dlg{border:0;border-radius:22px;padding:0;width:min(480px,94vw);background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
dialog.dlg::backdrop{background:rgba(10,30,30,.45);backdrop-filter:blur(2px)}
.dlg .dh{display:flex;gap:14px;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg .db{padding:14px 20px}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
/* misure implantari */
/* ---------- CRM Commerciale ---------- */
@media (max-width:700px){.top{flex-wrap:wrap;row-gap:6px}.tabs{order:3;flex-basis:100%}.who{margin-left:auto}}
details.fd>summary{cursor:pointer;font-weight:700;color:var(--accent);margin:2px 0 10px;min-height:32px;list-style:none;display:flex;align-items:center;gap:6px}
details.fd>summary::-webkit-details-marker{display:none}
details.fd>summary::before{content:"▸"}details.fd[open]>summary::before{content:"▾"}
main{max-width:1180px}
.esiti{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.esiti button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:46px;font-weight:700;color:var(--muted)}
.esiti button.on.A,.es.A{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.esiti button.on.S,.es.S{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.esiti button.on.R,.es.R{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.sez{padding:16px 18px;margin-bottom:14px}
.sez h3{margin-bottom:12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-purple)}
.cnt{font-size:12.5px;color:var(--danger);font-weight:600}.cnt.ok{color:var(--ok)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:40px}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.form{max-width:760px;margin:0 auto}
.req{color:var(--danger)}
.nota-sedi{font-size:12.5px;color:var(--muted);margin-top:4px}
/* filtri e tabelle */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.fil{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.fil select,.bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;font-size:14px}
.fil select.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.bar select{width:auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t td.n,.t th.n{text-align:right}
.t td.wrap{white-space:normal;min-width:160px}
.t tr:hover td{background:var(--surface-2)}
/* Richiami: riga colorata per esito (A verde, S giallo, R rosso) */
.t tr.eA td{background:var(--ok-soft)} .t tr.eS td{background:var(--giallo-soft)} .t tr.eR td{background:var(--danger-soft)}
.t tr.eA:hover td,.t tr.eS:hover td,.t tr.eR:hover td{filter:brightness(.97)}
.es.S,.esiti button.on.S{background:var(--giallo-soft)!important;border-color:var(--giallo)!important;color:var(--giallo)!important}
.edr{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left} .edr:hover b{text-decoration:underline}
.edr .amb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.edr .pen{color:var(--muted);font-weight:600;margin-left:6px;font-size:12px}
.ed2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:560px){.ed2{grid-template-columns:1fr}}
.t th button{all:unset;cursor:pointer}
.t th[aria-sort] button::after{content:" ▾"}.t th[aria-sort=ascending] button::after{content:" ▴"}
.t td.low{color:var(--danger);font-weight:700}
.es{border:1.5px solid var(--line);border-radius:9px;padding:5px 8px;font-weight:800;min-height:36px;background:var(--surface-2)}
.notab{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 10px;min-height:36px;max-width:240px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
.tot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:2px 0 10px}
.tot b{color:var(--fg)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:8px}
.tile{padding:14px 16px}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font:800 28px/1.15 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.low{border-color:var(--danger)}.tile.low .v{color:var(--danger)}
.tile.fin{background:linear-gradient(135deg,var(--purple-soft),var(--surface))}
.take{margin:4px 0 16px;color:var(--muted)}
.dsec{margin:22px 0 10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.dgrid.sm{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dcard{padding:14px 16px;min-width:0}
.dcard h4{margin:0 0 4px;font:700 15px/1.2 var(--f-display)}
.dnote{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.scroll{max-height:26rem;overflow:auto}
.legend{font-size:12.5px;color:var(--muted)}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:5px;vertical-align:middle}
svg.ch text{font-size:11.5px;fill:var(--muted)}
svg.ch .lab{fill:var(--fg)}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto}
.msg{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .who2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg.u{align-items:flex-end}
.msg.u .body{background:var(--accent);color:var(--accent-fg);border-radius:14px 14px 4px 14px;padding:8px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.b .body{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 16px;min-width:0;overflow-wrap:anywhere}
.body p{margin:.5em 0}.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}
.body table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.body th,.body td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.body td.n,.body th.n{text-align:right}
.steps{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;max-height:160px;min-height:46px}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;text-align:left}
.qchips button:hover{border-color:var(--accent);background:var(--accent-soft)}
/* liste */
.lrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow .nm{flex:1 1 120px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lrow .btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.lrow input[data-canale]{order:5;flex:1 1 100%!important}
.lrow .nm.off{color:var(--muted);text-decoration:line-through}
.lrow input{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 9px;min-height:36px}
.psc{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.psc.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.prow .nm{flex:1 1 180px;font-weight:700}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.lists .card{max-height:34rem;overflow:auto}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:600}
.mieapp{display:inline-flex;align-items:center;gap:4px;flex:none;padding:7px 12px;border:1px solid #DADAD3;border-radius:999px;background:#fff;color:#2B3033;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:36px}.mieapp:hover{border-color:#2A7C7D;color:#2A7C7D}.mieapp .c{display:none}@media (max-width:480px){.mieapp{padding:6px 10px}.mieapp .t{display:none}.mieapp .c{display:inline}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="CRM Commerciale, inizio"><img class="logo" src="logo.png" alt="To Smile" width="543" height="162"><span class="sep"></span><h1>CRM Commerciale</h1></a>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <a class="mieapp" href="/" title="Torna alle tue app">← <span class="t">Le mie app</span><span class="c">App</span></a>
  <a class="who" id="who" href="/" title="Torna alle app"></a>
</header>
<main id="main"><div class="empty">Caricamento…</div></main>
<dialog class="dlg" id="dlg" aria-label="Note"></dialog>
<div class="toast" id="toast" hidden role="status"></div>
<script src="/classifiche/festa.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(method, url, body) {
  const isForm = body instanceof FormData;
  const r = await fetch(url, { method, credentials: 'include', headers: body && !isForm ? { 'Content-Type': 'application/json' } : {}, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/accedi?next=' + encodeURIComponent(location.href); throw new Error('Accesso richiesto'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Errore, riprova.'), { status: r.status });
  return j;
}
let toastT;
function toast(t, ms = 3500) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
// punto delle migliaia anche sotto 10.000 (12.450 €, 2.669 €)
const mig = n => { const r = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < -0.5 ? '−' : '') + r; };
const fE = x => x == null ? '—' : mig(x) + ' €';
const fPct = x => x == null ? '—' : (x * 100).toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const fN = x => x == null ? '—' : Number(x).toLocaleString('it-IT', { maximumFractionDigits: 1 });
const fD = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const ESITI = { A: 'Accettato', S: 'Sospeso', R: 'Rifiutato' };
const SEZ = [['preventivi', 'Inserimento Preventivi'], ['richiami', 'Richiami commerciali'], ['dashboard', 'Dashboard dati'], ['chiedi', 'Chiedi al CRM'], ['lead', 'Gestione lead'], ['liste', 'Liste']];
// canali con un'informazione obbligatoria (come sul server): CONVENZIONI → partner, EVENTO → nome dell'evento
const infoCanale = mk => /^CONVENZION[EI]$/.test(mk || '') ? { lab: 'Partner della convenzione', breve: 'Convenzione', ph: 'Nome del partner (es. azienda, associazione)' }
  : /^EVENT[OI]$/.test(mk || '') ? { lab: "Nome dell'evento", breve: 'Evento', ph: "Nome dell'evento" } : null;

const S = { st: null, v: null };
async function boot() {
  try { S.st = await api('GET', 'api/stato'); } catch (x) { $('#main').innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  const n = S.st.me.nome || '';
  $('#who').innerHTML = `<span class="av">${esc(n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase())}</span><b>${esc(n.split(' ')[0])}</b>`;
  $('#who').href = S.st.home || '/';
  const vis = SEZ.filter(([k]) => S.st.perm[k]);
  const want = new URLSearchParams(location.search).get('v');
  go(vis.some(([k]) => k === want) ? want : vis[0][0], true);
}
function go(v, replace) {
  S.v = v;
  const u = new URL(location.href); u.searchParams.set('v', v);
  history[replace ? 'replaceState' : 'pushState']({ v }, '', u);
  $('#tabs').innerHTML = SEZ.filter(([k]) => S.st.perm[k]).map(([k, t]) => `<button class="tab ${k === v ? 'on' : ''}" data-go="${k}">${esc(t)}</button>`).join('');
  ({ preventivi: vPrev, richiami: vRich, dashboard: vDash, chiedi: vChiedi, lead: vLead, liste: vListe })[v]();
}
window.addEventListener('popstate', e => { if (e.state?.v) go(e.state.v, true); });
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
const sediDi = k => S.st.perm[k]?.sedi || [];
// sede principale: la prima tra quelle assegnate alla persona (l'amministratore non ne ha: parte da tutte)
const sedePrima = k => { const p = S.st.perm[k]; return p && !p.admin && p.mie?.length ? sediDi(k).find(s => s.id === p.mie[0]) || null : null; };
const opt = (v, t, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(t)}</option>`;

/* ================= INSERIMENTO PREVENTIVI ================= */
let F = null;
const nuovoF = (keep = {}) => ({ sede: keep.sede || sedePrima('preventivi')?.id || sediDi('preventivi')[0]?.id || '', data: S.st.oggi, paziente: '', ambassador: '', canaleInfo: '', annoNascita: '', commerciale: keep.commerciale || '', medici: [],
  tipoOv: '', marketing: '', pdc: '', tipoPdc: '', esito: '', pagato: '', note: '' });
const persone = {};
async function personeDi(sede) { if (!persone[sede]) persone[sede] = await api('GET', 'api/persone?sede=' + encodeURIComponent(sede)); return persone[sede]; }
async function vPrev() {
  if (!F) F = nuovoF();
  const sedi = sediDi('preventivi');
  if (!sedi.length) { $('#main').innerHTML = `<div class="card empty"><b>Nessuna sede assegnata</b>Chiedi all'amministratore di assegnarti una sede in Gestione accessi.</div>`; return; }
  let P = { commerciali: [], medici: [] };
  try { P = await personeDi(F.sede); } catch (x) { toast(x.message); }
  if (!F.commerciale && P.commerciali.some(c => c.id === S.st.me.id)) F.commerciale = S.st.me.id;
  const L = S.st.liste;
  $('#main').innerHTML = `<div class="form">
  <div class="head"><div><h2 class="view">Inserimento Preventivo</h2><p>Ogni preventivo presentato. I campi con * sono obbligatori.</p></div></div>
  <form id="fp" novalidate>
  <div class="card sez"><h3>Trattativa</h3>
    <div class="grid2">
      <div class="field"><label for="f-sede">Sede <span class="req">*</span></label><select id="f-sede" name="sede">${sedi.map(s => opt(s.id, s.nome, s.id === F.sede)).join('')}</select></div>
      <div class="field"><label for="f-data">Data <span class="req">*</span></label><input id="f-data" name="data" type="date" value="${esc(F.data)}" max="${esc(S.st.oggi)}"></div>
    </div>
    <div class="field"><label for="f-paz">Paziente <span class="req">*</span></label><input id="f-paz" name="paziente" autocomplete="off" placeholder="Cognome Nome" value="${esc(F.paziente)}"></div>
    <div class="grid2">
      <div class="field"><label for="f-an">Anno di nascita <span class="req">*</span></label><input id="f-an" name="annoNascita" inputmode="numeric" maxlength="4" placeholder="es. 1985" value="${esc(F.annoNascita)}"></div>
      <div class="field"><label for="f-comm">Commerciale <span class="req">*</span></label><select id="f-comm" name="commerciale"><option value="">— Scegli —</option>${P.commerciali.map(c => opt(c.id, c.nome, c.id === F.commerciale)).join('')}</select>
        ${P.commercialiTutti ? '<div class="nota-sedi">Nessun RAP o RUL con questa sede in anagrafica: li vedi tutti.</div>' : ''}</div>
    </div>
    <div class="field"><span class="lbl">Medico che ha fatto la visita <span class="req">*</span> <span class="muted" style="font-weight:500">(anche più di uno)</span></span>
      <div class="pick" id="f-med">${P.medici.map(m => `<button type="button" data-med="${esc(m.id)}" class="${F.medici.includes(m.id) ? 'on' : ''}">${esc(m.nome)}</button>`).join('') || '<span class="muted">Nessun medico in anagrafica.</span>'}</div>
      ${P.mediciTutti ? '<div class="nota-sedi">Nessun medico con questa sede in anagrafica: li vedi tutti.</div>' : ''}</div>
  </div>
  <div class="card sez"><h3>Preventivo</h3>
    <div class="grid2">
      <div class="field"><label for="f-tipo">Tipo opportunità <span class="req">*</span></label><select id="f-tipo" name="tipoOv"><option value="">— Scegli —</option>${L.tipo_ov.filter(x => x.attivo).map(x => opt(x.valore, x.valore, x.valore === F.tipoOv)).join('')}</select></div>
      <div class="field"><label for="f-mk">Canale marketing <span class="req">*</span></label><select id="f-mk" name="marketing"><option value="">— Scegli —</option>${L.marketing.filter(x => x.attivo).map(x => opt(x.valore, x.valore, x.valore === F.marketing)).join('')}</select></div>
      <div class="field"><label for="f-pdc">€ Piano di cura <span class="req">*</span></label><input id="f-pdc" name="pdc" inputmode="decimal" placeholder="0" value="${esc(F.pdc)}"></div>
      <div class="field"><label for="f-tpdc">Tipo di piano di cura <span class="req">*</span></label><input id="f-tpdc" name="tipoPdc" list="dl-tpdc" placeholder="Scrivi o scegli (es. impl…)" value="${esc(F.tipoPdc)}" autocomplete="off">
        <datalist id="dl-tpdc">${L.tipo_pdc.filter(x => x.attivo).map(x => `<option value="${esc(x.valore)}">`).join('')}</datalist></div>
    </div>
    <div class="field"><span class="lbl">Esito <span class="req">*</span></span>
      <div class="esiti" id="f-esito">${Object.entries(ESITI).map(([k, t]) => `<button type="button" data-esito="${k}" class="${k} ${F.esito === k ? 'on' : ''}">${k} — ${t}</button>`).join('')}</div></div>
    <div id="f-ci-box">${ciHtml()}</div>
    <div class="field"><label for="f-amb" id="f-amb-l">${ambLab()}</label><input id="f-amb" name="ambassador" autocomplete="off" placeholder="Cognome Nome di chi lo ha consigliato" value="${esc(F.ambassador)}"></div>
    <div class="field"><label for="f-pag">Importo pagato <span class="req">*</span></label><input id="f-pag" name="pagato" inputmode="decimal" placeholder="0" value="${esc(F.pagato)}"></div>
  </div>
  <div class="card sez"><h3>Note</h3>
    <div class="field"><label for="f-note">Note <span class="req">*</span> <span class="muted" style="font-weight:500">— minimo 50 caratteri</span></label>
      <textarea id="f-note" name="note" rows="4" placeholder="Descrivi la trattativa…">${esc(F.note)}</textarea><div class="cnt" id="f-cnt"></div></div>
  </div>
  <div id="f-err"></div>
  <button class="btn primary wide" id="f-save" type="submit">Salva preventivo</button>
  </form></div>`;
  cnt();
}
const ambLab = () => `Paziente che lo ha mandato (ambassador) ${/REFERRAL/i.test(F.marketing || '') ? '<span class="req">*</span>' : '<span class="muted" style="font-weight:500">facoltativo · obbligatorio con REFERRAL</span>'}`;
// campo del partner / dell'evento: compare solo con CONVENZIONI o EVENTO, ed è obbligatorio
function ciHtml() { const ic = infoCanale(F.marketing); return ic ? `<div class="field"><label for="f-ci">${esc(ic.lab)} <span class="req">*</span></label><input id="f-ci" name="canaleInfo" autocomplete="off" placeholder="${esc(ic.ph)}" value="${esc(F.canaleInfo)}"></div>` : ''; }
function cnt() { const n = ($('#f-note')?.value || '').trim().length, el = $('#f-cnt'); if (!el) return; el.textContent = n + ' / 50 caratteri'; el.className = 'cnt' + (n >= 50 ? ' ok' : ''); }
document.addEventListener('input', e => {
  const f = e.target.closest('#fp [name]'); if (!f || !F) return;
  F[f.name] = f.value; if (f.name === 'note') cnt();
});
function vocePdc(v) {
  const L = S.st.liste.tipo_pdc.filter(x => x.attivo), t = String(v || '').trim().toLowerCase(); if (!t) return '';
  const es = L.find(x => x.valore.toLowerCase() === t); if (es) return es.valore;
  const c = L.filter(x => t.split(/\s+/).every(w => x.valore.toLowerCase().includes(w)));
  return c.length === 1 ? c[0].valore : null;
}
document.addEventListener('change', e => {
  if (e.target.id === 'f-tpdc') { const v = vocePdc(e.target.value); if (v) { e.target.value = v; F.tipoPdc = v; } else if (v === null) toast("Scegli il tipo di piano di cura dall'elenco che compare mentre scrivi."); }
  if (e.target.id === 'f-sede') { F.sede = e.target.value; F.medici = []; F.commerciale = ''; vPrev(); }
  if (e.target.id === 'f-mk') { F.marketing = e.target.value; if (!infoCanale(F.marketing)) F.canaleInfo = ''; $('#f-ci-box').innerHTML = ciHtml(); $('#f-amb-l').innerHTML = ambLab(); }
});
document.addEventListener('click', e => {
  const m = e.target.closest('[data-med]');
  if (m) { const id = m.dataset.med; F.medici = F.medici.includes(id) ? F.medici.filter(x => x !== id) : [...F.medici, id]; m.classList.toggle('on'); return; }
  const es = e.target.closest('[data-esito]');
  if (es) { F.esito = es.dataset.esito; document.querySelectorAll('[data-esito]').forEach(b => b.classList.toggle('on', b === es)); if (F.esito === 'A') window.TSFesta?.festoni(false); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fp') return;
  e.preventDefault();
  const btn = $('#f-save'); btn.disabled = true; btn.textContent = 'Salvataggio…'; $('#f-err').innerHTML = '';
  try {
    const vp = vocePdc(F.tipoPdc); if (vp) F.tipoPdc = vp;
    const j = await api('POST', 'api/preventivi', F);
    toast('Preventivo salvato.'); if (j.festa) window.TSFesta?.mostra(j.festa); F = nuovoF({ sede: F.sede, commerciale: F.commerciale }); vPrev(); scrollTo({ top: 0, behavior: 'smooth' });
  } catch (x) { $('#f-err').innerHTML = `<div class="err" style="margin-bottom:12px">${esc(x.message)}</div>`; btn.disabled = false; btn.textContent = 'Salva preventivo'; }
});

/* ================= RICHIAMI COMMERCIALI ================= */
const R = { anno: null, righe: null, q: '', f: {}, sort: { k: 'data', d: -1 }, quanti: 200 };
const FASCE_PDC = [['0', 'Sotto 200 €', x => x < 200], ['1', '200 – 1.000 €', x => x >= 200 && x < 1000], ['2', '1.000 – 3.000 €', x => x >= 1000 && x < 3000], ['3', '3.000 – 10.000 €', x => x >= 3000 && x < 10000], ['4', 'Da 10.000 €', x => x >= 10000]];
const FASCE_PAG = [['0', 'Pagato 0 €', x => !x], ['1', 'Pagato sopra 0 €', x => x > 0]];
const FASCE_ETA = [['0', 'Sotto 30 anni', x => x != null && x < 30], ['1', '30 – 44', x => x >= 30 && x < 45], ['2', '45 – 59', x => x >= 45 && x < 60], ['3', '60 – 74', x => x >= 60 && x < 75], ['4', 'Da 75 anni', x => x >= 75], ['5', 'Senza anno', x => x == null]];
const RCOL = [['sede_nome', 'Sede'], ['mese', 'Mese'], ['tipo_ov', 'Tipo opportunità'], ['marketing', 'Marketing'], ['tipo_pdc', 'Tipo di piano di cura'], ['commerciale', 'Commerciale'], ['medico', 'Medico'], ['esito', 'Esito']];
async function vRich() {
  R.anno = R.anno || S.st.anni[0];
  if (!R.inizio) { R.inizio = true; const sp = sedePrima('richiami'); if (sp) R.f.sede_nome = sp.nome; }
  $('#main').innerHTML = `<div class="head"><div><h2 class="view">Richiami commerciali</h2><p>I pazienti con preventivo delle tue sedi. Note ed esito si cambiano qui.</p></div></div><div class="empty">Caricamento…</div>`;
  try { R.righe = (await api('GET', 'api/richiami?anno=' + R.anno)).righe; } catch (x) { $('#main').innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  drawRich(true);
}
function filtrate() {
  const q = R.q.trim().toLowerCase();
  return R.righe.filter(r => (!q || r.paziente.toLowerCase().includes(q) || (r.ambassador || '').toLowerCase().includes(q) || (r.canale_info || '').toLowerCase().includes(q)) && RCOL.every(([k]) => !R.f[k] || String(r[k] ?? '') === R.f[k])
    && (!R.f.pdc || FASCE_PDC.find(f => f[0] === R.f.pdc)[2](r.pdc)) && (!R.f.pag || FASCE_PAG.find(f => f[0] === R.f.pag)[2](r.pagato))
    && (!R.f.eta || FASCE_ETA.find(f => f[0] === R.f.eta)[2](r.eta)));
}
function drawRich(full) {
  // le sedi: tutte quelle visibili, anche senza preventivi (es. una sede appena aperta)
  const val = k => [...new Set([...R.righe.map(r => String(r[k] ?? '')), ...(k === 'sede_nome' ? sediDi('richiami').map(x => x.nome) : [])])].filter(v => v !== '').sort((a, b) => k === 'mese' ? a - b : a.localeCompare(b, 'it'));
  const lab = (k, v) => k === 'mese' ? MESI[v - 1] : k === 'esito' ? v + ' — ' + ESITI[v] : v;
  const sel = (k, t, opts) => `<select data-rf="${k}" class="${R.f[k] ? 'on' : ''}" aria-label="${esc(t)}"><option value="">${esc(t)}: tutti</option>${opts.map(([v, l]) => opt(v, l, R.f[k] === v)).join('')}</select>`;
  if (full) $('#main').innerHTML = `<div class="head"><div><h2 class="view">Richiami commerciali</h2><p>I pazienti con preventivo. Parti dalla tua sede; con il filtro Sede vedi anche le altre. Note ed esito si cambiano qui.</p></div><span class="spacer"></span>
    <select id="r-anno" class="btn sm" aria-label="Anno">${S.st.anni.map(a => opt(a, a, a == R.anno)).join('')}</select></div>
    <div class="bar"><input type="search" id="r-q" placeholder="Cerca il paziente, chi lo ha mandato, il partner o l'evento…" value="${esc(R.q)}" autocomplete="off"><button class="btn sm" id="r-reset" type="button">Togli i filtri</button></div>
    <details class="fd" id="r-fd" ${innerWidth > 700 ? 'open' : ''}><summary id="r-fsum">Filtri</summary><div class="fil" id="r-fil"></div></details><div id="r-out"></div>`;
  $('#r-fil').innerHTML = RCOL.map(([k, t]) => sel(k, t, val(k).map(v => [v, lab(k, v)]))).join('')
    + sel('pdc', '€ Piano di cura', FASCE_PDC.map(f => [f[0], f[1]])) + sel('pag', 'Importo pagato', FASCE_PAG.map(f => [f[0], f[1]])) + sel('eta', 'Età', FASCE_ETA.map(f => [f[0], f[1]]));
  const nf = Object.values(R.f).filter(Boolean).length; $('#r-fsum').textContent = nf ? `Filtri (${nf} attivi)` : 'Filtri';
  const rows = filtrate(), s = R.sort;
  rows.sort((a, b) => { const x = a[s.k], y = b[s.k]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'it')) * s.d; });
  const tot = rows.reduce((a, r) => ({ pdc: a.pdc + (r.pdc || 0), pag: a.pag + (r.pagato || 0), A: a.A + (r.esito === 'A'), S: a.S + (r.esito === 'S'), R: a.R + (r.esito === 'R') }), { pdc: 0, pag: 0, A: 0, S: 0, R: 0 });
  const th = (k, t, n) => `<th class="${n ? 'n' : ''}" ${s.k === k ? `aria-sort="${s.d > 0 ? 'ascending' : 'descending'}"` : ''}><button data-rs="${k}">${t}</button></th>`;
  const vis = rows.slice(0, R.quanti);
  $('#r-out').innerHTML = `<div class="tot"><span><b>${rows.length.toLocaleString('it-IT')}</b> preventivi</span><span>Piani di cura <b>${fE(tot.pdc)}</b></span><span>Pagato <b>${fE(tot.pag)}</b></span>
      <span>A <b>${tot.A}</b> · S <b>${tot.S}</b> · R <b>${tot.R}</b></span></div>
    ${rows.length ? `<div class="card tw"><table class="t"><thead><tr>${th('paziente', 'Nome e cognome')}${th('data', 'Data preventivo')}${th('tipo_ov', 'Tipo opportunità')}${th('marketing', 'Marketing')}${th('pdc', '€ Piano di cura', 1)}${th('pagato', 'Importo pagato', 1)}${th('tipo_pdc', 'Tipo di piano di cura')}${th('eta', 'Età', 1)}${th('commerciale', 'Commerciale')}${th('medico', 'Medico')}${th('esito', 'Esito')}<th>Note</th>${sediDi('richiami').length > 1 ? th('sede_nome', 'Sede') : ''}</tr></thead>
    <tbody>${vis.map(r => `<tr class="${r.esito ? 'e' + esc(r.esito) : ''}"><td><button class="edr" data-modr="${esc(r.id)}" title="Modifica tutti i campi"><b>${esc(r.paziente)}</b><span class="pen">✎ Modifica</span>${r.ambassador ? `<span class="amb">Mandato da: ${esc(r.ambassador)}</span>` : ''}${r.canale_info ? `<span class="amb">${esc((infoCanale(r.marketing) || { breve: 'Dettaglio canale' }).breve)}: ${esc(r.canale_info)}</span>` : ''}</button></td><td>${fD(r.data)}</td><td>${esc(r.tipo_ov)}</td><td>${esc(r.marketing)}</td><td class="n">${fE(r.pdc)}</td><td class="n">${fE(r.pagato)}</td>
      <td>${esc(r.tipo_pdc)}</td><td class="n">${r.eta ?? '—'}</td><td>${esc(r.commerciale)}</td><td>${esc(r.medico)}</td>
      <td><select class="es ${esc(r.esito)}" data-esito-r="${esc(r.id)}" aria-label="Esito">${r.esito ? '' : '<option value="">—</option>'}${Object.entries(ESITI).map(([k, t]) => `<option value="${k}" ${r.esito === k ? 'selected' : ''} title="${t}">${k}</option>`).join('')}</select></td>
      <td><button class="notab" data-nota="${esc(r.id)}" title="Scrivi o leggi le note">${r.note ? esc(r.note.slice(0, 40)) + (r.note.length > 40 ? '…' : '') : '<span class="muted">+ nota</span>'}</button></td>
      ${sediDi('richiami').length > 1 ? `<td>${esc(r.sede_nome)}</td>` : ''}</tr>`).join('')}</tbody></table></div>
      ${rows.length > R.quanti ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="r-piu">Mostra altri ${Math.min(200, rows.length - R.quanti)}</button></div>` : ''}`
    : '<div class="card empty"><b>Nessun preventivo</b>Cambia la ricerca o i filtri.</div>'}`;
}
let rqT;
document.addEventListener('input', e => { if (e.target.id === 'r-q') { R.q = e.target.value; R.quanti = 200; clearTimeout(rqT); rqT = setTimeout(() => drawRich(false), 150); } });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.rf) { R.f[t.dataset.rf] = t.value; R.quanti = 200; return drawRich(false); }
  if (t.id === 'r-anno') { R.anno = +t.value; R.f = {}; return vRich(); }
  if (t.dataset.esitoR) {
    const r = R.righe.find(x => x.id === t.dataset.esitoR); const prima = r.esito;
    if (t.value === 'A') window.TSFesta?.festoni(false);
    try { const j = await api('PATCH', 'api/richiami/' + r.id, { esito: t.value }); if (j.festa) window.TSFesta?.mostra(j.festa); r.esito = t.value; t.className = 'es ' + t.value; t.closest('tr').className = 'e' + t.value; toast('Esito: ' + ESITI[t.value]); }
    catch (x) { t.value = prima; toast(x.message); }
  }
});
document.addEventListener('click', e => {
  const s = e.target.closest('[data-rs]');
  if (s) { const k = s.dataset.rs; R.sort = R.sort.k === k ? { k, d: -R.sort.d } : { k, d: ['paziente', 'tipo_ov', 'marketing', 'tipo_pdc', 'commerciale', 'medico', 'esito', 'sede_nome'].includes(k) ? 1 : -1 }; return drawRich(false); }

function bars(data, label, ref, val = d => d.perc, fmt = fPct) {
  if (!data.length) return '<div class="empty" style="padding:14px">Nessun dato per questo periodo.</div>';
  const W = 520, barH = 20, gap = 7, top = 6, left = 150, right = 70, H = top + data.length * (barH + gap) + 18;
  const max = Math.max(...data.map(val), ref || 0, 0.0001);
  const x = v => left + (W - left - right) * (v / max);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  data.forEach((d, i) => {
    const y = top + i * (barH + gap), v = val(d), low = ref != null && v < ref;
    let l = label(d); if (l.length > 24) l = l.slice(0, 23) + '…';
    s += `<text class="lab" x="${left - 8}" y="${y + barH / 2}" dy="0.35em" text-anchor="end">${esc(l)}</text>
      <rect x="${left}" y="${y}" width="${Math.max(2, x(v) - left)}" height="${barH}" rx="4" fill="${low ? 'var(--danger)' : 'var(--brand-teal)'}"><title>${esc(label(d))}: ${esc(fmt(v))}</title></rect>
      <text x="${x(v) + 6}" y="${y + barH / 2}" dy="0.35em" style="fill:${low ? 'var(--danger)' : 'var(--fg)'}">${esc(fmt(v))}</text>`;
  });
  if (ref != null) s += `<line x1="${x(ref)}" x2="${x(ref)}" y1="${top - 3}" y2="${H - 14}" stroke="var(--brand-purple)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return s + '</svg>';
}
function linea(pts, f, fmt, refV, periodo, col) {
  if (!pts.length) return '<div class="empty" style="padding:14px">Nessun dato.</div>';
  const W = 320, H = 170, top = 12, bottom = 22, left = 46, right = 10;
  const max = Math.max(...pts.map(d => d[f]), refV || 0, f === 'perc' ? 0.05 : 1) * 1.1;
  const y = v => H - bottom - (H - top - bottom) * (v / max), x = i => pts.length === 1 ? (left + W - right) / 2 : left + (W - left - right) * i / (pts.length - 1);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0, .5, 1].forEach(t => { const v = max * t; s += `<line x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left - 5}" y="${y(v)}" dy="0.35em" text-anchor="end">${esc(f === 'perc' ? Math.round(v * 100) + '%' : v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v))}</text>`; });
  if (refV != null) s += `<line x1="${left}" x2="${W - right}" y1="${y(refV)}" y2="${y(refV)}" stroke="var(--brand-purple)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s += `<path d="${pts.map((d, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(d[f])).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((d, i) => { const low = refV != null && d[f] < refV; s += `<circle cx="${x(i)}" cy="${y(d[f])}" r="${d.periodo === periodo ? 6 : 4}" fill="${low ? 'var(--danger)' : col}" stroke="var(--surface)" stroke-width="1.5"><title>${MESI[+d.periodo.slice(1) - 1]}: ${esc(fmt(d[f]))}</title></circle>`;
    if (pts.length <= 12) s += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${MESI[+d.periodo.slice(1) - 1].slice(0, 3)}</text>`; });
  return s + '</svg>';
}

const C = { turni: [], busy: false };
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
const isNum = s => /^[\s\-+]?[€]?\s?[\d.,]+\s?(€|%)?\s*$/.test(s) && /\d/.test(s);
function md(src) {
  const lines = String(src).replace(/\r/g, '').split('\n'); let html = '', i = 0;
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const head = cells(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      const nc = head.map((_, c) => body.length > 0 && body.every(r => !r[c] || isNum(r[c])));
      html += '<div class="tw"><table><thead><tr>' + head.map((h, c) => `<th${nc[c] ? ' class="n"' : ''}>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + head.map((_, c) => `<td${nc[c] ? ' class="n"' : ''}>${inline(r[c] || '')}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) { html += '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) html += '<li>' + inline(lines[i++].replace(/^\s*[-*]\s+/, '')) + '</li>'; html += '</ul>'; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { html += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) html += '<li>' + inline(lines[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'; html += '</ol>'; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^\s*(\||#|[-*]\s|\d+[.)]\s)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    html += '<p>' + para.map(inline).join('<br>') + '</p>';
  }
  return html;
}

function addMsg(role, content) {

async function chiedi(text) {
  if (C.busy || !text.trim()) return;
  if (!C.turni.length) $('#log').innerHTML = '';
  C.busy = true; $('#qs').disabled = true;
  C.turni.push({ role: 'user', content: text }); addMsg('user', text);
  const w = addMsg('assistant', ''); w.querySelector('.body').innerHTML = '<span class="muted"><i>Sto calcolando sui dati…</i></span>';
  try {
    const r = await api('POST', 'api/chiedi', { messaggi: C.turni });

    w.querySelector('.body').innerHTML = (r.passi.length ? `<div class="steps">${r.passi.map(p => '› ' + esc(p)).join('<br>')}</div>` : '') + md(r.testo)

}

const STATO_V = { trovato: 'Presentato', attesa: 'In attesa', non_trovato: 'Non trovato nel CRM' };
function drawLeadDash() {
  const D2 = LE.dash, F2 = LE.df;
  const anni = [...new Set(D2.righe.map(r => (r.data_lead || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  if (!anni.includes(F2.anno)) anni.unshift(F2.anno);
  // periodo: mese di arrivo del lead (per le chiamate) e mese in cui è stato fissato l'appuntamento (per gli appuntamenti)
  const inPer = d => !!d && d.startsWith(F2.anno) && (!F2.mese || d.slice(5, 7) === F2.mese);
  const filt = r => (!F2.setter || r.setter_nome === F2.setter) && (!F2.canale || r.marketing === F2.canale);
  const arrivati = D2.righe.filter(r => inPer(r.data_lead) && (!F2.canale || r.marketing === F2.canale));
  // chiamati = lead arrivati nel periodo con un esito diverso da «da chiamare» (il setter si segna solo sugli appuntamenti)
  const lavorati = arrivati.filter(r => r.esito !== 'DA CHIAMARE');
  const app = D2.righe.filter(r => r.esito === 'APPUNTAMENTO FISSATO' && inPer(r.data_fissato || r.data_lead) && filt(r));
  const vis = app.filter(r => r.visita?.stato === 'trovato'), att = app.filter(r => r.visita?.stato === 'attesa'), nt = app.filter(r => r.visita?.stato === 'non_trovato');
  const acc = vis.filter(r => r.visita.esito === 'A');
  const inc = vis.reduce((a, r) => a + r.visita.incassato, 0);
  const pct = (a, b) => b ? a / b : null;
  const tile = (t, v, b, low) => `<div class="card tile ${low ? 'low' : ''}"><div class="l">${t}</div><div class="v">${v}</div><div class="b">${b}</div></div>`;
  const gruppo = (key, rows) => { const m = new Map(); for (const r of rows) { const k = r[key] || 'Non indicato'; if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };
  const riga = (nome, ap, extra = '') => { const v = ap.filter(r => r.visita?.stato === 'trovato'), a = v.filter(r => r.visita.esito === 'A'), n = ap.filter(r => r.visita?.stato === 'non_trovato');
    return `<tr><td>${esc(nome)}</td>${extra}<td class="n">${ap.length}</td><td class="n">${v.length}</td><td class="n ${n.length ? 'low' : ''}">${n.length}</td><td class="n">${a.length}</td><td class="n">${fPct(pct(a.length, v.length))}</td><td class="n"><b>${fE(v.reduce((s, r) => s + r.visita.incassato, 0))}</b></td></tr>`; };
  const perSet = gruppo('setter_nome', app), perCan = gruppo('marketing', app), arrCan = gruppo('marketing', arrivati);
  const setterNomi = [...new Set(D2.righe.map(r => r.setter_nome).filter(Boolean))].sort();
  const canali = [...new Set(D2.righe.map(r => r.marketing).filter(Boolean))].sort();
  const cl = r => r.visita?.stato === 'non_trovato' ? 'eR' : r.visita?.stato === 'attesa' ? '' : r.visita?.esito === 'A' ? 'eA' : r.visita?.esito === 'S' ? 'eS' : '';
  const ordinati = app.slice().sort((a, b) => (b.data_app || b.data_fissato || '').localeCompare(a.data_app || a.data_fissato || ''));
  $('#main').innerHTML = leadHead() + `
  <div class="bar"><select data-dsf="anno" aria-label="Anno">${anni.map(a => opt(a, a, a === F2.anno)).join('')}</select>
    <select data-dsf="mese" aria-label="Mese"><option value="">Tutto l'anno</option>${MESI.map((m, i) => opt(String(i + 1).padStart(2, '0'), m, String(i + 1).padStart(2, '0') === F2.mese)).join('')}</select>
    <select data-dsf="setter" aria-label="Setter"><option value="">Tutti i setter</option>${setterNomi.map(n => opt(n, n, n === F2.setter)).join('')}</select>
    <select data-dsf="canale" aria-label="Canale"><option value="">Tutti i canali</option>${canali.map(n => opt(n, n, n === F2.canale)).join('')}</select></div>
  <div class="tiles">
    ${tile('Lead arrivati', fN(arrivati.length), `${fN(lavorati.length)} chiamati (${fPct(pct(lavorati.length, arrivati.length))})`)}
    ${tile('Appuntamenti fissati', fN(app.length), `${fPct(pct(arrivati.filter(r => r.esito === 'APPUNTAMENTO FISSATO').length, lavorati.length))} dei lead chiamati arrivati nel periodo`)}
    ${tile('Presentati (trovati nel CRM)', fN(vis.length), `${fPct(pct(vis.length, app.length - att.length))} degli appuntamenti già passati`)}
    ${tile('Non trovati nel CRM', fN(nt.length), 'Appuntamento passato, nessun preventivo con quel nome', nt.length > 0)}
    ${tile('Accettati', fN(acc.length), `${fPct(pct(acc.length, vis.length))} dei presentati`)}
    ${tile('Incassato dai lead', fE(inc), `Media ${fE(pct(inc, vis.length))} per lead presentato`)}
  </div>
  <p class="legend">Ogni appuntamento si cerca nel CRM per nome e cognome (tutte le parole, in qualsiasi ordine) tra i preventivi dalla settimana prima in poi, in tutte le sedi. <span style="color:var(--danger);font-weight:700">In rosso</span>: appuntamento passato e nessun preventivo con quel nome, come se non si fosse presentato. «In attesa»: appuntamento non ancora arrivato. Incassato = tutto il pagato del paziente nel CRM da quella data (anche rate dei dilazionati).</p>
  <h3 class="dsec">Per setter</h3>
  <div class="card dcard tw"><table class="t"><thead><tr><th>Setter</th><th class="n">Appuntamenti</th><th class="n">Presentati</th><th class="n">Non trovati</th><th class="n">Accettati</th><th class="n">% acc.</th><th class="n">Incassato</th></tr></thead>
    <tbody>${[...perSet].sort((a, b) => b[1].length - a[1].length).map(([n, ap]) => riga(n, ap)).join('') || '<tr><td colspan="7" class="muted">Nessun appuntamento nel periodo.</td></tr>'}</tbody></table></div>
  <h3 class="dsec">Per canale di arrivo</h3>
  <div class="card dcard tw"><table class="t"><thead><tr><th>Canale</th><th class="n">Lead arrivati</th><th class="n">Appuntamenti</th><th class="n">Presentati</th><th class="n">Non trovati</th><th class="n">Accettati</th><th class="n">% acc.</th><th class="n">Incassato</th></tr></thead>
    <tbody>${[...new Set([...arrCan.keys(), ...perCan.keys()])].sort((a, b) => (perCan.get(b)?.length || 0) - (perCan.get(a)?.length || 0)).map(n => riga(n, perCan.get(n) || [], `<td class="n">${arrCan.get(n)?.length || 0}</td>`)).join('') || '<tr><td colspan="8" class="muted">Nessun lead nel periodo.</td></tr>'}</tbody></table></div>
  <h3 class="dsec">Appuntamenti e visita nel CRM</h3>
  ${ordinati.length ? `<div class="card tw scroll"><table class="t"><thead><tr><th>Lead</th><th>Canale</th><th>Setter</th><th>Fissato il</th><th>Appuntamento</th><th>Visita nel CRM</th><th>Esito visita</th><th class="n">Piano di cura</th><th class="n">Incassato</th><th>Sede</th></tr></thead><tbody>
    ${ordinati.map(r => { const v = r.visita || {}; return `<tr class="${cl(r)}"><td><b>${esc(r.cognome)} ${esc(r.nome)}</b></td><td>${esc(r.marketing)}</td><td>${esc(r.setter_nome || '—')}</td><td>${fD(r.data_fissato)}</td><td>${fD(r.data_app)}</td>
      <td>${v.stato === 'non_trovato' ? `<b style="color:var(--danger)">${STATO_V[v.stato]}</b>` : v.stato === 'trovato' ? `${STATO_V[v.stato]} · ${fD(v.data)}${v.preventivi > 1 ? ` · ${v.preventivi} preventivi` : ''}` : `<span class="muted">${STATO_V[v.stato] || '—'}</span>`}</td>
      <td>${v.esito ? `<b>${esc(v.esito)} — ${ESITI[v.esito]}</b>` : '—'}</td><td class="n">${v.stato === 'trovato' ? fE(v.pdc) : '—'}</td><td class="n"><b>${v.stato === 'trovato' ? fE(v.incassato) : '—'}</b></td><td>${esc(v.sede || '')}</td></tr>`; }).join('')}
    <tr><td colspan="8"><b>Totale incassato dai lead</b></td><td class="n"><b>${fE(inc)}</b></td><td></td></tr></tbody></table></div>`
    : '<div class="card empty"><b>Nessun appuntamento nel periodo</b>Gli appuntamenti compaiono quando l\'esito della chiamata è «APPUNTAMENTO FISSATO».</div>'}`;
}

    ${lista(t) || '<p class="muted">Nessuna voce.</p>'}
    ${(n => n ? `<button class="btn sm" type="button" data-nasc="${t}" style="margin-top:10px;border:0;background:none;color:var(--muted);text-decoration:underline">${LI.nascoste === t ? 'Chiudi le voci nascoste' : 'Voci nascoste: ' + n}</button>` : '')(d.liste[t].filter(x => !x.attivo).length)}</div>`).join('')}</div>
  ${personeSediHtml()}${setterHtml()}${metaHtml()}${controlloVendHtml()}
  <datalist id="dl-pers">${(d.persone || []).map(u => `<option value="${esc(persLab(u))}">`).join('')}</datalist>`;
}
// persona dell'anagrafica dal testo scritto: nome esatto, oppure l'unica che contiene tutte le parole
function personaDa(testo) {
  const v = String(testo || '').trim().toLowerCase(), P = LI.d.persone || [];
  if (!v) return null;
  return P.find(x => persLab(x).toLowerCase() === v) || P.find(x => x.nome.toLowerCase() === v)
    || (c => c.length === 1 ? c[0] : undefined)(P.filter(x => v.split(/\s+/).every(w => persLab(x).toLowerCase().includes(w))));
}
// Setter di Gestione lead
function setterHtml() {
  const st = LI.d.setter || [];
  return `<div class="card sez" style="margin-top:12px"><h3>Setter (Gestione lead)</h3>
    <p class="muted" style="margin-top:0;font-size:13px">Chi è qui vede la sezione Gestione lead (anche senza la micro app in Gestione accessi) e compare nel menu «Setter» degli appuntamenti.</p>
    ${st.map(x => `<div class="lrow"><span class="nm">${esc(x.nome)}</span><button class="btn sm" type="button" data-settogli="${esc(x.user_id)}">Togli</button></div>`).join('') || '<p class="muted">Nessun setter.</p>'}
    <div class="bar" style="margin-top:10px"><input id="set-add" list="dl-pers" placeholder="Scrivi il nome e scegli dall'elenco" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px"><button class="btn sm primary" type="button" id="set-ok">Aggiungi setter</button></div></div>`;
}
// Lead da Meta: stato del collegamento, setter per sede, recupero degli ultimi giorni
function metaHtml() {
  const m = LI.meta; if (!m) return '';
  const n = k => (m.conteggi.find(x => x.esito === k) || {}).n || 0;
  const ult = m.conteggi.map(x => x.ultimo).filter(Boolean).sort().pop();
  return `<div class="card sez" style="margin-top:12px"><h3>Lead da Meta (Facebook / Instagram)</h3>
    <p class="muted" style="margin-top:0;font-size:13px">${m.configurato
      ? `Collegato (${m.pagine} ${m.pagine === 1 ? 'pagina' : 'pagine'}). Ricevuti: ${n('inserito')} nuovi, ${n('doppione')} già presenti${ult ? ' · ultimo il ' + new Date(ult).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : ''}.`
      : 'Non ancora collegato: si configura insieme con l\'accesso Meta.'}
      I lead entrano da soli in Gestione lead con canale META; la sede si prende dal modulo o dal nome della campagna.</p>
    <p class="muted" style="font-size:13px;margin:0 0 6px"><b>Setter per sede</b>: a chi va subito il lead di quella sede.</p>
    ${m.sedi.map(s => `<div class="lrow"><span class="nm">${esc(s.nome)}</span><select data-msede="${esc(s.id)}" aria-label="Setter di ${esc(s.nome)}"><option value="">Da assegnare</option>${m.setter.map(x => `<option value="${esc(x.user_id)}" ${m.setterSede[s.id] === x.user_id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>`).join('')}
    ${m.configurato ? '<div class="bar" style="margin-top:10px"><button class="btn sm" type="button" id="meta-rec">Recupera i lead degli ultimi 7 giorni</button></div>' : ''}
  </div>`;
}
document.addEventListener('change', async e => {
  const s = e.target.closest('[data-msede]'); if (!s) return;
  try { LI.meta.setterSede = (await api('PUT', 'api/meta/setter-sede', { sedeId: s.dataset.msede, userId: s.value })).setterSede; toast('Setter della sede salvato.'); } catch (y) { toast(y.message); }
});
document.addEventListener('click', async e => {
  if (e.target.id !== 'meta-rec') return;
  e.target.disabled = true;
  try { const o = await api('POST', 'api/meta/recupera', { giorni: 7 }); toast(`Recuperati: ${o.inserito} nuovi, ${o.doppione} già presenti${o.errori ? ', ' + o.errori + ' non letti' : ''}.`, 5000); LI.meta = await api('GET', 'api/meta/stato'); drawListe(); }
  catch (y) { toast(y.message); e.target.disabled = false; }
});
// Controllo venditori: per sede, i nomi scritti nei preventivi e a chi vanno nella classifica. Il collegamento vale solo in quella sede.
function controlloVendHtml() {
  const d = LI.d, cs = d.commSede || [], va = d.vendAnno || { righe: [] };
  const sedi = [...new Set([...cs.map(r => r.sede_nome), ...va.righe.map(r => r.sede)])].sort((a, b) => a.localeCompare(b, 'it'));
  const pers = id => (d.persone || []).find(x => x.id === id);
  const blocco = sede => {
    const rs = cs.filter(r => r.sede_nome === sede), cl = va.righe.filter(r => r.sede === sede);
    return `<details class="fd"><summary>${esc(sede)} · ${cl.map(r => `${esc(r.venditore)} ${r.n}`).join(' · ') || 'nessun preventivo nel ' + va.anno}</summary>
      <p class="muted" style="margin:0 0 6px;font-size:13px">Classifica venditori ${va.anno} di questa sede (come in Dashboard dati): ${cl.map(r => `<b>${esc(r.venditore)}</b> ${r.n}`).join(', ') || '—'}.</p>
      <div class="tw"><table class="t"><thead><tr><th>Nome scritto nei preventivi</th><th class="n">Preventivi</th><th>Risulta come</th><th>Collega solo in ${esc(sede)}</th></tr></thead><tbody>
      ${rs.map(r => `<tr><td><b>${esc(r.nome)}</b> <span class="muted" style="font-size:12px">${r.origine === 'app' ? 'inseriti nell\'app' : 'vecchio foglio'}</span></td><td class="n">${r.n}</td><td>${esc(r.risulta)}</td>
        <td>${r.origine === 'app' ? '<span class="muted" style="font-size:12.5px">Vale il commerciale scelto nel modulo</span>' : `<input data-asede="${esc(r.sede_id)}|${esc(r.nome)}" list="dl-pers" value="${esc(r.sedeAlias ? persLab(pers(r.sedeAlias)) || r.risulta : '')}" placeholder="(collegamento generale)" style="min-width:220px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-height:36px">`}</td></tr>`).join('')}</tbody></table></div></details>`;
  };
  return `<div class="card sez" style="margin-top:12px"><h3>Controllo venditori per sede</h3>
    <p class="muted" style="margin-top:0;font-size:13px">Per ogni sede: i nomi dei commerciali scritti nei preventivi, quanti sono e a chi vanno nella classifica. I preventivi inseriti nell'app vanno sempre al commerciale scelto nel modulo. Per i nomi del vecchio foglio, se un nome è della persona sbagliata collegalo qui: vale solo in quella sede. Per le righe del vecchio foglio da gennaio a luglio 2026 conta il commerciale unico dello studio.</p>
    ${sedi.map(blocco).join('') || '<p class="muted">Nessun preventivo.</p>'}</div>`;
}
// Commerciali e medici per sede: in quali sedi compaiono nel modulo e nei Richiami. Vale solo nel CRM.
function personeSediHtml() {
  const d = LI.d, P = d.personeSedi || [], S2 = d.sediTutte || [];
  const riga = u => `<div class="prow"><span class="nm">${esc(u.nome)} <span class="muted" style="font-weight:500">· ${esc(u.figura)}</span></span>
    <span style="display:flex;gap:6px;flex-wrap:wrap">${S2.map(x => `<button type="button" class="psc ${u.sedi.includes(x.id) ? 'on' : ''}" data-psede="${esc(u.id)}|${esc(x.id)}">${esc(x.nome)}</button>`).join('')}</span>
    ${u.crm ? `<button class="btn sm" type="button" data-prip="${esc(u.id)}" title="Torna alle sedi scritte in Gestione accessi" style="border:0;background:none;color:var(--muted);text-decoration:underline">Come in Gestione accessi</button>` : ''}</div>`;
  const gr = (t, arr) => arr.length ? `<h4 style="margin:14px 0 2px">${t}</h4>${arr.map(riga).join('')}` : '';
  return `<div class="card sez" style="margin-top:12px"><h3>Commerciali e medici per sede</h3>
    <p class="muted" style="margin-top:0;font-size:13px">Tocca una sede per aggiungere o togliere la persona: compare subito nel modulo di inserimento e nella modifica dei Richiami di quella sede. Vale solo nel CRM, non cambia Gestione accessi.</p>
    ${gr('Commerciali', P.filter(u => u.figura !== 'Medico'))}${gr('Medici', P.filter(u => u.figura === 'Medico'))}
    ${P.length ? '' : '<p class="muted">Nessun commerciale o medico attivo in Gestione accessi.</p>'}</div>`;
}
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-add]'); if (!f) return; e.preventDefault();
  try { await api('POST', 'api/liste/voce', { tipo: f.dataset.add, valore: f.v.value }); toast('Voce aggiunta.'); S.st = await api('GET', 'api/stato'); vListe(); } catch (x) { toast(x.message); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.canale !== undefined) {
    const x = LI.d.liste.marketing.find(v => v.valore === t.dataset.canale);
    try { await api('POST', 'api/liste/voce', { tipo: 'marketing', valore: x.valore, canale: t.value, attivo: x.attivo }); x.canale = t.value.trim(); toast('Salvato.'); } catch (y) { toast(y.message); }
  }
  if (t.dataset.alias !== undefined) {
    // si scrive il nome e si sceglie dall'elenco; vuoto = nessuna persona
    const v = t.value.trim().toLowerCase(), P = LI.d.persone;
    // nome esatto, oppure l'unica persona che contiene le parole scritte
    const u = !v ? null : P.find(x => persLab(x).toLowerCase() === v) || P.find(x => x.nome.toLowerCase() === v)
      || (c => c.length === 1 ? c[0] : null)(P.filter(x => v.split(/\s+/).every(w => persLab(x).toLowerCase().includes(w))));
    if (v && !u) { toast('Non trovo una sola persona con quel nome: scegli dall\'elenco che compare mentre scrivi.'); t.value = persLab(LI.d.persone.find(x => x.id === LI.d.alias[t.dataset.alias])); return; }
    try { await api('POST', 'api/liste/alias', { nome: t.dataset.alias, userId: u ? u.id : '' }); LI.d.alias[t.dataset.alias] = u ? u.id : ''; t.value = persLab(u); toast(u ? 'Collegato a ' + u.nome + '.' : 'Collegamento tolto.'); } catch (y) { toast(y.message); }
  }
  if (t.dataset.asede !== undefined) {
    const [sedeId, nome] = t.dataset.asede.split(/\|(.*)/s), u = personaDa(t.value);
    if (t.value.trim() && !u) { toast('Non trovo una sola persona con quel nome: scegli dall\'elenco che compare mentre scrivi.'); return; }
    try { await api('POST', 'api/liste/alias-sede', { nome, sedeId, userId: u ? u.id : '' }); toast(u ? `${nome} → ${u.nome}, solo in questa sede.` : 'Collegamento della sede tolto.'); vListe(); } catch (y) { toast(y.message); }
  }
  if (t.id === 'fin-az') { try { await api('PUT', 'api/liste/azienda', { azienda: t.value }); toast('Azienda salvata.'); } catch (y) { toast(y.message); } }
});
document.addEventListener('click', async e => {
  const ps = e.target.closest('[data-psede]'), pr = e.target.closest('[data-prip]');
  if (ps || pr) {
    const [uid, sid] = (ps ? ps.dataset.psede : pr.dataset.prip).split('|'), u = LI.d.personeSedi.find(x => x.id === uid);
    const body = pr ? { userId: uid, ripristina: true } : { userId: uid, sedi: u.sedi.includes(sid) ? u.sedi.filter(x => x !== sid) : [...u.sedi, sid] };
    if (ps && !body.sedi.length && !confirm(`${u.nome} non comparirà in nessuna sede del CRM. Va bene?`)) return;
    try { LI.d.personeSedi = (await api('PUT', 'api/liste/persona-sedi', body)).personeSedi; Object.keys(persone).forEach(k => delete persone[k]); drawListe();
      toast(pr ? 'Sedi come in Gestione accessi.' : 'Sedi aggiornate.'); } catch (y) { toast(y.message); }
    return;
  }
  const sg = e.target.closest('[data-settogli]');
  if (sg || e.target.id === 'set-ok') {
    const u = sg ? { id: sg.dataset.settogli } : personaDa($('#set-add').value);
    if (!u) return toast('Scrivi il nome e scegli la persona dall\'elenco.');
    try { LI.d.setter = (await api('POST', 'api/liste/setter', { userId: u.id, togli: !!sg })).setter; drawListe(); toast(sg ? 'Setter tolto.' : 'Setter aggiunto.'); } catch (y) { toast(y.message); }
    return;
  }
  const nb = e.target.closest('[data-nasc]'); if (nb) { LI.nascoste = LI.nascoste === nb.dataset.nasc ? null : nb.dataset.nasc; return drawListe(); }
  const r = e.target.closest('[data-ren]'), a = e.target.closest('[data-att]');
  if (r || a) {
    const [tipo, val] = (r || a).dataset[r ? 'ren' : 'att'].split(/\|(.*)/s);
    const x = LI.d.liste[tipo].find(v => v.valore === val);
    let body = { tipo, valore: x.valore, canale: x.canale, attivo: x.attivo };
    if (r) { const n = prompt(`Nuovo nome per «${x.valore}» (cambia anche nei preventivi già salvati):`, x.valore); if (!n || n.trim().toUpperCase() === x.valore) return; body = { ...body, prima: x.valore, valore: n }; }
    else body.attivo = !x.attivo;
    try { const o = await api('POST', 'api/liste/voce', body); toast(o.aggiornati != null ? `Rinominata (${o.aggiornati} preventivi aggiornati).` : body.attivo ? 'Voce rimessa.' : 'Voce nascosta dal modulo.'); S.st = await api('GET', 'api/stato'); vListe(); } catch (y) { toast(y.message); }
    return;
  }
  if (e.target.id === 'imp-go') {
    const f = $('#imp-f').files[0]; if (!f) return toast('Scegli il file .xlsx.');
    const fd = new FormData(); fd.append('file', f); fd.append('anno', $('#imp-a').value);
    e.target.disabled = true; e.target.textContent = 'Lettura del file…'; $('#imp-out').innerHTML = '';
    try { LI.prev = await api('POST', 'api/liste/importa/anteprima', fd); drawAnteprima(); }
    catch (x) { $('#imp-out').innerHTML = `<div class="err">${esc(x.message)}</div>`; }
    e.target.disabled = false; e.target.textContent = 'Leggi il file (anteprima)';
  }
  if (e.target.id === 'imp-ok') {
    const sost = $('#imp-sost')?.checked;
    if (LI.prev.giaImportate && !sost) return toast('Spunta la casella per sostituire le righe importate prima.');
    e.target.disabled = true; e.target.textContent = 'Importazione…';
    try { const o = await api('POST', 'api/liste/importa/conferma', { token: LI.prev.token, sostituisci: !!sost }); toast(`Importati ${o.righe.toLocaleString('it-IT')} preventivi.`, 5000); LI.prev = null; S.st = await api('GET', 'api/stato'); vListe(); }
    catch (x) { e.target.disabled = false; e.target.textContent = 'Importa'; toast(x.message, 6000); }
  }
});
function drawAnteprima() {
  const p = LI.prev, sc = p.scartate, sconosc = Object.entries(sc.sedeSconosciuta || {});
  $('#imp-out').innerHTML = `<div class="ok-box">Letto: ${p.fogli} fogli «Dati Grezzi», <b>${p.righe.toLocaleString('it-IT')}</b> righe da importare per il ${p.anno}. Non è ancora stato salvato niente.</div>
  <div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Sede</th><th class="n">Righe</th><th class="n">A</th><th class="n">S</th><th class="n">R</th><th class="n">Senza esito</th><th class="n">Dilazionati</th><th class="n">Piani di cura</th><th>Mesi</th></tr></thead>
  <tbody>${p.riepilogo.map(r => `<tr><td><b>${esc(r.sede)}</b></td><td class="n">${r.righe}</td><td class="n">${r.A}</td><td class="n">${r.S}</td><td class="n">${r.R}</td><td class="n">${r.senzaEsito}</td><td class="n">${r.dilazionati}</td><td class="n">${fE(r.pdc)}</td><td>${r.mesi.map(m => MESI[m - 1].slice(0, 3)).join(', ')}</td></tr>`).join('')}</tbody></table></div>
  <ul style="font-size:14px">${sc.eInR ? `<li>${sc.eInR} esiti «E» diventano <b>R</b> (Rifiutato).</li>` : ''}${sc.tertenia ? `<li>${sc.tertenia} righe di Tertenia non si importano.</li>` : ''}
    ${sconosc.length ? `<li class="req">Sedi non trovate in Gestione accessi (righe non importate): ${sconosc.map(([n, c]) => `${esc(n)} (${c})`).join(', ')}.</li>` : ''}
    ${sc.altriEsiti ? `<li>${sc.altriEsiti} righe con un esito diverso da A, S, R, E restano senza esito.</li>` : ''}
    ${p.marketingNuovi ? `<li>Dal foglio «_Liste»: ${p.marketingNuovi} canali marketing (i nuovi si aggiungono all'elenco).</li>` : ''}</ul>
  ${p.giaImportate ? `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" id="imp-sost"> <span>Nel CRM ci sono già <b>${p.giaImportate}</b> righe importate prima: <b>sostituiscile</b> con queste. Le vecchie vanno in archivio (non si cancellano); i preventivi inseriti nell'app restano.</span></label>` : ''}
  <button class="btn primary" id="imp-ok" type="button">Importa</button>`;
}

boot();
</script>
</body>
