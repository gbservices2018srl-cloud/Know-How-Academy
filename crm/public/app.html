<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4CAAAA">
<base href="/crm/">
<title>CRM Commerciale · To Smile</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:400,500,600,700,800">
<style>
/* Colori e caratteri To Smile (gli stessi di Comunicazioni, Calendario e Turni), con tema scuro automatico */
:root{
  --bg:#EFF5F5; --dot:#D3E2E2; --surface:#FFFFFF; --surface-2:#F5F9F9; --surface-3:#EAF1F1; --fg:#1F2A2B; --muted:#5E6B6C;
  --line:#DCE7E7; --accent:#2B8384; --accent-soft:#DCEFEF; --accent-fg:#FFFFFF;
  --brand-teal:#4CAAAA; --brand-purple:#8C6898; --brand-yellow:#E8E564; --purple-soft:#EFE7F2;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#8A4A12; --warn-soft:#FBEBDD;
  --shadow:0 1px 2px rgba(20,48,48,.05),0 8px 28px rgba(20,48,48,.09);
  --f-display:"Fira Sans",system-ui,sans-serif; --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101818; --dot:#1E2B2B; --surface:#172121; --surface-2:#1D2929; --surface-3:#223030; --fg:#E7F0F0; --muted:#9FB0B0;
  --line:#2A3939; --accent:#62C3C3; --accent-soft:#163536; --accent-fg:#062222;
  --brand-teal:#62C3C3; --brand-purple:#B597C2; --purple-soft:#2E2433;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#6FD39C; --ok-soft:#173326; --warn:#F0B07A; --warn-soft:#3A2817;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-attachment:fixed;
  color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 -1px color-mix(in srgb,var(--brand-yellow) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{height:40px;width:auto;flex:none;display:block}
.brand .sep{width:1px;height:26px;background:var(--line);flex:none}
.brand h1{font:600 16px/1.1 var(--f-display);margin:0;white-space:nowrap;color:var(--muted)}
@media (max-width:900px){.brand h1,.brand .sep{display:none}.who b{display:none}.who{padding:3px}}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;text-decoration:none}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;flex:none;min-height:40px;text-decoration:none;color:inherit}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) max(48px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:inherit;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.wide{min-height:52px;font-size:16px;width:100%}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px;min-height:38px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
h2.view{font:700 26px/1.15 var(--f-display);letter-spacing:-.015em;margin:0}
h3{font:700 17px/1.2 var(--f-display);margin:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head p{margin:4px 0 0;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ko{background:var(--danger-soft);color:var(--danger)}
.tag.todo{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--surface-3);color:var(--muted)}
.tag.q{background:var(--purple-soft);color:var(--brand-purple)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.avvisi{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.avviso{display:flex;gap:8px;align-items:flex-start;padding:8px 11px;border-radius:10px;font-size:14px;font-weight:600}
.avviso.rosso{background:var(--danger-soft);color:var(--danger)}
.avviso.giallo{background:var(--warn-soft);color:var(--warn)}
/* pagina d'ingresso */
.hello{font:800 28px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.big{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:200px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 55%,var(--line))}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--bc)}
.big .bi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 16%,transparent);color:var(--bc)}
.big .bi svg{width:28px;height:28px}
.big h2{font:800 21px/1.15 var(--f-display);margin:0}
.big p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.big .st{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big .go{color:var(--accent);font-weight:700}
/* moduli */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-weight:700;font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;min-height:42px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.ko{background:var(--danger);color:#fff}
.seg button.on.att{background:var(--brand-purple);color:#fff}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:92vw;box-shadow:var(--shadow)}
dialog.dlg{border:0;border-radius:22px;padding:0;width:min(480px,94vw);background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
dialog.dlg::backdrop{background:rgba(10,30,30,.45);backdrop-filter:blur(2px)}
.dlg .dh{display:flex;gap:14px;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg .db{padding:14px 20px}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
/* misure implantari */
/* ---------- CRM Commerciale ---------- */
@media (max-width:700px){.top{flex-wrap:wrap;row-gap:6px}.tabs{order:3;flex-basis:100%}.who{margin-left:auto}}
details.fd>summary{cursor:pointer;font-weight:700;color:var(--accent);margin:2px 0 10px;min-height:32px;list-style:none;display:flex;align-items:center;gap:6px}
details.fd>summary::-webkit-details-marker{display:none}
details.fd>summary::before{content:"▸"}details.fd[open]>summary::before{content:"▾"}
main{max-width:1180px}
.esiti{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.esiti button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:46px;font-weight:700;color:var(--muted)}
.esiti button.on.A,.es.A{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.esiti button.on.S,.es.S{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.esiti button.on.R,.es.R{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.sez{padding:16px 18px;margin-bottom:14px}
.sez h3{margin-bottom:12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-purple)}
.cnt{font-size:12.5px;color:var(--danger);font-weight:600}.cnt.ok{color:var(--ok)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:40px}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.form{max-width:760px;margin:0 auto}
.req{color:var(--danger)}
.nota-sedi{font-size:12.5px;color:var(--muted);margin-top:4px}
/* filtri e tabelle */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.fil{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.fil select,.bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;font-size:14px}
.fil select.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.bar select{width:auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t td.n,.t th.n{text-align:right}
.t td.wrap{white-space:normal;min-width:160px}
.t tr:hover td{background:var(--surface-2)}
.t th button{all:unset;cursor:pointer}
.t th[aria-sort] button::after{content:" ▾"}.t th[aria-sort=ascending] button::after{content:" ▴"}
.t td.low{color:var(--danger);font-weight:700}
.es{border:1.5px solid var(--line);border-radius:9px;padding:5px 8px;font-weight:800;min-height:36px;background:var(--surface-2)}
.notab{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 10px;min-height:36px;max-width:240px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
.tot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:2px 0 10px}
.tot b{color:var(--fg)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:8px}
.tile{padding:14px 16px}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font:800 28px/1.15 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.low{border-color:var(--danger)}.tile.low .v{color:var(--danger)}
.tile.fin{background:linear-gradient(135deg,var(--purple-soft),var(--surface))}
.take{margin:4px 0 16px;color:var(--muted)}
.dsec{margin:22px 0 10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.dgrid.sm{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dcard{padding:14px 16px;min-width:0}
.dcard h4{margin:0 0 4px;font:700 15px/1.2 var(--f-display)}
.dnote{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.scroll{max-height:26rem;overflow:auto}
.legend{font-size:12.5px;color:var(--muted)}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:5px;vertical-align:middle}
svg.ch text{font-size:11.5px;fill:var(--muted)}
svg.ch .lab{fill:var(--fg)}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto}
.msg{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .who2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg.u{align-items:flex-end}
.msg.u .body{background:var(--accent);color:var(--accent-fg);border-radius:14px 14px 4px 14px;padding:8px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.b .body{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 16px;min-width:0;overflow-wrap:anywhere}
.body p{margin:.5em 0}.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}
.body table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.body th,.body td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.body td.n,.body th.n{text-align:right}
.steps{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;max-height:160px;min-height:46px}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;text-align:left}
.qchips button:hover{border-color:var(--accent);background:var(--accent-soft)}
/* liste */
.lrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow .nm{flex:1 1 120px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lrow .btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.lrow input[data-canale]{order:5;flex:1 1 100%!important}
.lrow .nm.off{color:var(--muted);text-decoration:line-through}
.lrow input{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 9px;min-height:36px}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.lists .card{max-height:34rem;overflow:auto}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="CRM Commerciale, inizio"><img class="logo" src="logo.png" alt="To Smile" width="543" height="162"><span class="sep"></span><h1>CRM Commerciale</h1></a>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <a class="who" id="who" href="/" title="Torna alle app"></a>
</header>
<main id="main"><div class="empty">Caricamento…</div></main>
<dialog class="dlg" id="dlg" aria-label="Note"></dialog>
<div class="toast" id="toast" hidden role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(method, url, body) {
  const isForm = body instanceof FormData;
  const r = await fetch(url, { method, credentials: 'include', headers: body && !isForm ? { 'Content-Type': 'application/json' } : {}, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/accedi?next=' + encodeURIComponent(location.href); throw new Error('Accesso richiesto'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Errore, riprova.'), { status: r.status });
  return j;
}
let toastT;
function toast(t, ms = 3500) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
// punto delle migliaia anche sotto 10.000 (12.450 €, 2.669 €)
const mig = n => { const r = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < -0.5 ? '−' : '') + r; };
const fE = x => x == null ? '—' : mig(x) + ' €';
const fPct = x => x == null ? '—' : (x * 100).toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const fN = x => x == null ? '—' : Number(x).toLocaleString('it-IT', { maximumFractionDigits: 1 });
const fD = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const ESITI = { A: 'Accettato', S: 'Sospeso', R: 'Rifiutato' };
const SEZ = [['preventivi', 'Inserimento Preventivi'], ['richiami', 'Richiami commerciali'], ['dashboard', 'Dashboard dati'], ['chiedi', 'Chiedi al CRM'], ['liste', 'Liste']];

const S = { st: null, v: null };
async function boot() {
  try { S.st = await api('GET', 'api/stato'); } catch (x) { $('#main').innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  const n = S.st.me.nome || '';
  $('#who').innerHTML = `<span class="av">${esc(n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase())}</span><b>${esc(n.split(' ')[0])}</b>`;
  $('#who').href = S.st.home || '/';
  const vis = SEZ.filter(([k]) => S.st.perm[k]);
  const want = new URLSearchParams(location.search).get('v');
  go(vis.some(([k]) => k === want) ? want : vis[0][0], true);
}
function go(v, replace) {
  S.v = v;
  const u = new URL(location.href); u.searchParams.set('v', v);
  history[replace ? 'replaceState' : 'pushState']({ v }, '', u);
  $('#tabs').innerHTML = SEZ.filter(([k]) => S.st.perm[k]).map(([k, t]) => `<button class="tab ${k === v ? 'on' : ''}" data-go="${k}">${esc(t)}</button>`).join('');
  ({ preventivi: vPrev, richiami: vRich, dashboard: vDash, chiedi: vChiedi, liste: vListe })[v]();
}
window.addEventListener('popstate', e => { if (e.state?.v) go(e.state.v, true); });

const perLabel = (p, a) => p === 'anno' ? 'Anno ' + a : p[0] === 'q' ? p.slice(1) + '° trimestre ' + a : MESI[+p.slice(1) - 1] + ' ' + a;
const perOrder = p => p === 'anno' ? 1000 : p[0] === 'q' ? 100 + +p.slice(1) : +p.slice(1);
const suffix = p => p[0] === 'm' ? '_mese' : p[0] === 'q' ? '_trim' : '_anno';
const fmtOf = { dilazionati: fE, preventivato: fE, presentati: fN, accettati: fN, perc: fPct, ticket: fE, pagato: fE, nome: x => x ?? '—', sede: x => x ?? '—', sedi: x => x || '—' };

function bars(data, label, ref, val = d => d.perc, fmt = fPct) {
  if (!data.length) return '<div class="empty" style="padding:14px">Nessun dato per questo periodo.</div>';
  const W = 520, barH = 20, gap = 7, top = 6, left = 150, right = 70, H = top + data.length * (barH + gap) + 18;
  const max = Math.max(...data.map(val), ref || 0, 0.0001);
  const x = v => left + (W - left - right) * (v / max);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  data.forEach((d, i) => {
    const y = top + i * (barH + gap), v = val(d), low = ref != null && v < ref;
    let l = label(d); if (l.length > 24) l = l.slice(0, 23) + '…';
    s += `<text class="lab" x="${left - 8}" y="${y + barH / 2}" dy="0.35em" text-anchor="end">${esc(l)}</text>
      <rect x="${left}" y="${y}" width="${Math.max(2, x(v) - left)}" height="${barH}" rx="4" fill="${low ? 'var(--danger)' : 'var(--brand-teal)'}"><title>${esc(label(d))}: ${esc(fmt(v))}</title></rect>
      <text x="${x(v) + 6}" y="${y + barH / 2}" dy="0.35em" style="fill:${low ? 'var(--danger)' : 'var(--fg)'}">${esc(fmt(v))}</text>`;
  });
  if (ref != null) s += `<line x1="${x(ref)}" x2="${x(ref)}" y1="${top - 3}" y2="${H - 14}" stroke="var(--brand-purple)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return s + '</svg>';
}
function linea(pts, f, fmt, refV, periodo, col) {
  if (!pts.length) return '<div class="empty" style="padding:14px">Nessun dato.</div>';
  const W = 320, H = 170, top = 12, bottom = 22, left = 46, right = 10;
  const max = Math.max(...pts.map(d => d[f]), refV || 0, f === 'perc' ? 0.05 : 1) * 1.1;
  const y = v => H - bottom - (H - top - bottom) * (v / max), x = i => pts.length === 1 ? (left + W - right) / 2 : left + (W - left - right) * i / (pts.length - 1);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0, .5, 1].forEach(t => { const v = max * t; s += `<line x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left - 5}" y="${y(v)}" dy="0.35em" text-anchor="end">${esc(f === 'perc' ? Math.round(v * 100) + '%' : v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v))}</text>`; });

const C = { turni: [], busy: false };
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
const isNum = s => /^[\s\-+]?[€]?\s?[\d.,]+\s?(€|%)?\s*$/.test(s) && /\d/.test(s);
function md(src) {
  const lines = String(src).replace(/\r/g, '').split('\n'); let html = '', i = 0;

      html += '<div class="tw"><table><thead><tr>' + head.map((h, c) => `<th${nc[c] ? ' class="n"' : ''}>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + head.map((_, c) => `<td${nc[c] ? ' class="n"' : ''}>${inline(r[c] || '')}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) { html += '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) html += '<li>' + inline(lines[i++].replace(/^\s*[-*]\s+/, '')) + '</li>'; html += '</ul>'; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { html += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) html += '<li>' + inline(lines[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'; html += '</ol>'; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^\s*(\||#|[-*]\s|\d+[.)]\s)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);

  <div class="card sez"><h3>Importa dal foglio Google</h3>
    <p style="margin-top:0">Nel CRM ci sono <b>${tot.toLocaleString('it-IT')}</b> preventivi (${(d.totali.import || 0).toLocaleString('it-IT')} importati, ${(d.totali.app || 0).toLocaleString('it-IT')} inseriti nell'app).</p>
    <ol style="margin:0 0 12px;padding-left:20px"><li>Dal computer apri il foglio <b>To_Smile_CRM_MASTER2026</b> su Google.</li><li><b>File → Scarica → Microsoft Excel (.xlsx)</b>.</li><li>Caricalo qui sotto: il file si legge sul server in Europa e non si salva. Prima di importare vedi il riepilogo.</li></ol>
    <div class="grid2"><div class="field"><label for="imp-f">File .xlsx</label><input type="file" id="imp-f" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
      <div class="field"><label for="imp-a">Anno dei dati</label><input id="imp-a" inputmode="numeric" value="2026" maxlength="4"></div></div>
    <button class="btn primary" id="imp-go" type="button">Leggi il file (anteprima)</button>
    <div id="imp-out" style="margin-top:12px"></div>
    ${d.importazioni.length ? `<p class="muted" style="font-size:13px;margin-bottom:0">Ultime importazioni: ${d.importazioni.map(i => `${new Date(i.fatto_il).toLocaleDateString('it-IT')} · ${i.righe} righe · ${esc(i.fatto_da)}`).join(' — ')}</p>` : ''}</div>
  <div class="card sez"><h3>Gestione finanziaria</h3>
    <p style="margin-top:0">Azienda da cui prendere i tassi di finanziamento verso pazienti per la Dashboard dati.</p>
    ${d.finErr ? `<div class="err">${esc(d.finErr)}</div>` : `<select id="fin-az" class="btn"><option value="">${d.finAuto ? 'Automatica: ' + esc((d.aziende.find(a => a.id === d.finAuto) || {}).nome || '') : '— Scegli —'}</option>${d.aziende.map(a => opt(a.id, a.nome, a.id === d.finAzienda)).join('')}</select>`}</div>
  ${d.commGrezzi.length ? `<div class="card sez"><h3>Commerciali del vecchio foglio</h3>
    <p style="margin-top:0">Nel foglio Google il commerciale era scritto a mano (es. «LUCA»). Collegalo alla persona: nella Dashboard e nei filtri diventa una riga sola con i preventivi nuovi. Vuoto = resta il nome scritto.</p>
    ${d.commGrezzi.map(g => `<div class="lrow"><span class="nm">${esc(g.nome)} <span class="muted" style="font-weight:500">· ${g.n} preventivi</span></span>
      <select data-alias="${esc(g.nome)}" style="flex:1 1 220px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-height:38px;background:var(--surface-2)"><option value="">— nessuna persona —</option>
      ${d.persone.map(u => opt(u.id, u.nome + (u.figura ? ' · ' + u.figura : ''), d.alias[g.nome] === u.id)).join('')}</select></div>`).join('')}</div>` : ''}
  <div class="lists">${['tipo_ov', 'marketing', 'tipo_pdc'].map(t => `<div class="card sez"><h3>${NOMI_L[t]}</h3>
    ${t === 'marketing' ? '<p class="muted" style="margin-top:0;font-size:13px">«Nome nella dashboard» unisce più voci in un solo canale (es. ORALPRO e ORAL PRO → Oral Pro). Vuoto = la voce stessa.</p>' : ''}
    ${t === 'tipo_pdc' ? '<p class="muted" style="margin-top:0;font-size:13px">Suggerimenti nel modulo: si può sempre scrivere un tipo nuovo.</p>' : ''}
    <form class="bar" data-add="${t}"><input name="v" placeholder="Nuova voce" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px"><button class="btn sm primary">Aggiungi</button></form>
    ${lista(t) || '<p class="muted">Nessuna voce.</p>'}</div>`).join('')}</div>`;
}
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-add]'); if (!f) return; e.preventDefault();
  try { await api('POST', 'api/liste/voce', { tipo: f.dataset.add, valore: f.v.value }); toast('Voce aggiunta.'); S.st = await api('GET', 'api/stato'); vListe(); } catch (x) { toast(x.message); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.canale !== undefined) {
    const x = LI.d.liste.marketing.find(v => v.valore === t.dataset.canale);
    try { await api('POST', 'api/liste/voce', { tipo: 'marketing', valore: x.valore, canale: t.value, attivo: x.attivo }); x.canale = t.value.trim(); toast('Salvato.'); } catch (y) { toast(y.message); }
  }
  if (t.dataset.alias !== undefined) { try { await api('POST', 'api/liste/alias', { nome: t.dataset.alias, userId: t.value }); LI.d.alias[t.dataset.alias] = t.value; toast(t.value ? 'Collegato.' : 'Collegamento tolto.'); } catch (y) { toast(y.message); } }
  if (t.id === 'fin-az') { try { await api('PUT', 'api/liste/azienda', { azienda: t.value }); toast('Azienda salvata.'); } catch (y) { toast(y.message); } }
});
document.addEventListener('click', async e => {
  const r = e.target.closest('[data-ren]'), a = e.target.closest('[data-att]');
  if (r || a) {
    const [tipo, val] = (r || a).dataset[r ? 'ren' : 'att'].split(/\|(.*)/s);
    const x = LI.d.liste[tipo].find(v => v.valore === val);
    let body = { tipo, valore: x.valore, canale: x.canale, attivo: x.attivo };
    if (r) { const n = prompt(`Nuovo nome per «${x.valore}» (cambia anche nei preventivi già salvati):`, x.valore); if (!n || n.trim().toUpperCase() === x.valore) return; body = { ...body, prima: x.valore, valore: n }; }
    else body.attivo = !x.attivo;
    try { const o = await api('POST', 'api/liste/voce', body); toast(o.aggiornati != null ? `Rinominata (${o.aggiornati} preventivi aggiornati).` : body.attivo ? 'Voce rimessa.' : 'Voce nascosta dal modulo.'); S.st = await api('GET', 'api/stato'); vListe(); } catch (y) { toast(y.message); }
    return;
  }
  if (e.target.id === 'imp-go') {
    const f = $('#imp-f').files[0]; if (!f) return toast('Scegli il file .xlsx.');
    const fd = new FormData(); fd.append('file', f); fd.append('anno', $('#imp-a').value);
    e.target.disabled = true; e.target.textContent = 'Lettura del file…'; $('#imp-out').innerHTML = '';
    try { LI.prev = await api('POST', 'api/liste/importa/anteprima', fd); drawAnteprima(); }
    catch (x) { $('#imp-out').innerHTML = `<div class="err">${esc(x.message)}</div>`; }
    e.target.disabled = false; e.target.textContent = 'Leggi il file (anteprima)';
  }
  if (e.target.id === 'imp-ok') {
    const sost = $('#imp-sost')?.checked;
    if (LI.prev.giaImportate && !sost) return toast('Spunta la casella per sostituire le righe importate prima.');
    e.target.disabled = true; e.target.textContent = 'Importazione…';
    try { const o = await api('POST', 'api/liste/importa/conferma', { token: LI.prev.token, sostituisci: !!sost }); toast(`Importati ${o.righe.toLocaleString('it-IT')} preventivi.`, 5000); LI.prev = null; S.st = await api('GET', 'api/stato'); vListe(); }
    catch (x) { e.target.disabled = false; e.target.textContent = 'Importa'; toast(x.message, 6000); }
  }
});
function drawAnteprima() {
  const p = LI.prev, sc = p.scartate, sconosc = Object.entries(sc.sedeSconosciuta || {});
  $('#imp-out').innerHTML = `<div class="ok-box">Letto: ${p.fogli} fogli «Dati Grezzi», <b>${p.righe.toLocaleString('it-IT')}</b> righe da importare per il ${p.anno}. Non è ancora stato salvato niente.</div>
  <div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Sede</th><th class="n">Righe</th><th class="n">A</th><th class="n">S</th><th class="n">R</th><th class="n">Senza esito</th><th class="n">Dilazionati</th><th class="n">Piani di cura</th><th>Mesi</th></tr></thead>
  <tbody>${p.riepilogo.map(r => `<tr><td><b>${esc(r.sede)}</b></td><td class="n">${r.righe}</td><td class="n">${r.A}</td><td class="n">${r.S}</td><td class="n">${r.R}</td><td class="n">${r.senzaEsito}</td><td class="n">${r.dilazionati}</td><td class="n">${fE(r.pdc)}</td><td>${r.mesi.map(m => MESI[m - 1].slice(0, 3)).join(', ')}</td></tr>`).join('')}</tbody></table></div>
  <ul style="font-size:14px">${sc.eInR ? `<li>${sc.eInR} esiti «E» diventano <b>R</b> (Rifiutato).</li>` : ''}${sc.tertenia ? `<li>${sc.tertenia} righe di Tertenia non si importano.</li>` : ''}
    ${sconosc.length ? `<li class="req">Sedi non trovate in Gestione accessi (righe non importate): ${sconosc.map(([n, c]) => `${esc(n)} (${c})`).join(', ')}.</li>` : ''}
    ${sc.altriEsiti ? `<li>${sc.altriEsiti} righe con un esito diverso da A, S, R, E restano senza esito.</li>` : ''}
    ${p.marketingNuovi ? `<li>Dal foglio «_Liste»: ${p.marketingNuovi} canali marketing (i nuovi si aggiungono all'elenco).</li>` : ''}</ul>
  ${p.giaImportate ? `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" id="imp-sost"> <span>Nel CRM ci sono già <b>${p.giaImportate}</b> righe importate prima: <b>sostituiscile</b> con queste. Le vecchie vanno in archivio (non si cancellano); i preventivi inseriti nell'app restano.</span></label>` : ''}
  <button class="btn primary" id="imp-ok" type="button">Importa</button>`;
}

boot();
</script>
</body>
</html>
