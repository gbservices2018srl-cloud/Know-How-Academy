<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda personale · To Smile</title>
<meta name="description" content="Timbratura, turni, assenze, documenti e informazioni utili del personale To Smile.">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:600,700,800|figtree:400,500,600,700,800">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scheda">
<style>
:root{
  --teal:#4CAAAA; --teal-ink:#2A7C7D; --purple:#8C6898;
  --bg:#FBFBF8; --surface:#FFFFFF; --sunken:#F4F4EF; --fg:#2B3033; --muted:#6B7276; --line:#E6E6DF; --edge:#D9D9D0;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#9A6200; --warn-soft:#FCEFD6; --bad:#B3261E; --bad-soft:#FBEAEA; --info-soft:#E6F2F2;
  --shadow:0 1px 2px rgba(43,48,51,.05),0 6px 20px rgba(43,48,51,.06);
  --f-display:"Fira Sans","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --logo-bg:transparent; --rad:16px;
}
@media (prefers-color-scheme:dark){:root{
  --teal-ink:#6CC7C7; --bg:#15191B; --surface:#1D2326; --sunken:#252C30; --fg:#ECEFF0; --muted:#A3AAAE; --line:#2F383C; --edge:#3A4448;
  --ok:#7FD3A0; --ok-soft:#1B3326; --warn:#F2C26B; --warn-soft:#3A2E16; --bad:#F2B8B5; --bad-soft:#3A2222; --info-soft:#1E3133; --shadow:none; --logo-bg:#FFFFFF; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--teal-ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.hin{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg)}
.brand .logo{display:inline-flex;background:var(--logo-bg);border-radius:10px}
.brand img{display:block;height:34px;width:auto}
@media (prefers-color-scheme:dark){.brand .logo{padding:4px 8px}}
.brand .app{font:800 19px var(--f-display);padding-left:12px;border-left:2px solid var(--line);line-height:1.1}
.brand .app small{display:block;font:600 12px var(--f-body);color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.who b{color:var(--fg)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-ink)}
.shell{max-width:1280px;margin:0 auto;padding:20px 16px 96px;display:flex;gap:24px;align-items:flex-start}
main{flex:1 1 auto;min-width:0}
.sidemenu{position:sticky;top:74px;flex:0 0 228px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:10px;box-shadow:var(--shadow);max-height:calc(100vh - 90px);overflow:auto}
.sidemenu-h{font:700 11.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px}
.sidemenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.sidemenu button:hover{background:var(--sunken);color:var(--fg)}
.sidemenu button[aria-selected="true"]{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-ink)}
.sidemenu .sep{height:1px;background:var(--line);margin:6px 8px}
.num{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:860px){.shell{flex-direction:column;gap:14px}.sidemenu{position:static;width:100%;flex:none;display:flex;overflow-x:auto;padding:6px;max-height:none}.sidemenu-h,.sidemenu .sep{display:none}.sidemenu button{flex:none;width:auto;white-space:nowrap}}
/* navigazione utente: in basso sul telefono */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:0 0 env(safe-area-inset-bottom)}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-selected="true"]{color:var(--teal-ink);font-weight:800}
nav.bottom button[aria-selected="true"] svg{stroke:var(--teal-ink)}
nav.bottom .dot{position:relative}
nav.bottom .dot::after{content:"";position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:4px;background:var(--bad)}
@media (min-width:861px){nav.bottom{position:static;max-width:1280px;margin:0 auto;border:0;background:none;display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
  nav.bottom button{flex-direction:row;font-size:15px;padding:12px 12px;gap:8px;border-bottom:3px solid transparent}
  nav.bottom button[aria-selected="true"]{border-bottom-color:var(--teal)} .shell.u{padding-bottom:64px}}
.u-wrap{max-width:760px;margin:0 auto}
h1{font:800 26px/1.15 var(--f-display);margin:0 0 4px}
h2{font:800 19px var(--f-display);margin:0 0 10px}
h3{font:700 16px var(--f-body);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13.5px} .xs{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--edge);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:52px;font-size:16.5px;width:100%;border-radius:14px}
.btn.small{padding:6px 10px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=time],input[type=date],input[type=month],input[type=number],select,textarea{border:1px solid var(--edge);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{color:var(--fg);font-weight:500;font-size:15px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--info-soft);color:var(--teal-ink)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--info-soft);color:var(--teal-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
.lista{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:700;display:block}
.li .s{font-size:13px;color:var(--muted);display:block}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
button.item{cursor:pointer} button.item:hover{background:var(--sunken)}
.item .t{font-weight:700;display:block} .item .s{font-size:13px;color:var(--muted);display:block}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font:800 28px var(--f-display);color:var(--teal-ink)}
/* tabelle */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;width:100%}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t thead th{background:var(--sunken);font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:0}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:color-mix(in srgb,var(--teal) 6%,var(--surface))}
table.t .stk{position:sticky;left:0;background:var(--surface);z-index:1}
table.t thead .stk{background:var(--sunken);z-index:2}
table.dense td,table.dense th{padding:6px 6px;font-size:13px;text-align:center;white-space:nowrap}
table.dense td.stk,table.dense th.stk{text-align:left}
td.we{background:var(--sunken)}
.c-F{background:var(--ok-soft);color:var(--ok);font-weight:700} .c-P{background:var(--warn-soft);color:var(--warn);font-weight:700} .c-AI{background:var(--bad-soft);color:var(--bad);font-weight:700} .c-M{background:var(--info-soft);color:var(--teal-ink);font-weight:700}
.corto{color:var(--warn);font-weight:700}
/* orari, branche */
table.orari{border-collapse:collapse;width:100%;max-width:560px}
table.orari td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.orari td:first-child{font-weight:700;width:120px}
.chiuso{color:var(--muted)}
table.br{border-collapse:separate;border-spacing:0;min-width:100%}
table.br th,table.br td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.br th:first-child,table.br td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:700}
table.br thead th{background:var(--sunken);font-size:13.5px;vertical-align:bottom}
table.br thead th:first-child{background:var(--sunken)}
.cb{width:22px;height:22px;accent-color:var(--teal-ink);cursor:pointer}
.th-acts{display:flex;gap:4px;justify-content:center;margin-top:4px}
.th-acts button{border:0;background:none;color:var(--teal-ink);font-size:12px;font-weight:700;cursor:pointer;padding:0 2px}
.med{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.med:last-child{border-bottom:0}
.med b{min-width:160px}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.cal .d{min-height:64px;border-radius:10px;padding:6px;background:var(--sunken);color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.cal .d b{font-size:13px;color:var(--fg)}
.cal .d.on{background:var(--info-soft);color:var(--teal-ink);font-weight:600}
.cal .d.ass{background:var(--warn-soft);color:var(--warn);font-weight:600}
.cal .d.oggi{outline:2px solid var(--teal-ink)}
.cal .d.vuoto{background:none}
/* griglia turni (amministratore) */
table.tg td.c{min-width:64px;height:44px;padding:3px;cursor:pointer;font-size:12px;line-height:1.2;text-align:center}
table.tg td.c:hover{outline:2px solid var(--teal);outline-offset:-2px}
table.tg td.c .s{display:block;border-radius:6px;padding:3px 2px;background:var(--info-soft);color:var(--teal-ink);font-weight:700}
table.tg td.c .a{display:block;border-radius:6px;padding:3px 2px;background:var(--warn-soft);color:var(--warn);font-weight:700}
table.tg th.oggi{color:var(--teal-ink)}
/* timbratura */
.stato{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:4px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line)}
.stato.in{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.stato .k{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stato .v{font:800 26px var(--f-display)}
.nfcbox{border:2px dashed var(--teal);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:16px;background:var(--surface)}
.nfcbox svg{width:44px;height:44px;stroke:var(--teal-ink)}
/* finestra */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,24,26,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.dlg{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media (min-width:700px){.ov{align-items:center;padding:20px}.dlg{border-radius:20px}}
.dlg.wide{max-width:860px}
.dlg h2{margin-bottom:6px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* lettore protetto */
.viewer{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.viewer-h{display:flex;gap:10px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.viewer-b{flex:1;overflow:auto;padding:18px 16px 40px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.doc{max-width:900px;margin:0 auto;background-repeat:repeat}
.doc .testo{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.pdf-page{display:block;width:100%;height:auto;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.viewer-f{padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:flex-end;gap:10px;align-items:center}
body.nascosto .viewer-b{filter:blur(18px)}
@media print{body.protetto{display:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.big-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px}
.big-ok .ico{width:84px;height:84px;border-radius:42px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800}
.big-ok .ico.no{background:var(--bad-soft);color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="hin">
  <a class="brand" href="/"><span class="logo"><img src="/logo-tosmile.png" alt="To Smile" width="548" height="165"></span><span class="app">Scheda personale<small id="sottotitolo">To Smile</small></span></a>
  <div class="who" id="who"></div>
</div></header>
<nav class="bottom" id="unav" hidden></nav>
<div class="shell" id="shell"><main id="main"><p class="muted">Carico…</p></main></div>
<div id="viewer" class="viewer" hidden></div>
<div id="ov" class="ov" hidden></div>

<script>
/* ===== comune ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const fmtD = d => d ? new Date(d).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric', timeZone:'Europe/Rome'}) : '';
const fmtG = g => { if (!g) return ''; const d = new Date(g + 'T12:00:00Z'); return `${GG[d.getUTCDay()]} ${d.getUTCDate()} ${MESI[d.getUTCMonth()]}`; };
const fmtDT = d => d ? new Date(d).toLocaleString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Rome'}) : '';
const hm = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, '0')}`;
const nume = n => String(n ?? '').replace('.', ',');
const addG = (g, n) => { const d = new Date(g + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dowG = g => new Date(g + 'T12:00:00Z').getUTCDay();
const meseLbl = m => `${MESI[+m.slice(5) - 1]} ${m.slice(0, 4)}`.replace(/^./, c => c.toUpperCase());
const meseAdd = (m, n) => { const d = new Date(m + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
const giorniMese = m => { const o = []; for (let g = m + '-01'; g.startsWith(m); g = addG(g, 1)) o.push(g); return o; };
const oggiG = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Rome'});
async function api(m, u, b, form) {
  const o = {method: m, credentials: 'same-origin', headers: {}};
  if (form) o.body = form; else if (b !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(b); }
  const r = await fetch(u, o); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Errore, riprova.'), {status: r.status});
  return j;
}
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3200); }
// finestra: html del contenuto, poi collega i pulsanti con on(sel, fn)
function finestra(html, wide){
  const ov = $('#ov'); ov.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`; ov.hidden = false;
  ov.onclick = e => { if (e.target === ov) chiudi(); };
  return ov.firstChild;
}
function chiudi(){ const ov = $('#ov'); ov.hidden = true; ov.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) chiudi(); });
const icone = {
  timbra: '<path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M11 18h2"/><path d="M2 9a8 8 0 0 1 0 6M22 9a8 8 0 0 1 0 6"/>',
  assenze: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/>',
  turni: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/>',
  perf: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icone[k]}</svg>`;

/* ===== lettore protetto (policy e regolamento: niente download, copia o stampa) ===== */
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; ko(new Error('Lettore PDF non disponibile')); };
    document.head.append(s);
  });
  return pdfjsReady;
}
async function renderPdf(url, host){
  host.innerHTML = '<p class="muted">Apro il documento…</p>';
  try {
    const [lib, buf] = await Promise.all([loadPdfJs(), fetch(url, {credentials: 'same-origin'}).then(r => { if (!r.ok) throw new Error('Documento non disponibile'); return r.arrayBuffer(); })]);
    const pdf = await lib.getDocument({data: buf}).promise;
    host.innerHTML = '';
    const width = Math.min(host.clientWidth || 700, 900), ratio = Math.min(devicePixelRatio || 1, 2);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({scale: 1}), vp = page.getViewport({scale: width / v1.width * ratio});
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.className = 'pdf-page';
      host.append(c);
      await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
      if (!host.isConnected) return;
    }
  } catch (e) { host.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
function filigrana(nome){
  const t = `${nome} · ${new Date().toLocaleDateString('it-IT')} · Riservato`;
  const s = `<svg xmlns='http://www.w3.org/2000/svg' width='380' height='230'><text x='190' y='120' text-anchor='middle' transform='rotate(-24 190 115)' font-family='Figtree, sans-serif' font-weight='600' font-size='13' fill='rgba(110,120,118,0.12)'>${esc(t)}</text></svg>`;
  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`;
}
// opzioni: {titolo, versione, pdfUrl, testo, protetto, piede (html), onPiede(el)}
function apriViewer(o){
  const v = $('#viewer');
  v.innerHTML = `<div class="viewer-h"><button class="btn small" id="vChiudi">← Indietro</button><b class="grow">${esc(o.titolo)}</b>${o.versione ? `<span class="tag">Versione ${o.versione}</span>` : ''}</div>
    <div class="viewer-b"><div class="doc" ${o.protetto ? `style="background-image:${filigrana(S.nome)}"` : ''}>${o.pdfUrl ? '<div id="pdfh"></div>' : `<div class="testo">${esc(o.testo || 'Documento senza testo.')}</div>`}</div></div>
    ${o.piede ? `<div class="viewer-f">${o.piede}</div>` : ''}`;
  v.hidden = false; document.body.style.overflow = 'hidden';
  document.body.classList.toggle('protetto', !!o.protetto);
  if (o.pdfUrl) renderPdf(o.pdfUrl, $('#pdfh'));
  $('#vChiudi').onclick = chiudiViewer;
  if (o.onPiede) o.onPiede(v);
}
function chiudiViewer(){ const v = $('#viewer'); v.hidden = true; v.innerHTML = ''; document.body.style.overflow = ''; document.body.classList.remove('protetto'); }
['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev => document.addEventListener(ev, e => { if (!$('#viewer').hidden && document.body.classList.contains('protetto')) e.preventDefault(); }));
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && /^[cpsa]$/i.test(e.key) && document.body.classList.contains('protetto')) e.preventDefault(); });
document.addEventListener('visibilitychange', () => document.body.classList.toggle('nascosto', document.hidden));
window.addEventListener('blur', () => document.body.classList.add('nascosto'));
window.addEventListener('focus', () => document.body.classList.remove('nascosto'));

/* ===== info utili (uguale per tutti, l'amministratore la gestisce) ===== */
let INFO = null;
async function caricaInfo(){ INFO = await api('GET', '/api/scheda/state'); return INFO; }
function orariHtml(o){
  return `<table class="orari">${INFO.giorni.map((g, i) => { const x = o[i] || {}; return `<tr><td>${g}</td><td>${x.aperto ? `${esc(x.da)} – ${esc(x.a)}` : '<span class="chiuso">Chiuso</span>'}</td></tr>`; }).join('')}</table>`;
}
function apriDocInfo(d, dopo){
  const accetta = d.tipo === 'regolamento' && !INFO.me.admin && !d.letto;
  apriViewer({ titolo: d.titolo, versione: d.versione, pdfUrl: d.pdf ? `/api/scheda/doc/${d.id}/file` : null, testo: d.testo, protetto: true,
    piede: accetta ? `<span class="grow muted small">Leggi tutto il regolamento prima di accettare.</span><button class="btn primary" id="accetto">Ho letto e accetto</button>` : '',
    onPiede: () => { if (accetta) $('#accetto').onclick = async () => { try { await api('POST', `/api/scheda/doc/${d.id}/letto`, {}); chiudiViewer(); toast('Grazie, registrato.'); dopo && dopo(); } catch (e) { toast(e.message); } }; } });
  if (!d.pdf && d.tipo === 'policy' && !INFO.me.admin && !d.letto) api('POST', `/api/scheda/doc/${d.id}/letto`, {}).catch(() => {});
}
async function vistaInfo(m){
  await caricaInfo();
  const me = INFO.me, reg = INFO.docs.find(d => d.tipo === 'regolamento'), pol = INFO.docs.filter(d => d.tipo === 'policy');

  m.innerHTML = `<h1>Info utili</h1><p class="sub">Orari, medici e documenti delle sedi in cui lavori.</p>
    ${reg && !reg.letto ? `<div class="banner warn">C'è un regolamento aziendale da leggere e accettare.</div>` : ''}
    ${mieBr ? `<div class="card"><h2>Le tue branche</h2>${INFO.sedi.map(s => { const b = mieBr.branche[s.id] || []; return `<h3 style="margin-top:10px">${esc(s.nome)}</h3><div class="chips">${b.length ? b.map(x => `<span class="tag ok">${esc(x)}</span>`).join('') : '<span class="muted small">Nessuna branca ancora indicata.</span>'}</div>`; }).join('')}<p class="muted xs" style="margin:12px 0 0">Le decide l'amministrazione: per modifiche chiedi a lei.</p></div>` : ''}
    <div class="card"><h2>Orari delle tue sedi</h2>${INFO.sedi.length ? INFO.sedi.map(s => `<h3 style="margin-top:14px">${esc(s.nome)}</h3>${s.indirizzo ? `<p class="muted small" style="margin:-4px 0 8px">${esc(s.indirizzo)}</p>` : ''}${orariHtml(s.orari)}`).join('') : '<p class="muted">Nessuna sede assegnata. Chiedi all\'amministrazione.</p>'}</div>
    <div class="card"><h2>Branche dei medici</h2>${INFO.sedi.map(s => { const ms = INFO.medici.filter(x => x.sedi.includes(s.id));
      return `<h3 style="margin-top:12px">${esc(s.nome)}</h3>${ms.length ? `<div>${ms.map(x => { const b = x.branche[s.id] || []; return `<div class="med"><b>${esc(x.nome)}</b><span class="muted small">${b.length ? esc(b.join(' · ')) : 'Branche non ancora indicate'}</span></div>`; }).join('')}</div>` : '<p class="muted small">Nessun medico indicato.</p>'}`; }).join('')}</div>
    <div class="card"><h2>Policy aziendali</h2>${pol.length ? `<div class="lista">${pol.map(d => `<button class="item" style="margin-bottom:8px" data-doc="${d.id}"><span class="grow"><span class="t">${esc(d.titolo)}</span><span class="s">Versione ${d.versione} · ${fmtD(d.caricato)}</span></span><span class="muted">›</span></button>`).join('')}</div>` : '<p class="muted">Nessuna policy pubblicata.</p>'}</div>
    <div class="card"><h2>Regolamento aziendale</h2>${reg ? `<button class="item" data-doc="${reg.id}"><span class="grow"><span class="t">${esc(reg.titolo)}</span><span class="s">Versione ${reg.versione} · ${fmtD(reg.caricato)}</span></span>${reg.letto ? `<span class="tag ok">Letto e accettato</span>` : '<span class="tag warn">Da leggere</span>'}</button>` : '<p class="muted">Il regolamento non è ancora stato pubblicato.</p>'}</div>
    <p class="muted xs">Policy e regolamento si leggono solo qui: non si scaricano e non si copiano.</p>`;
  m.onclick = e => { const b = e.target.closest('[data-doc]'); if (b) apriDocInfo(INFO.docs.find(d => d.id === b.dataset.doc), () => vistaInfo(m)); };

/* ===== notifiche sul telefono ===== */
const PUSH = { sw: null, sub: null, state: 'checking' };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function pushInit(){
  if (!('serviceWorker' in navigator)) { PUSH.state = 'unsupported'; return; }
  try { PUSH.sw = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; } catch { PUSH.state = 'unsupported'; return; }
  if (!('PushManager' in window) || !('Notification' in window)) { PUSH.state = isIOS && !standalone ? 'ios-install' : 'unsupported'; return; }
  PUSH.sub = await PUSH.sw.pushManager.getSubscription();
  if (Notification.permission === 'denied') PUSH.state = 'denied';
  else if (PUSH.sub && Notification.permission === 'granted') { PUSH.state = 'on'; api('POST', '/api/push/subscribe', {subscription: PUSH.sub.toJSON()}).catch(() => {}); }
  else PUSH.state = 'off';
}
async function pushEnable(){
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { PUSH.state = perm === 'denied' ? 'denied' : 'off'; return toast('Notifiche non attivate'); }
    const { key } = await api('GET', '/api/push/key');
    PUSH.sub = await PUSH.sw.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api('POST', '/api/push/subscribe', {subscription: PUSH.sub.toJSON()});
    PUSH.state = 'on'; toast('Notifiche attive');
  } catch { toast('Non è stato possibile attivare le notifiche'); }
}
function pushBanner(){
  if (PUSH.state === 'off') return `<div class="banner info row"><span class="grow">Attiva le notifiche: ti avvisiamo per sostituzioni, richieste, turni e documenti.</span><button class="btn small primary" data-push>Attiva</button></div>`;
  if (PUSH.state === 'ios-install') return `<div class="banner info">Per ricevere le notifiche su iPhone: in Safari tocca Condividi → «Aggiungi alla schermata Home», poi apri la Scheda dall'icona.</div>`;
  return '';
}
document.addEventListener('click', async e => { if (e.target.closest('[data-push]')) { await pushEnable(); e.target.closest('.banner')?.remove(); } });

let S = { nome: '' };
async function avvio(){
  let st;
  try { st = await api('GET', '/api/scheda/state'); INFO = st; }
  catch (e) {
    $('#main').innerHTML = `<div class="card" style="max-width:560px;margin:30px auto;text-align:center"><h2>Scheda personale</h2><p class="muted">${e.status === 403 ? 'La Scheda personale non è ancora attiva. Ti avviseremo quando sarà pronta.' : esc(e.message)}</p><a class="btn" href="https://appgestione.it">Le mie app</a></div>`;
    return;
  }
  S.nome = st.me.nome;
  $('#who').innerHTML = `<b>${esc(st.me.nome)}</b>${st.me.admin ? '<span class="pill">Amministratore</span>' : st.me.figura ? `<span class="pill">${esc(st.me.figura)}</span>` : ''}<a class="btn small" href="https://appgestione.it">Le mie app</a>`;
  pushInit();
  const nfc = location.pathname.match(/^\/nfc\/([^/?#]+)/);
  if (nfc) return window.timbraDaTag(decodeURIComponent(nfc[1]), new URLSearchParams(location.search));
  if (st.me.admin) window.avvioAdmin(st); else window.avvioUtente(st);
}
