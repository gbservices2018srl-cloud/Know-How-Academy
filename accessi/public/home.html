<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To Smile · Le tue app</title>
<meta name="description" content="Le applicazioni del gruppo To Smile a cui hai accesso.">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:600,700,800|figtree:400,500,600,700">
<link rel="stylesheet" href="/static/accessi.css?v=3">
<link rel="icon" href="/static/icon.svg">
<meta name="theme-color" content="#4CAAAA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Smile">
<style>
/* Layout: barra con logo e account, titolo, poi i riquadri delle app a cui l'utente ha accesso */
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.who .name{font-weight:600;font-size:14.5px;color:var(--muted);margin-right:4px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--yellow);color:#3A3816;font-size:12.5px;font-weight:800}
header{display:flex;flex-direction:column;gap:14px}
header p{margin:0;color:var(--muted);font-size:17px;max-width:58ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.app{--c:var(--teal);--ink:var(--teal-ink);position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 24px 20px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.app::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.app:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 12px 30px rgba(43,48,51,.10)}
.app:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app h2{font-size:22px}
.app.off{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.app.off:hover{transform:none;box-shadow:none}
.app .brandlogo{display:flex;align-items:center;background:#fff;border-radius:12px;padding:8px 12px;align-self:flex-start;max-width:100%}
.app .brandlogo img{height:54px;width:auto;max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app p{margin:0;color:var(--muted);font-size:15px}
.app .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;font-size:13.5px;color:var(--muted)}
.app .go span:last-child{font-weight:700;color:var(--ink);white-space:nowrap}
.role{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.teal{--c:var(--teal);--ink:var(--teal-ink)} .purple{--c:var(--purple);--ink:var(--purple-ink)}
.yellow{--c:var(--yellow);--ink:var(--olive-ink)} .grey{--c:var(--grey);--ink:var(--grey-ink)}
.grid .app:last-child:nth-child(odd){grid-column:1/-1}
.empty{padding:28px;display:flex;flex-direction:column;gap:8px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:0;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,24,26,.45)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
footer{color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:18px}
footer b{color:var(--fg);font-weight:600}
.notif{padding:0;display:block}
.notif details{padding:14px 18px}
.notif summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.notif summary::-webkit-details-marker{display:none}
.notif summary h2{font-size:17px;display:flex;align-items:center;gap:8px;margin:0}
.notif summary .stato{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.notif summary .stato.on{background:var(--ok-bg);color:var(--ok)}
.notif summary .freccia{margin-left:auto;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.notif details[open] summary .freccia{transform:rotate(180deg)}
.notif .corpo{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.notif-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.notif-h h2{font-size:19px;display:flex;align-items:center;gap:8px}
.notif p{margin:0;color:var(--muted);font-size:14.5px}
.sw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;padding:0;border:0;margin:0;min-height:0;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--teal)}
.sw input:checked::after{left:21px}
.sw input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.passi{margin:0;padding-left:20px;color:var(--fg);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.who .name{width:100%;text-align:right;margin:0}}
@media (prefers-reduced-motion:reduce){.app{transition:none}.app:hover{transform:none}}
</style>
<!-- dopo una modifica la pagina resta dov'era (comune a tutte le app To Smile) -->
<script src="/static/resta-qui.js?v=2" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="/" aria-label="To Smile"><img src="/static/logo-tosmile.png" alt="To Smile · Persone, salute, sorrisi" width="548" height="165"></a>
    <div class="who" id="who"></div>
  </div>
  <header>
    <h1 id="hello">Le tue <span>app</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Scegli l'applicazione: entri direttamente, senza un'altra password.</p>
  </header>
  <section class="card notif" id="notif" hidden aria-labelledby="notif-t"></section>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer><span><b>To Smile</b> · Persone, salute, sorrisi</span><span><a href="/privacy">Privacy Policy</a> · <a href="/cookie">Cookie Policy</a> · <a href="/termini">Termini e condizioni</a></span><span>Problemi di accesso? Apri un ticket di assistenza.</span></footer>
</div>

<dialog id="pwd"><form method="dialog" id="pwf">
  <h2>Cambia password</h2>
  <p class="muted" style="margin:0;font-size:14.5px">La nuova password vale per tutte le app To Smile.</p>
  <input type="email" autocomplete="username" id="pw-user" hidden>
  <label class="field">Password attuale<input id="pw-cur" type="password" autocomplete="current-password" required></label>
  <label class="field">Nuova password<input id="pw-new" type="password" autocomplete="new-password" minlength="8" required><small class="muted" style="font-weight:500">Almeno 8 caratteri.</small></label>
  <div class="msg err" id="pw-err" role="alert"></div>
  <div class="row"><button class="btn" value="cancel" formnovalidate>Annulla</button><button class="btn primary" id="pw-save" value="save">Salva</button></div>
</form></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS = {
  finanza: '<path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/>',
  laboratorio: '<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>',
  ticket: '<path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M10 6v12" stroke-dasharray="2 2.5"/>',
  protocolli: '<rect x="3" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="10" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><path d="M6.5 8v8M10 5.5h3.5a2 2 0 0 1 2 2V10"/>',
  calendario: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14.5h3M8 17.5h6"/>',
  magazzino: '<path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M7 20v-6h10v6"/><path d="M7 17h10"/>',
  turni: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><rect x="7" y="13" width="4" height="3.5" rx="1"/><rect x="13" y="13" width="4" height="3.5" rx="1"/>',
  hr: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.3.6 3.5 2.8 3.5 6"/>',
  iprofile: '<path d="M4 20V4M4 20h16"/><rect x="7" y="11" width="2.6" height="6" rx=".6"/><rect x="11.5" y="7" width="2.6" height="10" rx=".6"/><rect x="16" y="13" width="2.6" height="4" rx=".6"/>',
  comunicazioni: '<path d="M3 11l18-8v18l-18-8z"/><path d="M7 12v6a2 2 0 0 0 4 0v-4"/>',
  area_comunicazioni: '<path d="M3 11l18-8v18l-18-8z"/><path d="M7 12v6a2 2 0 0 0 4 0v-4"/>',
  documenti: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  misure: '<path d="M4 17L17 4l3 3L7 20H4z"/><path d="M7 14l2 2M10 11l2 2M13 8l2 2"/>',
  clinica: '<path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5"/>',
  controllo: '<circle cx="12" cy="12" r="9"/><path d="M12 12V3"/><path d="M12 12l7.5 4.5"/><path d="M12 12L5 16"/>',
  bilancio: '<path d="M12 3v18M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/><path d="M8 21h8"/>',
  aso: '<path d="M8.5 3.5h7M10 3.5v3.2L5.6 11a3 3 0 0 0-.9 2.1V18a2.5 2.5 0 0 0 2.5 2.5h9.6a2.5 2.5 0 0 0 2.5-2.5v-4.9a3 3 0 0 0-.9-2.1L14 6.7V3.5"/><path d="M12 11.5v6M9 14.5h6"/>',
  accessi: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 11l2 2 4-4"/>',
};
// App con il loro logo sul riquadro (al posto dell'icona e del nome)
const LOGHI = { laboratorio: '/static/logo-nuovalab.png' };
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3000); }

(async () => {
  const r = await fetch('/api/me', {credentials: 'same-origin'});
  if (r.status === 401) return location.href = '/accedi';
  const me = await r.json();
  const u = me.user;
  $('#hello').innerHTML = `Ciao <span>${esc(u.firstName || '')}</span>`;
  $('#pw-user').value = u.email;
  let pending = 0;
  if (me.admin) {
    try { const a = await (await fetch('/api/admin/users')).json(); pending = a.users.filter(x => x.status === 'pending').length; } catch {}
  }
  $('#who').innerHTML = `<span class="name">${esc(u.email)}</span>
    ${me.admin ? `<a class="btn small" href="/admin">Gestione accessi${pending ? ` <span class="badge" title="Richieste in attesa">${pending}</span>` : ''}</a>` : ''}
    ${u.owner ? '' : '<button class="btn small" id="pw-open">Cambia password</button>'}
    <a class="btn small" href="/esci">Esci</a>`;
  const apps = me.apps.filter(a => a.key !== 'accessi');
  let noaccess = new URLSearchParams(location.search).get('noaccess');
  if (noaccess === 'calendario') noaccess = 'comunicazioni'; // Eventi fa parte di Comunicazioni ed eventi
  if (noaccess) {
    const names = {magazzino: 'Magazzino centrale', turni: 'Turni', finanza: 'Gestione finanziaria', laboratorio: 'Nuovalab', ticket: 'Ticket assistenza', protocolli: 'Protocolli', calendario: 'Calendario eventi', comunicazioni: 'Comunicazioni aziendali', area_comunicazioni: 'Comunicazioni ed eventi', hr: 'HR', iprofile: 'I-Profile OSM', iprofile_consegna: 'I-Profile OSM · Consegna', documenti: 'Documenti di studio', aso: 'Gestione ASO', controllo: 'Controllo di gestione', misure: 'Misure implantari', clinica: 'Comunicazioni cliniche con ASO', bilancio: 'App di bilancio', sterilizzazione: 'Compliance sterilizzazione', registro_udi: 'Registro impianti (UDI)', manutenzione: 'Manutenzione attrezzature'};
    const m = document.createElement('div'); m.className = 'msg warn'; m.setAttribute('role', 'status');
    const spenta = me.apps.find(a => a.key === noaccess)?.spenta;
    m.textContent = spenta ? `L'app «${names[noaccess] || noaccess}» è temporaneamente non disponibile. Riprova più tardi.`
      : `Non sei abilitato all'app «${names[noaccess] || noaccess}». Se ti serve, chiedi all'amministratore di attivartela.`;
    $('#grid').before(m);
    history.replaceState(null, '', '/');
  }
  // app spenta dal pannello: per chi non ne è amministratore il riquadro è grigio e non si apre
  const off = a => a.spenta && a.role !== 'admin';
  $('#grid').innerHTML = apps.length ? apps.map(a => off(a) ? `<div class="app off ${esc(a.color)}" aria-disabled="true">
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[a.key] || ''}</svg></span>
      <h2>${esc(a.name)}</h2>
      <p>${esc(a.desc)}</p>
      <div class="go"><span class="role">Temporaneamente non disponibile</span><span></span></div>
    </div>` : `<a class="app ${esc(a.color)}" href="${esc(a.link || a.url)}">
      ${LOGHI[a.key] ? `<span class="brandlogo"><img src="${LOGHI[a.key]}" alt="" width="546" height="152"></span><h2 class="sr">${esc(a.name)}</h2>`
        : `<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[a.key] || ''}</svg></span>
      <h2>${esc(a.name)}</h2>`}
      <p>${esc(a.desc)}</p>
      <div class="go"><span>${a.role === 'admin' ? '<span class="role">Amministratore</span>' + (a.spenta ? ' <span class="role">Spenta per gli altri</span>' : '') : esc(a.url.replace('https://', ''))}</span><span>Apri →</span></div>
    </a>`).join('')
    : `<div class="card empty" style="grid-column:1/-1"><h2>Nessuna app assegnata, per ora</h2><p class="muted" style="margin:0">Il tuo accesso è attivo, ma l'amministratore non ti ha ancora abilitato ad alcuna app. Appena lo farà, le troverai qui.</p></div>`;
  $('#pw-open')?.addEventListener('click', () => { $('#pw-err').textContent = ''; $('#pwf').reset(); $('#pw-user').value = u.email; $('#pwd').showModal(); });
})();


/* ---------- notifiche: una sola attivazione per tutte le app, interruttori per app ---------- */
const NT = { stato: 'controllo', sw: null, sub: null, dati: null };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Operazione non riuscita'); return j;
}
async function notifInit() {
  try { NT.dati = await api('/api/notifiche'); } catch { return; }
  if (!NT.dati.app.length) return;
  if (!('serviceWorker' in navigator)) NT.stato = isIOS && !standalone ? 'ios' : 'no';
  else {
    try { NT.sw = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; } catch { NT.stato = 'no'; }
    if (NT.stato !== 'no') {
      if (!('PushManager' in window) || !('Notification' in window)) NT.stato = isIOS && !standalone ? 'ios' : 'no';
      else {
        NT.sub = await NT.sw.pushManager.getSubscription();
        if (Notification.permission === 'denied') NT.stato = 'bloccate';
        else if (NT.sub && Notification.permission === 'granted') { NT.stato = 'on'; api('/api/notifiche/iscrivi', 'POST', { subscription: NT.sub.toJSON() }).catch(() => {}); }
        else NT.stato = 'off';
      }
    }
  }
  notifRender();
}
function notifRender() {
  const box = $('#notif'); box.hidden = false;
  const d = NT.dati;
  const testa = {
    on: ['🔔 Notifiche', 'Ricevi gli avvisi anche con il telefono bloccato. Scegli da quali app:'],
    off: ['🔔 Notifiche', 'Attivale una volta sola qui: ricevi gli avvisi di tutte le app che scegli, anche a telefono chiuso.'],
    bloccate: ['🔕 Notifiche bloccate', 'Le hai bloccate per appgestione.it: riattivale dalle impostazioni del browser (lucchetto accanto all\'indirizzo → Notifiche → Consenti), poi ricarica la pagina.'],
    ios: ['🔔 Notifiche su iPhone', 'Su iPhone le notifiche arrivano solo se To Smile è nella schermata Home:'],
    no: ['🔔 Notifiche', 'Questo browser non riceve notifiche. Su Android usa Chrome; su computer Chrome, Edge, Firefox o Safari.'],
  }[NT.stato] || ['🔔 Notifiche', ''];
  // chiusa in una tendina: si apre toccando la riga (resta aperta se l'avevi aperta tu)
  let aperta = false; try { aperta = localStorage.getItem('notif-aperta') === '1'; } catch {}
  if (location.hash === '#notif') aperta = true;
  const stato = { on: `<span class="stato on">Attive · ${d.app.filter(a => a.attiva).length} app</span>`, off: '<span class="stato">Spente su questo dispositivo</span>', bloccate: '<span class="stato">Bloccate</span>' }[NT.stato] || '';
  box.innerHTML = `<details ${aperta ? 'open' : ''}><summary><h2 id="notif-t">${testa[0]}</h2>${stato}<svg class="freccia" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="corpo"><div class="notif-h">
      ${NT.stato === 'off' ? '<button class="btn primary" id="nt-on">Attiva notifiche</button>' : ''}
      ${NT.stato === 'on' ? '<div class="row" style="justify-content:flex-start"><button class="btn small" id="nt-prova">Prova</button><button class="btn small" id="nt-off">Disattiva qui</button></div>' : ''}</div>
    <p>${testa[1]}</p>
    ${NT.stato === 'ios' ? `<ol class="passi"><li>Tocca il pulsante <b>Condividi</b> di Safari (il quadrato con la freccia).</li><li>Scegli <b>Aggiungi alla schermata Home</b> e conferma.</li><li>Apri <b>To Smile</b> dalla schermata Home e tocca <b>Attiva notifiche</b>.</li></ol><p style="font-size:13px">Serve iOS 16.4 o successivo.</p>` : ''}
    ${['on', 'off'].includes(NT.stato) ? `<div class="sw-list">${d.app.map(a => `<label class="sw">${esc(a.nome)}<input type="checkbox" role="switch" data-app="${esc(a.key)}" ${a.attiva ? 'checked' : ''} aria-label="Notifiche di ${esc(a.nome)}"></label>`).join('')}</div>
      <p style="font-size:13px">Gli interruttori valgono per tutti i tuoi dispositivi.${d.dispositivi > 1 ? ` Hai le notifiche attive su ${d.dispositivi} dispositivi.` : ''}</p>` : ''}</div></details>`;
  box.querySelector('details').addEventListener('toggle', e => { try { localStorage.setItem('notif-aperta', e.target.open ? '1' : '0'); } catch {} });
  // arrivati da un'app con "Attiva le notifiche" (…/#notif): si va dritti al riquadro, evidenziato
  if (location.hash === '#notif' && !NT.saltato) { NT.saltato = true; box.scrollIntoView({ block: 'center' }); box.style.outline = '3px solid var(--accent, #2B8384)'; setTimeout(() => box.style.outline = '', 2500); }
  $('#nt-on')?.addEventListener('click', notifAttiva);
  $('#nt-off')?.addEventListener('click', notifDisattiva);
  $('#nt-prova')?.addEventListener('click', async () => { try { const r = await api('/api/notifiche/prova', 'POST', {}); toast(r.ok ? 'Inviata: deve arrivarti tra pochi secondi' : 'Questo dispositivo non risulta raggiungibile: disattiva e riattiva'); } catch (e) { toast(e.message); } });
  box.querySelectorAll('[data-app]').forEach(i => i.addEventListener('change', async () => {
    try { await api('/api/notifiche/preferenze', 'PUT', { app: i.dataset.app, attiva: i.checked }); const a = d.app.find(x => x.key === i.dataset.app); if (a) a.attiva = i.checked; toast(i.checked ? 'Notifiche attivate per questa app' : 'Notifiche spente per questa app'); }
    catch (e) { i.checked = !i.checked; toast(e.message); }
  }));
}
async function notifAttiva() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { NT.stato = perm === 'denied' ? 'bloccate' : 'off'; notifRender(); return toast('Notifiche non attivate'); }
    NT.sub = await NT.sw.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(NT.dati.chiave) });
    await api('/api/notifiche/iscrivi', 'POST', { subscription: NT.sub.toJSON() });
    NT.dati.dispositivi++; NT.stato = 'on'; notifRender();
    const t = await api('/api/notifiche/prova', 'POST', {});
    toast(t.ok ? 'Notifiche attive: ti è arrivata una prova' : 'Notifiche attivate');
  } catch (e) { toast('Non sono riuscito ad attivare le notifiche: ' + e.message); }
}
async function notifDisattiva() {
  try { if (NT.sub) { await api('/api/notifiche/disiscrivi', 'POST', { endpoint: NT.sub.endpoint }); await NT.sub.unsubscribe(); } } catch {}
  NT.sub = null; NT.stato = 'off'; NT.dati.dispositivi = Math.max(0, NT.dati.dispositivi - 1); notifRender(); toast('Notifiche disattivate su questo dispositivo');
}
notifInit();

$('#pwf').addEventListener('submit', async e => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  $('#pw-err').textContent = '';
  if ($('#pw-new').value.length < 8) return $('#pw-err').textContent = 'La nuova password deve avere almeno 8 caratteri.';
  const r = await fetch('/api/me/password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({current: $('#pw-cur').value, next: $('#pw-new').value})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return $('#pw-err').textContent = j.error || 'Non riuscito.';
  $('#pwd').close(); toast('Password aggiornata');
});
</script>
