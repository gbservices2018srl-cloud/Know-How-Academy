<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8C6898">
<base href="/clinica/">
<title>Comunicazioni cliniche · To Smile</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:400,500,600,700,800">
<style>
/* Colori e caratteri To Smile (gli stessi di Comunicazioni, Calendario e Turni), con tema scuro automatico */
:root{
  --bg:#EFF5F5; --dot:#D3E2E2; --surface:#FFFFFF; --surface-2:#F5F9F9; --surface-3:#EAF1F1; --fg:#1F2A2B; --muted:#5E6B6C;
  --line:#DCE7E7; --accent:#2B8384; --accent-soft:#DCEFEF; --accent-fg:#FFFFFF;
  --brand-teal:#4CAAAA; --brand-purple:#8C6898; --brand-yellow:#E8E564; --purple-soft:#EFE7F2;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#8A4A12; --warn-soft:#FBEBDD;
  --shadow:0 1px 2px rgba(20,48,48,.05),0 8px 28px rgba(20,48,48,.09);
  --f-display:"Fira Sans",system-ui,sans-serif; --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101818; --dot:#1E2B2B; --surface:#172121; --surface-2:#1D2929; --surface-3:#223030; --fg:#E7F0F0; --muted:#9FB0B0;
  --line:#2A3939; --accent:#62C3C3; --accent-soft:#163536; --accent-fg:#062222;
  --brand-teal:#62C3C3; --brand-purple:#B597C2; --purple-soft:#2E2433;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#6FD39C; --ok-soft:#173326; --warn:#F0B07A; --warn-soft:#3A2817;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-attachment:fixed;
  color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 -1px color-mix(in srgb,var(--brand-yellow) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{height:40px;width:auto;flex:none;display:block}
.brand .sep{width:1px;height:26px;background:var(--line);flex:none}
.brand h1{font:600 16px/1.1 var(--f-display);margin:0;white-space:nowrap;color:var(--muted)}
@media (max-width:900px){.brand h1,.brand .sep{display:none}.who b{display:none}.who{padding:3px}}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;text-decoration:none}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;flex:none;min-height:40px;text-decoration:none;color:inherit}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) max(48px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:inherit;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.wide{min-height:52px;font-size:16px;width:100%}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px;min-height:38px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
h2.view{font:700 26px/1.15 var(--f-display);letter-spacing:-.015em;margin:0}
h3{font:700 17px/1.2 var(--f-display);margin:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head p{margin:4px 0 0;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ko{background:var(--danger-soft);color:var(--danger)}
.tag.todo{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--surface-3);color:var(--muted)}
.tag.q{background:var(--purple-soft);color:var(--brand-purple)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.avvisi{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.avviso{display:flex;gap:8px;align-items:flex-start;padding:8px 11px;border-radius:10px;font-size:14px;font-weight:600}
.avviso.rosso{background:var(--danger-soft);color:var(--danger)}
.avviso.giallo{background:var(--warn-soft);color:var(--warn)}
/* pagina d'ingresso */
.hello{font:800 28px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.big{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:200px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 55%,var(--line))}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--bc)}
.big .bi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 16%,transparent);color:var(--bc)}
.big .bi svg{width:28px;height:28px}
.big h2{font:800 21px/1.15 var(--f-display);margin:0}
.big p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.big .st{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big .go{color:var(--accent);font-weight:700}
/* moduli */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-weight:700;font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;min-height:42px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.ko{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:92vw;box-shadow:var(--shadow)}
/* misure implantari */
.mreq{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 18px 14px 22px;overflow:hidden}
.mreq::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--mc,var(--accent))}
.mreq.emg{--mc:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.mreq.fine{--mc:var(--ok)} .mreq.ann{--mc:var(--line);opacity:.65}
.mreq .r1{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mreq .n{font:800 17px/1.2 var(--f-display)} .mreq .lav{font-weight:600;margin-top:2px}
.mreq .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mreq .meta span{display:inline-flex;align-items:center;gap:5px}.mreq .meta svg{width:15px;height:15px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps .s{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.steps .s::before{content:"";height:5px;border-radius:9px;background:var(--surface-3)}
.steps .s.on::before{background:var(--mc,var(--accent))} .steps .s.on{color:var(--fg)}
.steps .s small{font-weight:500;color:var(--muted)}
.nota-med{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 11px;font-size:14px}
.blocco{display:flex;gap:12px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border:2px solid var(--danger);border-radius:14px;padding:12px 14px;margin:4px 0 12px;font-weight:600}
.btn.emg{background:var(--danger);border-color:var(--danger);color:#fff}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.hero p{margin:4px 0 0;color:var(--muted)}
.filtri{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
.filtri button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted);min-height:42px}
.filtri button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.filtri .n{min-width:22px;height:22px;border-radius:99px;display:inline-grid;place-items:center;font-size:12px;background:var(--surface-3);color:var(--fg);padding:0 6px}
.filtri button.on .n{background:var(--bg);color:var(--fg)}
.filtri .n.r{background:var(--danger);color:#fff}
.emg-box{border:2px solid var(--danger);background:linear-gradient(180deg,var(--danger-soft),transparent 140px);border-radius:20px;padding:14px;margin-bottom:22px}
.emg-h{display:flex;align-items:center;gap:10px;color:var(--danger);font:800 18px/1.2 var(--f-display);margin:2px 4px 12px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 60%,transparent);animation:pl 1.6s infinite;flex:none}
@keyframes pl{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.mreq.emg{background:var(--surface)}
.mreq.nuova{box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.azioni{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pian{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.pian textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-height:60px;resize:vertical}
.notif{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border-left:5px solid var(--brand-purple)}
.notif p{margin:0;flex:1 1 240px}
.big-n{font:800 34px/1 var(--f-display)}
.admin-sw{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.admin-sw input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:640px){.brand .logo{height:32px}h2.view{font-size:22px}}
</style>
<script src="/static/resta-qui.js?v=1" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Comunicazioni cliniche"><img class="logo" src="logo.png" alt="To Smile" width="543" height="162"><span class="sep"></span><h1>Comunicazioni cliniche</h1></a>
  <span class="spacer"></span>
  <a class="who" id="who" href="/" title="Torna alle app"></a>
</header>
<main id="main"><div class="empty">Caricamento…</div></main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  check: '<path d="M5 12l5 5L20 7"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  urg: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  pin: '<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>', hand: '<path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V11M10 10V4a1.5 1.5 0 0 1 3 0v6M13 10V5a1.5 1.5 0 0 1 3 0v6M16 11V8a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4a1.5 1.5 0 0 1 2.5-1.6L7 14"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', dtx: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M7 9l3 3 7-6"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${+d} ${MESI[+m - 1]} ${y}`; };
const fmtDT = s => s ? new Date(s).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
let toastT;
function toast(t, ms = 3500) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }
async function api(method, url, body) {
  const r = await fetch(url, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/accedi?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('Accedi di nuovo'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Operazione non riuscita'); return j;
}
const S = { d: null, f: 'nuove', tutte: false, pian: null, nota: '', busy: false, evid: new URLSearchParams(location.search).get('r'), notif: null };
const giorni = d => Math.round((Date.parse(d + 'T12:00:00Z') - Date.parse(S.d.oggi + 'T12:00:00Z')) / 864e5);
const traG = n => n < 0 ? `${-n} giorni fa` : n === 0 ? 'oggi' : n === 1 ? 'domani' : `tra ${n} giorni`;

async function load() {
  try { S.d = await api('GET', 'api/clinica' + (S.tutte ? '?tutte=1' : '')); }
  catch (e) { $('#main').innerHTML = `<div class="card empty"><b>${esc(e.message)}</b></div>`; return; }
  render();
}
function render() {
  const d = S.d, r = d.richieste, n = d.me.nome || '';
  $('#who').innerHTML = `<span class="av">${esc(n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase())}</span><b>${esc(n.split(' ')[0])}</b>`;
  const gruppi = { nuove: r.filter(x => x.stato === 'inviata'), carico: r.filter(x => x.stato === 'in_carico'), fatte: r.filter(x => x.stato === 'pianificata' || x.stato === 'annullata') };
  const emg = r.filter(x => x.tipo === 'emergenza' && (x.stato === 'inviata' || x.stato === 'in_carico'));
  const lista = gruppi[S.f].filter(x => !(x.tipo === 'emergenza' && (x.stato === 'inviata' || x.stato === 'in_carico')));
  const da = gruppi.nuove.length;
  document.title = (da ? `(${da}) ` : '') + 'Comunicazioni cliniche · To Smile';
  const emgN = gruppi.nuove.filter(x => x.tipo === 'emergenza').length;
  $('#main').innerHTML = `${notifBox()}
  <div class="hero"><div style="flex:1 1 260px"><h2 class="view">Misure implantari</h2><p>${da ? `<b>${da} ${da === 1 ? 'nuova richiesta' : 'nuove richieste'}</b> dalle ASO.` : 'Nessuna richiesta nuova.'} Prendi in carico, valuta il caso e conferma quando è pianificato su DTX.</p></div>
    ${d.admin ? `<label class="admin-sw"><input type="checkbox" id="tutte" ${S.tutte ? 'checked' : ''}>Vedi le richieste di tutti i medici</label>` : ''}</div>
  ${emg.length ? `<section class="emg-box" aria-label="Emergenze"><div class="emg-h"><span class="pulse"></span>Emergenze · ${emg.length}</div><div class="list">${emg.map(card).join('')}</div></section>` : ''}
  <div class="filtri" role="tablist">
    ${[['nuove', 'Da vedere', gruppi.nuove.length - emgN], ['carico', 'In carico', gruppi.carico.filter(x => x.tipo !== 'emergenza').length], ['fatte', 'Pianificate', gruppi.fatte.length]].map(([k, l, c]) =>
      `<button role="tab" aria-selected="${S.f === k}" class="${S.f === k ? 'on' : ''}" data-f="${k}">${l}<span class="n">${c}</span></button>`).join('')}
  </div>
  ${lista.length ? `<div class="list">${lista.map(card).join('')}</div>` : `<div class="card empty"><b>${{ nuove: 'Tutto visto', carico: 'Nessun caso in carico', fatte: 'Ancora nessun caso pianificato' }[S.f]}</b>${S.f === 'nuove' ? 'Quando un\'ASO ti invia una richiesta ti arriva una notifica sul telefono.' : ''}</div>`}`;
  if (S.evid) { const el = document.querySelector(`[data-id="${CSS.escape(S.evid)}"]`); if (el) { el.scrollIntoView({ block: 'center' }); } S.evid = null; }
}
function card(r) {
  const g = giorni(r.dataIntervento), em = r.tipo === 'emergenza', st = r.stato, passo = { inviata: 1, in_carico: 2, pianificata: 3 }[st] || 0;
  const evid = new URLSearchParams(location.search).get('r') === r.id;
  return `<article class="card mreq ${em ? 'emg' : ''} ${st === 'pianificata' ? 'fine' : ''} ${st === 'annullata' ? 'ann' : ''} ${evid ? 'nuova' : ''}" data-id="${esc(r.id)}">
    <div class="r1"><div style="flex:1 1 220px;min-width:0"><div class="n">${esc(r.cognome)} ${esc(r.nome)}</div><div class="lav">${esc(r.lavoro)}</div></div>
      ${em ? `<span class="tag ko">${ic('urg')}EMERGENZA</span>` : ''}${st === 'annullata' ? '<span class="tag plain">Annullata dall\'ASO</span>' : st === 'pianificata' ? `<span class="tag ok">${ic('check')}Pianificata su DTX</span>` : st === 'in_carico' ? '<span class="tag todo">In carico</span>' : ''}</div>
    <div class="meta"><span style="${g <= 5 && passo < 3 && st !== 'annullata' ? 'color:var(--danger);font-weight:700' : ''}">${ic('cal')}Intervento ${esc(fmtD(r.dataIntervento))} · ${traG(g)}</span><span>${ic('pin')}${esc(r.sede)}</span><span>${ic('user')}ASO ${esc(r.creatoDa)} · ${esc(fmtDT(r.creatoIl))}</span>${S.tutte ? `<span>→ ${esc(r.medico)}</span>` : ''}<span>${ic('dtx')}Documentazione su DTX</span></div>
    ${r.note ? `<div style="font-size:14.5px"><b>Note dell'ASO:</b> ${esc(r.note)}</div>` : ''}
    ${st !== 'annullata' ? `<div class="steps"><span class="s on">Ricevuta<small>${esc(fmtDT(r.creatoIl))}</small></span><span class="s ${passo >= 2 ? 'on' : ''}">Presa in carico<small>${r.presaIl ? esc(fmtDT(r.presaIl)) : '—'}</small></span><span class="s ${passo >= 3 ? 'on' : ''}">Pianificata su DTX<small>${r.pianificataIl ? esc(fmtDT(r.pianificataIl)) : '—'}</small></span></div>` : ''}
    ${r.notaMedico ? `<div class="nota-med"><b>La tua nota:</b> ${esc(r.notaMedico)}</div>` : ''}
    ${S.pian === r.id ? `<div class="pian"><label for="nota" class="lbl" style="font-weight:700;font-size:13.5px;color:var(--muted)">Nota per l'ASO (facoltativa)</label><textarea id="nota" placeholder="Es. pianificato, guida chirurgica in arrivo">${esc(S.nota)}</textarea>
        <div class="azioni"><button class="btn primary" data-pianifica="${esc(r.id)}" ${S.busy ? 'disabled' : ''}>${ic('check')}${S.busy ? 'Invio…' : 'Confermo: visto e pianificato su DTX'}</button><button class="btn" data-annulla-pian>Annulla</button></div></div>`
      : passo === 1 || passo === 2 ? `<div class="azioni">
        ${passo === 1 ? `<button class="btn ${em ? 'emg' : 'primary'}" data-presa="${esc(r.id)}" ${S.busy ? 'disabled' : ''}>${ic('hand')}Prendo in carico</button>` : ''}
        <button class="btn ${passo === 2 ? 'primary' : ''}" data-apri-pian="${esc(r.id)}">${ic('dtx')}Visto e pianificato su DTX</button></div>` : ''}
  </article>`;
}

/* notifiche sul telefono: stesse iscrizioni della pagina "Le mie app" */
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function notifInit() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) { S.notif = isIOS && !standalone ? 'ios' : null; return; }
    const sw = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
    const sub = await sw.pushManager.getSubscription();
    S.notif = Notification.permission === 'denied' ? 'bloccate' : sub && Notification.permission === 'granted' ? 'on' : 'off';
    if (S.notif === 'on') { // la preferenza "Comunicazioni cliniche" deve essere accesa
      const d = await fetch('/api/notifiche', { credentials: 'same-origin' }).then(r => r.json());
      const a = (d.app || []).find(x => x.key === 'clinica'); if (a && !a.attiva) S.notif = 'spenta';
    }
  } catch { S.notif = null; }
  if (S.d) render();
}
function notifBox() {
  const t = { off: 'Attiva le notifiche: ogni richiesta ti arriva sul telefono, le emergenze in rosso.', spenta: 'Le notifiche di Comunicazioni cliniche sono spente: riaccendile per ricevere le richieste.', bloccate: 'Hai bloccato le notifiche per appgestione.it: riattivale dalle impostazioni del browser (lucchetto → Notifiche → Consenti).', ios: 'Su iPhone le notifiche arrivano se aggiungi To Smile alla schermata Home (Condividi → Aggiungi alla schermata Home) e la apri da lì.' }[S.notif];
  if (!t) return '';
  return `<div class="card notif">${ic('bell')}<p>${t}</p>${S.notif === 'off' || S.notif === 'spenta' ? '<button class="btn primary" id="nt-on">Attiva notifiche</button>' : ''}</div>`;
}
async function notifAttiva() {
  try {
    const d = await fetch('/api/notifiche', { credentials: 'same-origin' }).then(r => r.json());
    if (S.notif === 'off') {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { S.notif = perm === 'denied' ? 'bloccate' : 'off'; render(); return toast('Notifiche non attivate'); }
      const sw = await navigator.serviceWorker.ready;
      const sub = await sw.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(d.chiave) });
      await fetch('/api/notifiche/iscrivi', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: sub.toJSON() }) });
    }
    await fetch('/api/notifiche/preferenze', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app: 'clinica', attiva: true }) });
    S.notif = 'on'; render(); toast('Notifiche attive su questo dispositivo.');
  } catch (e) { toast('Non sono riuscito ad attivare le notifiche: ' + e.message, 5000); }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'nt-on') return notifAttiva();
  if (b.dataset.f) { S.f = b.dataset.f; S.pian = null; return render(); }
  if (b.dataset.presa) {
    S.busy = true; render();
    try { await api('POST', 'api/clinica/' + b.dataset.presa + '/presa', {}); toast('Presa in carico: l\'ASO riceve un avviso.'); } catch (x) { toast(x.message, 5000); }
    S.busy = false; return load();
  }
  if (b.dataset.apriPian) { S.pian = b.dataset.apriPian; S.nota = ''; render(); return setTimeout(() => $('#nota')?.focus(), 30); }
  if (b.dataset.annullaPian !== undefined) { S.pian = null; return render(); }
  if (b.dataset.pianifica) {
    S.busy = true; render();
    try { await api('POST', 'api/clinica/' + b.dataset.pianifica + '/pianificata', { nota: S.nota }); S.pian = null; toast('Fatto: l\'ASO sa che il caso è pianificato su DTX.'); } catch (x) { toast(x.message, 5000); }
    S.busy = false; return load();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'nota') S.nota = e.target.value; });
document.addEventListener('change', e => { if (e.target.id === 'tutte') { S.tutte = e.target.checked; load(); } });
setInterval(() => { if (document.visibilityState === 'visible' && !S.pian && !S.busy) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !S.pian && !S.busy) load(); });
load(); notifInit();
</script>
</body>
