<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4CAAAA">
<base href="/aso/">
<title>Gestione ASO · To Smile</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="/fonts/tosmile.css?f=fira-sans:400,500,600,700,800">
<style>
/* Colori e caratteri To Smile (gli stessi di Comunicazioni, Calendario e Turni), con tema scuro automatico */
:root{
  --bg:#EFF5F5; --dot:#D3E2E2; --surface:#FFFFFF; --surface-2:#F5F9F9; --surface-3:#EAF1F1; --fg:#1F2A2B; --muted:#5E6B6C;
  --line:#DCE7E7; --accent:#2B8384; --accent-soft:#DCEFEF; --accent-fg:#FFFFFF;
  --brand-teal:#4CAAAA; --brand-purple:#8C6898; --brand-yellow:#E8E564; --purple-soft:#EFE7F2;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#8A4A12; --warn-soft:#FBEBDD;
  --shadow:0 1px 2px rgba(20,48,48,.05),0 8px 28px rgba(20,48,48,.09);
  --f-display:"Fira Sans",system-ui,sans-serif; --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101818; --dot:#1E2B2B; --surface:#172121; --surface-2:#1D2929; --surface-3:#223030; --fg:#E7F0F0; --muted:#9FB0B0;
  --line:#2A3939; --accent:#62C3C3; --accent-soft:#163536; --accent-fg:#062222;
  --brand-teal:#62C3C3; --brand-purple:#B597C2; --purple-soft:#2E2433;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#6FD39C; --ok-soft:#173326; --warn:#F0B07A; --warn-soft:#3A2817;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-attachment:fixed;
  color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 -1px color-mix(in srgb,var(--brand-yellow) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{height:40px;width:auto;flex:none;display:block}
.brand .sep{width:1px;height:26px;background:var(--line);flex:none}
.brand h1{font:600 16px/1.1 var(--f-display);margin:0;white-space:nowrap;color:var(--muted)}
@media (max-width:900px){.brand h1,.brand .sep{display:none}.who b{display:none}.who{padding:3px}}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;text-decoration:none}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;flex:none;min-height:40px;text-decoration:none;color:inherit}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) max(48px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:inherit;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.wide{min-height:52px;font-size:16px;width:100%}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px;min-height:38px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
h2.view{font:700 26px/1.15 var(--f-display);letter-spacing:-.015em;margin:0}
h3{font:700 17px/1.2 var(--f-display);margin:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head p{margin:4px 0 0;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ko{background:var(--danger-soft);color:var(--danger)}
.tag.todo{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--surface-3);color:var(--muted)}
.tag.q{background:var(--purple-soft);color:var(--brand-purple)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.avvisi{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.avviso{display:flex;gap:8px;align-items:flex-start;padding:8px 11px;border-radius:10px;font-size:14px;font-weight:600}
.avviso.rosso{background:var(--danger-soft);color:var(--danger)}
.avviso.giallo{background:var(--warn-soft);color:var(--warn)}
/* pagina d'ingresso */
.hello{font:800 28px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.big{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:200px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 55%,var(--line))}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--bc)}
.big .bi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 16%,transparent);color:var(--bc)}
.big .bi svg{width:28px;height:28px}
.big h2{font:800 21px/1.15 var(--f-display);margin:0}
.big p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.big .st{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big .go{color:var(--accent);font-weight:700}
/* moduli */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-weight:700;font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;min-height:42px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.ko{background:var(--danger);color:#fff}
.seg button.on.att{background:var(--brand-purple);color:#fff}
.foto-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:78px;height:78px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--surface-3);display:block}
.thumb.lg{width:120px;height:120px}
button.thumbbtn{border:0;padding:0;background:none;border-radius:12px}
/* sterilizzazione */
.fatto{display:flex;gap:10px;align-items:center;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:14px}
.fatto svg{width:22px;height:22px;flex:none;stroke-width:2.4}
.fatto.att{background:var(--purple-soft);color:var(--brand-purple)}
.sez.chiusa{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.ster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ster{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;gap:12px;--ac:var(--accent)}
.ster.ko{--ac:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.ster-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:0;background:none;padding:6px 0 0;color:inherit;border-radius:16px}
.ster-main .art{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);margin-bottom:10px;transition:transform .15s}
.ster-main:hover .art{transform:scale(1.04)}
.ster-main .art svg{width:78px;height:78px}
.ster-main .marca{font:800 24px/1.1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.ster-main .modello{font-weight:600;font-size:15px;color:var(--fg)}
.ster-main .dove{font-size:12.5px;color:var(--muted);min-height:1em}
.ster .badge{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.todo{background:var(--warn-soft);color:var(--warn)}.badge.ko{background:var(--danger-soft);color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.sc svg{width:14px;height:14px}.sc i{width:8px;height:8px;border-radius:50%;border:1.6px solid currentColor;display:inline-block}
.sc.ok{background:var(--ok-soft);color:var(--ok)}.sc.ko{background:var(--danger-soft);color:var(--danger)}
.mini-avvisi{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600}
.mini-avvisi .rosso{color:var(--danger)}.mini-avvisi .giallo{color:var(--warn)}
.ster-foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.ster-foot .btn.sm{padding:0;width:40px;flex:none}.ster-foot .btn.primary.sm{width:auto;flex:1;min-width:0;padding:6px 10px}
.mac h3{font-size:18px}
.mac .sede{font-size:13px;color:var(--muted)}
.mac .tests{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;background:var(--surface-3);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ko{background:var(--danger-soft);color:var(--danger)}
.pill.att{background:var(--purple-soft);color:var(--brand-purple)}
.mac .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sez{margin-top:16px}
.sez>h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .grow{flex:1;min-width:0}
.rec .meta{font-size:13px;color:var(--muted)}
.testbox{border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:8px;background:var(--surface-2)}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:inherit}
/* registro UDI */
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 38px;min-height:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.imp{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit}
.imp:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.imp .d{width:58px;flex:none;text-align:center;border-radius:12px;background:var(--surface-3);padding:6px 0;line-height:1.05}
.imp .d b{display:block;font:700 22px/1 var(--f-display)}
.imp .d small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.imp .grow{flex:1;min-width:0}
.imp .n{font-weight:700;font-size:16px}
.imp .meta{font-size:13.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:2px}
.denti-box{border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;background:var(--surface);margin-bottom:12px}
.denti-schema{overflow-x:auto;padding:6px 2px 4px;-webkit-overflow-scrolling:touch}
.denti-in{min-width:600px;max-width:820px;margin:0 auto}
.arc{display:flex;gap:2px;align-items:flex-end}.arc.inf{align-items:flex-start}
.arc .lato{flex:1;display:flex;gap:2px;align-items:inherit}
.arc .mezzo{width:1.5px;align-self:stretch;background:var(--line);margin:0 3px}
.occl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1.5px dashed var(--line);margin:6px 0;padding-top:2px}
.d{border:0;background:none;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border-radius:10px;color:inherit}
.d:not([disabled]):hover{background:var(--surface-2)}
.d svg{width:100%;height:auto;max-height:86px;overflow:visible;display:block}
.d b{font-size:11.5px;font-weight:700;color:var(--muted);padding:0 4px;border-radius:6px;line-height:1.4}
.d .radice{fill:var(--surface);stroke:color-mix(in srgb,var(--muted) 55%,transparent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.d .corona{fill:var(--surface);stroke:var(--muted);stroke-width:1.8;stroke-linejoin:round;transition:fill .15s}
.d .vite{fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.d:not([disabled]):hover .corona{stroke:var(--accent)}
.d.on .corona{fill:var(--brand-yellow);stroke:#8a6a0e}
.d.on b{color:#2b2b2f;background:var(--brand-yellow)}
.d[disabled]{cursor:default}
/* registro impianti per paziente */
.paz-grid{display:flex;flex-direction:column;gap:10px}
.paz{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:inherit;box-shadow:var(--shadow)}
.paz:hover{border-color:color-mix(in srgb,var(--brand-purple) 45%,var(--line))}
.paz .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.paz .n{font:700 17px/1.2 var(--f-display)}
.paz .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.paz .go{color:var(--muted);transform:rotate(180deg);display:flex}
.pav{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;font:800 16px/1 var(--f-display);background:var(--purple-soft);color:var(--brand-purple)}
.pav.pav-l{width:62px;height:62px;border-radius:20px;font-size:22px}
.dchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.dc{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--brand-yellow) 55%,transparent);color:#4a3d05}
.dc.cnt{background:var(--accent-soft);color:var(--accent)}.dc.vuoto{background:var(--surface-3);color:var(--muted)}
.paz-head{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.odo-card{padding:14px 14px 10px}
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;margin-bottom:8px;color:inherit;font-weight:700;font-size:14.5px;text-align:left}
.grp-h span:last-child::first-letter{text-transform:uppercase}
.grp-n{min-width:34px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--brand-yellow);color:#2b2b2f;font:800 14px/1 var(--f-display);padding:0 6px}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lab{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;color:inherit;box-shadow:var(--shadow);min-width:0;transition:transform .15s,border-color .15s}
.lab:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.lab-img{aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--muted);margin-bottom:4px}
.lab-img img{width:100%;height:100%;object-fit:cover;display:block}.lab-img svg{width:34px;height:34px}
.lab-t{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab-m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab-open{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;background:var(--surface-2);border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;padding:12px}
.lab-open .grow{flex:1 1 240px;min-width:0}
.lab-big{width:180px;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
.lab-big img{width:100%;height:100%;object-fit:cover;display:block}
.lab-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin:8px 0 0}
.lab-dl dt{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.lab-dl dd{margin:0;font-weight:600;font-size:14px}
dialog.dlg.wide{width:min(720px,96vw);max-height:92vh}
dialog.dlg.wide .db{max-height:calc(92vh - 100px);overflow:auto}
.dente-art{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand-yellow) 30%,transparent)}
.dente-art svg{width:26px!important;height:52px!important}
.dente-art .radice{fill:var(--surface);stroke:var(--muted);stroke-width:1.6}.dente-art .corona{fill:var(--brand-yellow);stroke:#8a6a0e;stroke-width:1.8}.dente-art .vite{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.big-add{width:100%;margin-top:12px;min-height:50px}
.d.cur{background:var(--accent-soft)!important}
.d b sup{font-size:9px;margin-left:1px}
.ql{display:none;flex-basis:100%;font-size:11.5px;font-weight:700;color:var(--muted);margin:2px 0 0}
@media (max-width:640px){

<body>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {

  udi: '<path d="M8 3c-2 0-3 2-3 4 0 3 2 4 2 7s1 7 3 7 2-4 2-6c0 2 0 6 2 6s3-4 3-7 2-4 2-7c0-2-1-4-3-4-1.5 0-2.5 1-4 1S9.5 3 8 3z"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  man: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5L17 4l3 3-2.5 2.5"/><path d="M5 5l4 4M4 8l4-4"/>',
  filtro: '<path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/>', tubo: '<path d="M5 20V9a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v3a3 3 0 0 0 3 3h1"/><path d="M19 12v6"/>',
  cordone: '<path d="M4 6c3 0 3 4 6 4s3-4 6-4 3 4 4 4"/><path d="M4 14c3 0 3 4 6 4s3-4 6-4 3 4 4 4"/>', drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  amalgama: '<circle cx="12" cy="12" r="8"/><path d="M12 8a4 4 0 1 1-4 4"/>', reg: '<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  down: '<path d="M12 4v11M7 10.5l5 5 5-5"/><path d="M5 20h14"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>', hist: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
};
const ART = {
  riunito: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9.5" width="10" height="5" rx="2.5" transform="rotate(-12 14 12)"/><path d="M13.5 17.5l3.6-.8 4.6 17.8-4.4 1z"/><path d="M19 36.5h22.5l11 8.5"/><path d="M18.5 40h21l9.6 7.6"/><path d="M30 40.5v11"/><path d="M21 54h18"/><path d="M38 6.5h15.5v7"/><path d="M49.5 13.5h8l-2 4.5h-4z"/><path d="M33 25h17M41.5 25v11.5"/><path d="M36 25v-3M40 25v-3M44 25v-3"/></svg>',
  aspiratore: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="18" width="30" height="36" rx="4"/><path d="M20 18v-5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v5"/><path d="M20 25h18M20 29h18"/><circle cx="29" cy="42" r="6.5"/><path d="M29 38.5a3.5 3.5 0 1 1-3.5 3.5"/><path d="M44 24h6a4 4 0 0 1 4 4v14"/><path d="M51 42h6v4h-6z"/><path d="M18 54v3.5M40 54v3.5"/></svg>',
};
ART.autoclave = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="17" width="50" height="34" rx="5"/><circle cx="25" cy="34" r="10.5"/><circle cx="25" cy="34" r="6"/><path d="M35.5 34h3"/><rect x="42" y="23" width="10" height="6.5" rx="1.5"/><circle cx="44.5" cy="37" r="1.4"/><circle cx="49.5" cy="37" r="1.4"/><path d="M42 44h10"/><path d="M13 51v4M51 51v4"/><path d="M20 12c-1.5-1.6 1.5-2.8 0-4.6M26 12c-1.5-1.6 1.5-2.8 0-4.6M32 12c-1.5-1.6 1.5-2.8 0-4.6"/></svg>';
const AC = { riunito: 'var(--accent)', aspiratore: 'var(--brand-purple)' };
const VICON = { filtro_riunito: 'filtro', filtro_bacinella: 'drop', tubi_aspiranti: 'tubo', cordoni: 'cordone', filtro_aspiratore: 'filtro', filtro_amalgama: 'amalgama' };
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
async function api(method, url, body) {
  const r = await fetch(url, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/accedi?next=' + encodeURIComponent(location.href); throw new Error('Accesso richiesto'); }
  if (!r.ok) throw new Error(j.error || 'Errore, riprova.');
  return j;
}
let toastT;
function toast(t, ms = 3500) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${+d} ${MESI[+m - 1]} ${y}`; };
const fmtDL = s => new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(String(s).slice(0, 10) + 'T12:00:00'));
const ora = s => s ? new Date(s).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const NOMI_TEST = { bd: 'Bowie-Dick', helix: 'Helix test', spore: 'Test delle spore' };
const ESITO = { ok: 'Superato', ko: 'Non superato', attesa: 'In incubazione' };

// Foto dal telefono: ridotta a 1600 px (JPEG) prima dell'invio, così è leggera ma leggibile
function riduci(file, max = 1600) {
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => ko(new Error('Non riesco ad aprire la foto.'));
    img.src = url;
  });
}
function vediFoto(src) { const d = $('#ph'); d.querySelector('img').src = src; d.showModal(); }
const fotoBtn = (id, cls = '') => id ? `<button class="thumbbtn" data-foto="api/foto/${esc(id)}" aria-label="Apri la foto"><img class="thumb ${cls}" src="api/foto/${esc(id)}" alt="Foto" loading="lazy"></button>` : '';

const S = { att: null, reg: null, regF: {}, attForm: null, view: 'home', st: null, sede: '', macchine: null, scheda: null, form: null, storico: null, udi: null, q: '', paz: null, pz: null, pzForm: null, dente: null, lab: null, medici: null, cur: null, busy: false };

/* ============ barra e navigazione ============ */
function renderTop() {
  const st = S.st; if (!st) return;
  const tabs = [['home', 'Inizio', 'back']];
  if (st.sterilizzazione && !st.sterilizzazione.spenta) tabs.push(['steri', 'Sterilizzazione', 'steri']);
  if (st.udi && !st.udi.spenta) tabs.push(['udi', 'Registro impianti', 'udi']);
  if (st.manutenzione && !st.manutenzione.spenta) tabs.push(['man', 'Manutenzione', 'man']);
  const vista = { scheda: 'steri', storico: 'steri', macchina: 'steri', paz: 'udi', manreg: 'man' }[S.view] || S.view;
  $('#tabs').innerHTML = tabs.map(([k, l, i]) => `<button class="tab ${vista === k ? 'on' : ''}" data-go="${k}">${ic(i)}${l}</button>`).join('')
    + (st.magazzino ? `<a class="tab" href="${esc(st.magazzino)}">${ic('box')}Magazzino</a>` : '');
  const n = st.me.nome || '';
  $('#who').innerHTML = `<span class="av">${esc(n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase())}</span><b>${esc(n.split(' ')[0])}</b>`;
}
function go(view, extra = {}) {
  Object.assign(S, { view, ...extra });
  const u = new URL(location.href);
  u.search = view === 'home' ? '' : '?v=' + view + (S.id ? '&id=' + encodeURIComponent(S.id) : '');
  history.replaceState(null, '', u);
  window.scrollTo(0, 0);
  load();
}
async function load() {
  try {
    if (S.view === 'steri' || S.view === 'home') { if (S.st.sterilizzazione && !S.st.sterilizzazione.spenta) S.macchine = (await api('GET', 'api/steri/macchine')).macchine; }
    if (S.view === 'scheda') S.scheda = await api('GET', 'api/steri/schede/' + encodeURIComponent(S.id));
    if (S.view === 'storico') S.storico = (await api('GET', 'api/steri/storico?macchina=' + encodeURIComponent(S.id))).schede;
    if (S.view === 'man' || S.view === 'manreg' || (S.view === 'home' && S.st.manutenzione && !S.st.manutenzione.spenta)) { const r = await api('GET', 'api/man/attrezzature'); S.att = r.attrezzature; S.attLink = r.sedi; }
    if (S.view === 'manreg') { const f = S.regF; S.reg = (await api('GET', 'api/man/registro?' + new URLSearchParams({ sede: f.sede || '', attrezzatura: f.att || '', da: f.da || '', a: f.a || '' }))).righe; }
    if (S.view === 'udi') S.paz = (await api('GET', 'api/udi/pazienti?q=' + encodeURIComponent(S.q) + (S.sede ? '&sede=' + encodeURIComponent(S.sede) : ''))).pazienti;
    if (S.view === 'paz') { S.pz = await api('GET', 'api/udi/pazienti/' + encodeURIComponent(S.id)); if (!S.medici) api('GET', 'api/udi/medici').then(r => S.medici = r.medici).catch(() => {}); }
  } catch (e) { $('#main').innerHTML = `<div class="empty"><b>${esc(e.message)}</b><button class="btn" data-go="home">Torna all'inizio</button></div>`; return; }
  render();
}
function render() {
  renderTop();
  const v = { home: vHome, steri: vSteri, scheda: vScheda, storico: vStorico, udi: vUdi, paz: vPaz, man: vMan, manreg: vManReg }[S.view] || vHome;
  $('#main').innerHTML = v();
}

/* ============ ingresso ============ */
function avvisiTot() { return (S.macchine || []).reduce((n, m) => n + m.stato.avvisi.filter(a => a.livello === 'rosso').length, 0); }
function vHome() {
  const st = S.st, steri = st.sterilizzazione && !st.sterilizzazione.spenta, udi = st.udi && !st.udi.spenta;
  const rossi = avvisiTot(), gialli = (S.macchine || []).reduce((n, m) => n + m.stato.avvisi.filter(a => a.livello === 'giallo').length, 0);
  return `<div class="hello">Ciao ${esc((st.me.nome || '').split(' ')[0])}</div><div class="muted">Cosa vuoi aprire?</div>
  <div class="bigs">

      <span><h2>Compliance sterilizzazione</h2><p>Sterilizzatrici, test Bowie-Dick, Helix e spore, cicli con la foto della vapor line.</p></span>
      <span class="st"><span>${rossi ? `<span class="tag ko">${rossi} da sistemare</span>` : gialli ? `<span class="tag todo">${gialli} da fare oggi</span>` : (S.macchine || []).length ? '<span class="tag ok">Tutto in regola</span>' : '<span class="tag plain">Aggiungi le sterilizzatrici</span>'}</span><span class="go">Apri →</span></span></button>` : ''}
    ${udi ? `<button class="big" style="--bc:var(--brand-purple)" data-go="udi"><span class="bi">${ic('udi')}</span>
      <span><h2>Registro impianti</h2><p>Impianti e materiali impiantabili per paziente, con lotto, scadenza e codice UDI dalla foto dell'etichetta.</p></span>
      <span class="st"><span class="tag plain">Normativa UDI</span><span class="go">Apri →</span></span></button>` : ''}
    ${st.manutenzione && !st.manutenzione.spenta ? `<button class="big" style="--bc:#C27C2C" data-go="man"><span class="bi">${ic('man')}</span>
      <span><h2>Manutenzione attrezzature</h2><p>Riuniti e aspiratori della sede: pulizia filtri, tubi aspiranti e cordoni, con registro.</p></span>
      <span class="st"><span class="tag plain">${(S.att || []).length ? (S.att || []).length + ' attrezzature' : 'Registro manutenzioni'}</span><span class="go">Apri →</span></span></button>` : ''}

      <span><h2>Magazzino</h2><p>Disponibilità degli articoli, prenotazioni e riordino ai fornitori.</p></span>

  </div>`;

/* ============ sterilizzazione: le sterilizzatrici ============ */
const pillTest = (nome, es) => `<span class="pill ${es === 'ok' ? 'ok' : es === 'ko' ? 'ko' : ''}">${es === 'ok' ? ic('check') : es === 'ko' ? ic('x') : ''}${nome}${es ? '' : ': da fare'}</span>`;
function vSteri() {
  const p = S.st.sterilizzazione, ms = S.macchine || [];

  const vis = ms.filter(m => !S.sede || m.sedeId === S.sede);
  return `<div class="head"><div style="flex:1 1 260px"><h2 class="view">Compliance sterilizzazione</h2>

    <button class="btn" data-a="nuova-macchina">${ic('plus')}Aggiungi sterilizzatrice</button></div>
  ${S.form?.tipo === 'macchina' ? formMacchina() : ''}
  ${!sedi.length ? '<div class="card empty"><b>Nessuna sede assegnata</b>Chiedi all\'amministratore di assegnarti la tua sede in Gestione accessi.</div>'
    : vis.length ? `${[...new Set(vis.map(m => m.sede))].map(sede => `${sedi.length > 1 && !S.sede ? `<div class="sede-h">${esc(sede)}</div>` : ''}<div class="ster-grid">${vis.filter(m => m.sede === sede).map(m => {
      const s = m.stato, rossi = s.avvisi.filter(a => a.livello === 'rosso'), gialli = s.avvisi.filter(a => a.livello === 'giallo');
      const stato = rossi.length ? 'ko' : gialli.length ? 'todo' : 'ok';
      const chip = (nome, es) => `<span class="sc ${es === 'ok' ? 'ok' : es === 'ko' ? 'ko' : ''}">${es === 'ok' ? ic('check') : es === 'ko' ? ic('x') : '<i></i>'}${nome}</span>`;

// Legge il DataMatrix / codice a barre dalla foto (BarcodeDetector del telefono, altrimenti ZXing)
let zx = null;
async function leggiCodice(dataUrl) {
  try {
    const img = new Image(); img.src = dataUrl; await img.decode();
    if ('BarcodeDetector' in window) {
      const det = new BarcodeDetector({ formats: ['data_matrix', 'qr_code', 'code_128', 'ean_13', 'gs1_databar'] });
      const r = await det.detect(img); if (r[0]?.rawValue) return r[0].rawValue;
    }
    if (!zx) await new Promise(ok => { const s = document.createElement('script'); s.src = 'vendor/zxing.js'; s.onload = ok; s.onerror = ok; document.head.append(s); zx = true; });
    if (window.ZXing) {
      const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const r = await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(img).catch(() => null);
      if (r) return r.getText();
    }
  } catch {}
  return '';
}

// Aggiornamento automatico: chi ha aperto la stessa sterilizzatrice vede subito i test fatti dagli altri
setInterval(() => {
  if (document.visibilityState !== 'visible' || S.busy || S.form || $('#dlg').open || $('#ph').open) return;
  if (S.view === 'scheda' || S.view === 'steri' || S.view === 'man') load();
}, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !S.form && !S.busy && ['scheda', 'steri', 'man'].includes(S.view)) load(); });

$('#dlg').addEventListener('close', () => {
  $('#dlg').classList.remove('wide');
  if (S.dente !== null) { S.dente = null; S.lab = null; S.labOpen = null; S.err = ''; if (S.view === 'paz') render(); }
});

/* ============ avvio ============ */
(async () => {
  try { S.st = await api('GET', 'api/stato'); } catch (e) { $('#main').innerHTML = `<div class="empty"><b>${esc(e.message)}</b></div>`; return; }
  const u = new URLSearchParams(location.search), v = u.get('v'), id = u.get('id');
  const ok = { steri: S.st.sterilizzazione, udi: S.st.udi, man: S.st.manutenzione };
  if (v === 'steri' && ok.steri) return go('steri');
  if ((v === 'scheda' || v === 'storico') && ok.steri && id) return go(v, { id });
  if (v === 'udi' && ok.udi) return go('udi');
  if ((v === 'man' || v === 'manreg') && S.st.manutenzione) return go(v);
  if (v === 'paz' && ok.udi && id) return go('paz', { id });
  // con una sola sezione si entra subito lì
  const solo = [ok.steri && 'steri', ok.udi && 'udi', ok.man && 'man', S.st.magazzino && 'mag'].filter(Boolean);
  if (solo.length === 1 && solo[0] !== 'mag') return go(solo[0]);
  go('home');
})();
</script>
</body>
</html>
