<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Protocolli</title>
<link rel="stylesheet" href="/fonts/tosmile.css?f=bricolage-grotesque:600,700|figtree:400,500,600,700,800">
<style>
:root{
  --bg:#E9EFEE; --dot:#C3CFCD; --surface:#FFFFFF; --surface-2:#F3F7F6; --fg:#13201F; --muted:#586866;
  --line:#D3DDDB; --accent:#0B6B63; --accent-soft:#D6ECE9; --accent-fg:#FFFFFF; --edge:#33423F;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1D6B3A; --ok-soft:#DDF1E3; --warn:#7A5200; --warn-soft:#FFF1CF;
  --shadow:0 1px 2px rgba(16,32,30,.06),0 8px 28px rgba(16,32,30,.10);
  --n-mkt:#F3AE66; --n-fase:#F5D568; --n-op:#8EC7F0; --n-ok:#8DD09D; --n-ko:#EF8C80; --n-care:#EF8DB9; --n-dec:#FFE29A; --n-fg:#171A19;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1615; --dot:#23312F; --surface:#162120; --surface-2:#1C2928; --fg:#E3EDEB; --muted:#94A6A3;
  --line:#2A3A38; --accent:#4DBDB0; --accent-soft:#16312E; --accent-fg:#06201D; --edge:#9FB2AF;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#7FD39A; --ok-soft:#173022; --warn:#F2C76B; --warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --n-mkt:#E39A50; --n-fase:#E2C052; --n-op:#79B5E0; --n-ok:#78BD89; --n-ko:#E07A6E; --n-care:#DE7BA8; --n-dec:#E8C35A; --n-fg:#121514; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1615; --dot:#23312F; --surface:#162120; --surface-2:#1C2928; --fg:#E3EDEB; --muted:#94A6A3;
  --line:#2A3A38; --accent:#4DBDB0; --accent-soft:#16312E; --accent-fg:#06201D; --edge:#9FB2AF;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --ok:#7FD39A; --ok-soft:#173022; --warn:#F2C76B; --warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --n-mkt:#E39A50; --n-fase:#E2C052; --n-op:#79B5E0; --n-ok:#78BD89; --n-ko:#E07A6E; --n-care:#DE7BA8; --n-dec:#E8C35A; --n-fg:#121514; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em}

/* barra in alto con i pulsanti delle sezioni */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:19px;line-height:1.1;margin:0;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding:2px}.nav::-webkit-scrollbar{display:none}
.nav button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;min-height:40px}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nav .badge{background:var(--n-fase);color:var(--n-fg);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;line-height:1.15}
.who b{display:block;font-weight:700}
.who span{color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
@media (max-width:1100px){.who .txt{display:none}}
@media (max-width:760px){.top-in{flex-wrap:wrap}.nav{order:3;flex-basis:100%}}

main{max-width:1240px;margin:0 auto;padding:18px 16px 100px;display:flex;flex-direction:column;gap:16px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px;max-width:760px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15.5px;min-height:46px}
.search .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h2{font-size:24px;margin:0;flex:1 1 auto}
.sub{color:var(--muted);margin:-6px 0 0;font-size:14px;max-width:880px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:16px;margin:0 0 8px}
a.btn{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{min-height:34px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.no{background:var(--danger-soft);color:var(--danger)} .tag.info{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;color:var(--fg);width:100%}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}

/* elenchi */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;width:100%;min-height:58px}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:600;font-size:15.5px}
.item .s{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.res .snip{font-size:13.5px;color:var(--muted);line-height:1.45}
mark{background:var(--n-fase);color:var(--n-fg);border-radius:3px;padding:0 2px}

/* tabelle */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}
.cell-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:17px}
.cell-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* finestre */
.layer{position:fixed;inset:0;z-index:50;background:rgba(10,20,19,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal.wide{width:min(1000px,100%)}
.modal.full{width:100%;height:100%;max-width:none;border-radius:16px}
.modal-h{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:21px;line-height:1.2;margin:4px 44px 0 0}
.modal-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.modal-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
@media (max-width:640px){.layer{padding:0;align-items:flex-end}.modal{border-radius:18px 18px 0 0;max-height:96%}.modal.full{border-radius:0;max-height:100%}}

/* lettore */
.doc-wrap{position:relative;flex:1;overflow:auto;background:var(--surface)}
.doc-body{padding:20px 22px 40px;max-width:76ch;margin:0 auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.sez{background:var(--surface-2);border-radius:12px;padding:13px 16px}
.sez h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-family:var(--f-body);font-weight:800}
.sez .t{font-size:16.5px;line-height:1.65;white-space:pre-line}
.protected .doc-body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.shield .doc-body{filter:blur(10px)}
.readonly{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:9px 20px;border-top:1px solid var(--line)}
.pdf-page{display:block;width:100%;margin:0 0 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* flussi */
.fl-tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.canvas{flex:999 1 560px;min-width:0;height:min(76vh,860px);overflow:auto;border:1px solid var(--line);border-radius:14px;background-color:var(--surface);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;position:relative;touch-action:pan-x pan-y}
.world-box{position:relative}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.world svg.edges path{fill:none;stroke:var(--edge);stroke-width:1.8}
.world svg.edges polygon{fill:var(--edge)}
.elab{position:absolute;font-size:12px;font-weight:800;padding:2px 8px;border-radius:7px;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.elab.si{background:var(--ok-soft);color:var(--ok)} .elab.no{background:var(--danger-soft);color:var(--danger)} .elab.alt{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.fn{position:absolute;transform:translate(-50%,-50%);width:180px;min-height:46px;border:0;border-radius:11px;padding:9px 12px 10px;background:var(--n-op);color:var(--n-fg);text-align:center;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.08);user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-body)}
.fn .l{font-weight:700;font-size:14px;line-height:1.25}
.fn .sb{font-size:12px;line-height:1.3;opacity:.85}
.fn .ch{font-size:11px;font-weight:800;background:rgba(255,255,255,.65);border-radius:6px;padding:1px 7px;color:#1b2422}
.fn .pi{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fn .pi svg{width:13px;height:13px}
.fn.c-mkt{background:var(--n-mkt)} .fn.c-fase{background:var(--n-fase)} .fn.c-op{background:var(--n-op)} .fn.c-ok{background:var(--n-ok)} .fn.c-ko{background:var(--n-ko)} .fn.c-care{background:var(--n-care)}
.fn.c-ini,.fn.c-fine{background:var(--accent);color:var(--accent-fg);border-radius:999px;width:160px}
.fn.c-dec{background:none;box-shadow:none;width:190px;min-height:120px;justify-content:center;padding:18px 34px}
.fn.c-dec::before{content:"";position:absolute;inset:0;background:var(--n-dec);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:-1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.fn.c-dec{isolation:isolate}
.fn.locked{opacity:.45;filter:grayscale(.6)}
.fn.sel{outline:3px solid var(--accent);outline-offset:3px}
.fn.from{outline:3px dashed var(--accent);outline-offset:3px}
.edit .fn{cursor:grab}
.side{flex:1 1 280px;display:flex;flex-direction:column;gap:12px}
.zoom{position:sticky;left:10px;top:10px;z-index:3;display:inline-flex;gap:4px;margin:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.zoom button{width:34px;height:34px;border:0;background:none;border-radius:8px;font-size:18px;font-weight:700}
.guida{max-width:640px;display:flex;flex-direction:column;gap:12px}
.g-card{border-radius:16px;padding:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.g-card.dec{background:var(--warn-soft);border-color:transparent}
.g-card .q{font:700 22px/1.3 var(--f-display)}
.g-btn{min-height:54px;border-radius:12px;font-size:16px;font-weight:700;border:0;background:var(--accent);color:var(--accent-fg)}
.g-btn.no{background:var(--surface);color:var(--danger);border:2px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.g-btn.alt{background:var(--fg);color:var(--bg)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumbs span{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}

/* test */
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15.5px;width:100%}
.opt b{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);font-size:13px}
.opt.on{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.on b{background:var(--accent);color:var(--accent-fg)}
.opt.giusta{border:2px solid var(--ok);background:var(--ok-soft)}
.big-score{font:800 64px/1 var(--f-display)}
.esito{border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.esito.ok{background:var(--ok-soft);color:var(--ok)} .esito.no{background:var(--danger-soft);color:var(--danger)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* assistente */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;padding:13px 18px;box-shadow:var(--shadow)}
.chat-list{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px;white-space:pre-line}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul,.msg.a ol{margin:0 0 8px;padding-left:20px}
.cit{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;border-radius:6px;padding:0 6px;margin:0 1px;vertical-align:1px}
.modal.chat{height:min(760px,92vh)}
.chat-in{display:flex;gap:8px;align-items:flex-end;width:100%}
.chat-in textarea{flex:1;min-height:46px;max-height:140px}

/* protezione dei contenuti per chi non è amministratore */
body.protetto{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.protetto input,body.protetto textarea{-webkit-user-select:text;user-select:text}
.filigrana{position:fixed;inset:0;pointer-events:none;z-index:9999;background-repeat:repeat}
.stampa-no{display:none}
@media print{body.protetto>*{display:none!important}body.protetto>.stampa-no{display:block!important;font:16px sans-serif;padding:40px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg></div><h1>Protocolli</h1></div>
  <nav class="nav" id="nav" aria-label="Sezioni"></nav>
  <div class="who" id="who"></div>
</div></header>
<main id="main"><p class="muted">Carico…</p></main>
<script src="https://appgestione.it/static/resta-qui.js?v=6" defer></script>
<script>
'use strict';
const MODE = location.pathname.startsWith('/admin') ? 'admin' : 'view';
const I = {
  doc: '<svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
};
let S = null, me = null, view = '', q = '', toastT;
const isAdmin = () => me && me.role === 'admin';
const adminArea = () => isAdmin(); // l'amministratore vede solo l'area admin, l'utente solo la sua
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtD = s => s ? s.split('-').reverse().join('/') : '';
const figNome = id => (S.figure.find(f => f.id === id) || {}).nome || id;
function toast(m){ let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.append(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }
async function api(method, url, body, isForm){
  const o = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) { if (isForm) o.body = body; else { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); } }
  const r = await fetch(url, o);
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { location.reload(); throw new Error('Accesso scaduto'); }
  if (!r.ok) throw new Error(j.error || 'Errore ' + r.status);
  return j;
}
function layer(html, cls){
  const l = document.createElement('div'); l.className = 'layer';
  l.innerHTML = `<div class="modal ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(l);
  l.addEventListener('click', e => { if (e.target === l || e.target.closest('[data-x]')) closeLayer(l); });
  return l;
}
function closeLayer(l){ l.remove(); if (l._onClose) l._onClose(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const ls = document.querySelectorAll('.layer'); if (ls.length) closeLayer(ls[ls.length - 1]); } });
function armed(btn, label){ if (btn.classList.contains('armed')) return true; btn.classList.add('armed'); btn.textContent = label || 'Conferma'; setTimeout(() => btn.isConnected && btn.classList.remove('armed'), 4000); return false; }

/* ---------- ricerca nei titoli e nei testi ---------- */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function snippet(txt, term){
  const n = norm(txt), i = n.indexOf(norm(term)); if (i < 0) return null;
  const a = Math.max(0, i - 60), b = Math.min(txt.length, i + term.length + 90);
  return (a ? '…' : '') + esc(txt.slice(a, i)).replace(/\n/g, ' ') + '<mark>' + esc(txt.slice(i, i + term.length)) + '</mark>' + esc(txt.slice(i + term.length, b)).replace(/\n/g, ' ') + (b < txt.length ? '…' : '');
}
function flowTesto(f){ return f.name + '\n' + f.nodes.filter(n => !n.locked).map(n => [n.label, ...(n.sub || []), n.chi ? figNome(n.chi) : ''].join('\n')).join('\n'); }
function renderRicerca(v){
  const term = q.trim(), out = [];
  const tutti = term.split(/\s+/).filter(Boolean);
  for (const p of S.prot) {
    const testo = p.titolo + '\n' + (p.testo || '');
    if (tutti.every(t => norm(testo).includes(norm(t)))) out.push({ k: 'p', id: p.id, tipo: 'Protocollo · ' + p.cartella, titolo: p.titolo, snip: snippet(testo, tutti[0]) || '' });
  }
  for (const f of (S.flows || [])) {
    const testo = flowTesto(f);
    if (tutti.every(t => norm(testo).includes(norm(t)))) out.push({ k: 'f', id: f.id, tipo: 'Flusso di lavoro', titolo: f.name, snip: snippet(testo, tutti[0]) || '' });
  }
  v.innerHTML = `<p class="muted" style="margin:0 0 10px">${out.length ? out.length + (out.length === 1 ? ' risultato' : ' risultati') : 'Nessun risultato'} per “${esc(term)}”</p>
    <div class="group">${out.map((r, i) => `<button class="item res" data-r="${i}"><span class="grow"><span class="eyebrow">${esc(r.tipo)}</span><span class="t">${esc(r.titolo)}</span><span class="snip">${r.snip}</span></span>${I.right}</button>`).join('')}</div>`;
  v.onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; const r = out[+b.dataset.r]; if (r.k === 'p') apriProt(r.id, tutti); else apriFlusso(r.id); };
}

function watermarkCss(){
  const t = `${me.name || me.username} · ${new Date().toLocaleDateString('it-IT')} · Riservato`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='380' height='230'><text x='190' y='120' text-anchor='middle' transform='rotate(-24 190 115)' font-family='Figtree, sans-serif' font-weight='600' font-size='13' fill='rgba(110,120,118,0.10)'>${esc(t)}</text></svg>`;
  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
}
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; ko(new Error('Lettore PDF non disponibile')); };
    document.head.append(s);
  });
  return pdfjsReady;
}
async function renderPdf(id, host){
  host.innerHTML = '<p class="muted">Apro il documento…</p>';
  try {
    const [lib, buf] = await Promise.all([loadPdfJs(), fetch(`/api/p/prot/${id}/file`, {credentials: 'same-origin'}).then(r => { if (!r.ok) throw new Error('Documento non disponibile'); return r.arrayBuffer(); })]);
    const pdf = await lib.getDocument({data: buf}).promise;
    host.innerHTML = '';
    const width = Math.min(host.clientWidth || 700, 900), ratio = Math.min(devicePixelRatio || 1, 2);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({scale: 1}), vpt = page.getViewport({scale: width / v1.width * ratio});
      const c = document.createElement('canvas'); c.width = vpt.width; c.height = vpt.height; c.className = 'pdf-page';
      host.append(c);
      await page.render({canvasContext: c.getContext('2d'), viewport: vpt}).promise;
      if (!host.isConnected) return;
    }
  } catch (e) { host.innerHTML = `<p class="note">${esc(e.message)}</p>`; }
}
function evidenzia(html, terms){
  if (!terms || !terms.length) return html;
  let out = html;
  terms.filter(t => t.length >= 2).forEach(t => { const re = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); out = out.replace(/>([^<]+)</g, (m, txt) => '>' + txt.replace(re, '<mark>$1</mark>') + '<'); });
  return out;
}
function apriProt(id, terms){
  const p = S.prot.find(x => x.id === id); if (!p) return;
  const prot = !isAdmin();
  const corpo = (p.sezioni || []).length ? p.sezioni.map(s => `<section class="sez"><h4>${esc(s.h)}</h4><div class="t">${esc(s.t)}</div></section>`).join('') : '';
  const l = layer(`<div class="modal-h"><div class="eyebrow">${esc(p.cartella)}</div><h2>${esc(p.titolo)}</h2><p>Aggiornato il ${fmtD(p.agg)}</p><button class="x-btn" data-x aria-label="Chiudi">${I.x}</button></div>
    <div class="doc-wrap ${prot ? 'protected' : ''}" style="background-image:${watermarkCss()}"><div class="doc-body">${evidenzia(corpo, terms)}${!corpo && p.hasFile ? '<div class="pdfh"></div>' : ''}${!corpo && !p.hasFile ? '<p class="muted">Protocollo senza testo.</p>' : ''}</div></div>
    <div class="readonly">${I.lock}${prot ? 'Solo lettura · riservato a ' + esc(me.name || me.username) : 'Vista amministratore: i collaboratori lo vedono in sola lettura, con la loro filigrana'}</div>`, 'wide full');
  const w = l.querySelector('.doc-wrap');
  if (!corpo && p.hasFile) renderPdf(p.id, l.querySelector('.pdfh'));
  if (prot) ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => w.addEventListener(ev, e => e.preventDefault()));
  const first = l.querySelector('mark'); if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 60);
  if (!isAdmin()) api('POST', '/api/p/letto/' + p.id).then(() => { if (p.nuovo) { p.nuovo = false; if (view === 'prot' && !q) render(); } }).catch(() => {});
}
document.addEventListener('visibilitychange', () => document.querySelectorAll('.doc-wrap.protected').forEach(w => w.classList.toggle('shield', document.hidden)));
function proteggi(){
  if (document.body.classList.contains('protetto')) return;
  document.body.classList.add('protetto');
  const testo = () => `${me.name || ''} · ${me.username || ''} · ${new Date().toLocaleString('it-IT', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'})}`;
  const fil = document.createElement('div'); fil.className = 'filigrana'; fil.setAttribute('aria-hidden', 'true');
  const disegna = () => {

    fil.style.backgroundImage = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  };

  document.addEventListener('contextmenu', e => { if (!campo(e.target)) e.preventDefault(); });

    if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 's' || (['c', 'x', 'a'].includes(k) && !campo(e.target)))) { e.preventDefault(); toast('Copia e stampa dei protocolli non sono consentite'); }
  });
  document.addEventListener('keyup', e => { if (e.key === 'PrintScreen') { navigator.clipboard?.writeText('').catch(() => {}); toast('Le immagini dei protocolli sono riservate'); } });

/* ---------- flussi di lavoro: disegno ---------- */
const TIPI = [['op', 'Passo'], ['dec', 'Decisione Sì/No'], ['ini', 'Inizio'], ['fine', 'Fine'], ['fase', 'Fase'], ['ok', 'Esito positivo'], ['ko', 'Esito negativo'], ['care', 'Cura'], ['mkt', 'Marketing']];
let FL = null; // stato del disegno aperto: {flow, el, zoom, edit, sel, from, drag}
function protDelNodo(f, n){
  const out = []; const ids = new Set();
  if (n.prot) { const p = S.prot.find(x => x.id === n.prot); if (p) { out.push(p); ids.add(p.id); } }
  S.prot.filter(p => p.srcFlow === f.id && p.srcNode === n.id && !ids.has(p.id)).forEach(p => out.push(p));
  return out;
}
function disegna(host, f, opts){
  const nodes = f.nodes;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = (xs.length ? Math.min(...xs) : 0) - 140, minY = (ys.length ? Math.min(...ys) : 0) - 100, maxX = Math.max(minX + 600, ...xs) + 160, maxY = Math.max(minY + 400, ...ys) + 140;
  const W = maxX - minX, H = maxY - minY;
  if (!opts.zoom) opts.zoom = Math.max(0.35, Math.min(1, ((host.clientWidth || 800) - 24) / W));
  const z = opts.zoom;
  host.innerHTML = `<div class="zoom"><button data-z="-" aria-label="Riduci">−</button><button data-z="0" aria-label="Adatta alla finestra" title="Adatta" style="font-size:12px;width:auto;padding:0 8px">${Math.round(z * 100)}%</button><button data-z="+" aria-label="Ingrandisci">+</button></div>
    <div class="world-box" style="width:${W * z}px;height:${H * z}px"><div class="world" style="width:${W}px;height:${H}px;transform:scale(${z})">
    <svg class="edges" width="${W}" height="${H}"></svg>
    ${nodes.map(n => {
      const pr = protDelNodo(f, n);
      const c = TIPI.some(t => t[0] === n.c) ? n.c : 'op';
      return `<button class="fn c-${c} ${n.locked ? 'locked' : ''} ${opts.sel === n.id ? 'sel' : ''} ${opts.from === n.id ? 'from' : ''}" data-n="${esc(n.id)}" style="left:${n.x - minX}px;top:${n.y - minY}px">
        <span class="l">${esc(n.label || (c === 'dec' ? 'Domanda?' : ''))}</span>${(n.sub || []).length && c !== 'dec' ? `<span class="sb">${(n.sub || []).map(esc).join('<br>')}</span>` : ''}
        ${n.chi ? `<span class="ch">${esc(n.chi)}</span>` : ''}${pr.length && !n.locked ? `<span class="pi" title="Protocollo collegato">${I.doc}</span>` : ''}</button>`;
    }).join('')}
    </div></div>`;
  host._off = { minX, minY };
  frecce(host, f);
}
function frecce(host, f){
  const world = host.querySelector('.world'), svg = world.querySelector('svg.edges');
  const box = {};
  world.querySelectorAll('.fn').forEach(el => { box[el.dataset.n] = { x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: el.offsetWidth, h: el.offsetHeight, dec: el.classList.contains('c-dec') }; });
  world.querySelectorAll('.elab').forEach(x => x.remove());
  let paths = '';
  f.edges.forEach(e => {
    const s = box[e[0]], t = box[e[1]]; if (!s || !t) return;
    const lab = typeof e[2] === 'string' && e[2] !== 'loop' ? e[2] : '';
    let d, lx, ly, tx = t.x, ty = t.y - t.h / 2, dir = 1;
    if (ty < s.y + s.h / 2 - 4) { // il punto di arrivo sta sopra: entra dal lato
      const da = tx >= s.x ? 1 : -1; const sx = s.x + da * s.w / 2, sy = s.y;
      const ex = t.x - da * t.w / 2, ey = t.y; const mx = (sx + ex) / 2;
      d = `M${sx} ${sy} H${mx} V${ey} H${ex - da * 2}`; lx = sx + da * 22; ly = sy - 12; dir = 0;
      paths += `<path d="${d}"/><polygon points="${ex - da * 11},${ey - 6} ${ex - da * 11},${ey + 6} ${ex},${ey}"/>`;
    } else if (s.dec && Math.abs(tx - s.x) > 60) {
      const sx = tx > s.x ? s.x + s.w / 2 : s.x - s.w / 2, sy = s.y;
      d = `M${sx} ${sy} H${tx} V${ty - 2}`; lx = sx + (tx > s.x ? 24 : -24); ly = sy - 13;
      paths += `<path d="${d}"/><polygon points="${tx - 6},${ty - 11} ${tx + 6},${ty - 11} ${tx},${ty}"/>`;
    } else {
      const sx = s.x, sy = s.y + s.h / 2, my = Math.round((sy + ty) / 2);
      d = Math.abs(sx - tx) < 2 ? `M${sx} ${sy} V${ty - 2}` : `M${sx} ${sy} V${my} H${tx} V${ty - 2}`; lx = sx + 18; ly = sy + 14;
      paths += `<path d="${d}"/><polygon points="${tx - 6},${ty - 11} ${tx + 6},${ty - 11} ${tx},${ty}"/>`;
    }
    if (lab) { const sp = document.createElement('span'); sp.className = 'elab ' + (/^s[iì]$/i.test(lab) ? 'si' : /^no$/i.test(lab) ? 'no' : 'alt'); sp.textContent = lab; sp.style.left = lx + 'px'; sp.style.top = ly + 'px'; world.append(sp); }
  });
  svg.innerHTML = paths;
}

/* ---------- flussi: utente ---------- */
function renderFlussi(v){
  if (adminArea()) return renderFlussiAdmin(v);
  const fl = S.flows || [];
  if (!fl.length) { v.innerHTML = '<div class="card empty">Nessun flusso di lavoro disponibile per la tua mansione.</div>'; return; }
  v.innerHTML = `<div class="grid2">${fl.map(f => { const dec = f.nodes.filter(n => n.c === 'dec').length;
    return `<button class="item" data-f="${esc(f.id)}"><span class="grow"><span class="t">${esc(f.name)}</span><span class="s">${f.nodes.length} elementi${dec ? ' · ' + dec + (dec === 1 ? ' decisione' : ' decisioni') : ''}</span></span>${I.right}</button>`; }).join('')}</div>`;
  v.onclick = e => { const b = e.target.closest('[data-f]'); if (b) apriFlusso(b.dataset.f); };
}
function apriFlusso(id){
  const f = (S.flows || []).find(x => x.id === id); if (!f) return;
  let vista = 'schema', zoom = null, cur = null, strada = [];
  const l = layer(`<div class="modal-h"><div class="eyebrow">Flusso di lavoro · solo visualizzazione</div><h2>${esc(f.name)}</h2>
    <div class="row" style="margin-top:10px"><button class="btn small" data-vista="schema">Schema</button><button class="btn small" data-vista="guida">Guidami passo passo</button></div><button class="x-btn" data-x aria-label="Chiudi">${I.x}</button></div>
    <div class="modal-b" style="padding:12px"><div class="host"></div></div>`, 'wide full');
  const host = l.querySelector('.host');
  const radici = () => { const entra = new Set(f.edges.map(e => e[1])); const r = f.nodes.filter(n => !entra.has(n.id) && !n.locked); return r.length ? r : f.nodes.slice(0, 1); };
  function draw(){
    l.querySelectorAll('[data-vista]').forEach(b => b.classList.toggle('primary', b.dataset.vista === vista));
    if (vista === 'schema') {
      host.innerHTML = '<div class="canvas" style="height:calc(100vh - 210px)"></div><p class="muted" style="font-size:13px;margin:8px 0 0">Tocca un elemento con l\'icona del documento per aprire il protocollo collegato.</p>';
      const o = { zoom }; disegna(host.firstChild, f, o); zoom = o.zoom;
      return;
    }
    const nodo = cur ? f.nodes.find(n => n.id === cur) : null;
    if (!nodo) {
      const r = radici();
      if (r.length === 1) { cur = r[0].id; return draw(); }
      host.innerHTML = `<div class="guida"><p class="muted">Da dove parti?</p>${r.map(n => `<button class="g-btn alt" data-vai="${esc(n.id)}">${esc(n.label)}</button>`).join('')}</div>`;
      return;
    }
    const usc = f.edges.filter(e => e[0] === nodo.id).map(e => ({ to: f.nodes.find(n => n.id === e[1]), lab: typeof e[2] === 'string' && e[2] !== 'loop' ? e[2] : '' })).filter(x => x.to && !x.to.locked);
    const pr = protDelNodo(f, nodo);
    const tipo = nodo.c === 'dec' ? 'Decisione' : nodo.c === 'ini' ? 'Inizio' : nodo.c === 'fine' ? 'Fine' : 'Passo';
    host.innerHTML = `<div class="guida">${strada.length ? `<div class="crumbs">${strada.slice(-4).map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
      <div class="g-card ${nodo.c === 'dec' ? 'dec' : ''}"><span class="eyebrow">${tipo}</span><span class="q">${esc(nodo.label)}</span>
        ${(nodo.sub || []).length ? `<span class="muted">${(nodo.sub || []).map(esc).join('<br>')}</span>` : ''}
        ${nodo.chi ? `<span>Chi lo fa: <b>${esc(figNome(nodo.chi))}</b></span>` : ''}
        ${pr.map(p => `<button class="btn small" style="align-self:flex-start" data-prot="${p.id}">${I.doc}${esc(p.titolo)}</button>`).join('')}</div>
      ${usc.map((u, i) => `<button class="g-btn ${/^no$/i.test(u.lab) ? 'no' : /^s[iì]$/i.test(u.lab) ? '' : usc.length > 1 ? 'alt' : ''}" data-u="${i}">${esc(u.lab || (usc.length > 1 ? u.to.label : 'Avanti'))}</button>`).join('')}
      ${!usc.length ? '<p class="muted">Fine del flusso.</p><button class="btn" data-reset>Ricomincia</button>' : ''}</div>`;
    host.onclick = e => {
      const u = e.target.closest('[data-u]'); if (u) { const x = usc[+u.dataset.u]; strada.push(nodo.label + (x.lab ? ' → ' + x.lab : '')); cur = x.to.id; draw(); }
      if (e.target.closest('[data-reset]')) { cur = null; strada = []; draw(); }
    };
  }
  l.addEventListener('click', e => {

function faiTest(id){
  const t = S.test.find(x => x.id === id); if (!t) return;
  const risp = Object.assign({}, t.risposte || {}); let n = 0, salvaT;
  const l = layer('<div class="modal-h"><div class="eyebrow"></div><h2></h2><div class="prog" style="margin-top:10px"><i></i></div><button class="x-btn" data-x aria-label="Chiudi">' + I.x + '</button></div><div class="modal-b"></div><div class="modal-f"></div>', 'full');
  const salva = () => { clearTimeout(salvaT); salvaT = setTimeout(() => api('PUT', `/api/p/invio/${id}/risposte`, { risposte: risp }).catch(() => {}), 600); };
  l._onClose = () => { clearTimeout(salvaT); api('PUT', `/api/p/invio/${id}/risposte`, { risposte: risp }).then(refresh).catch(() => {}); };
  function draw(){
    const d = t.domande[n];
    l.querySelector('.eyebrow').textContent = esc(t.titolo);
    l.querySelector('h2').textContent = `Domanda ${n + 1} di ${t.domande.length}`;
    l.querySelector('.prog i').style.width = Math.round(100 * (n + 1) / t.domande.length) + '%';
    l.querySelector('.modal-b').innerHTML = `<div style="max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px">
      <span class="eyebrow">${d.tipo === 'mc' ? 'Scelta multipla' : 'Risposta aperta'}</span><div style="font:700 20px/1.35 var(--f-display)">${esc(d.t)}</div>
      ${d.tipo === 'mc' ? d.o.map((o, i) => `<button class="opt ${risp[n] === i ? 'on' : ''}" data-o="${i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')
        : `<textarea class="inp" rows="6" data-a placeholder="Scrivi la tua risposta con parole tue">${esc(risp[n] || '')}</textarea>`}</div>`;
    const ult = n === t.domande.length - 1;
    l.querySelector('.modal-f').innerHTML = `<span class="muted" style="margin-right:auto;font-size:13px;align-self:center">${Object.keys(risp).filter(k => risp[k] !== '' && risp[k] !== undefined).length} risposte date su ${t.domande.length}</span>
      <button class="btn" data-prev ${n ? '' : 'disabled'}>Indietro</button><button class="btn primary" data-next>${ult ? 'Consegna il test' : 'Avanti'}</button>`;
  }
  l.addEventListener('click', async e => {
    const o = e.target.closest('[data-o]'); if (o) { risp[n] = +o.dataset.o; salva(); draw(); }
    if (e.target.closest('[data-prev]') && n > 0) { n--; draw(); }

      if (mancano && !armed(nx, `Mancano ${mancano} risposte: consegna lo stesso`)) return;

      catch (err) { toast(err.message); draw(); }
    }
  });
  l.addEventListener('input', e => { if (e.target.matches('[data-a]')) { risp[n] = e.target.value; salva(); } });
  draw();
}

    if (!drag) return; const dx = (e.clientX - drag.sx) / st.zoom, dy = (e.clientY - drag.sy) / st.zoom;

    const ed = e.target.closest('[data-edel]'); if (ed) { f.edges.splice(+ed.dataset.edel, 1); salva(); draw(); }
    const nd = e.target.closest('[data-ndel]'); if (nd && n) { if (!armed(nd, 'Conferma: elimina elemento')) return; f.nodes = f.nodes.filter(x => x.id !== n.id); f.edges = f.edges.filter(x => x[0] !== n.id && x[1] !== n.id); st.sel = null; salva(); draw(); }

      return `<div class="card" style="display:flex;flex-direction:column;gap:6px;border-color:var(--warn)"><div class="row"><b style="flex:1">${n + 1}. ${esc(d.t)}</b><span class="tag ${v.ok ? 'ok' : 'no'}">${v.ok ? 'Corretta' : 'Non corretta'}</span></div>
        <div class="note" style="color:var(--fg)">“${esc(r || '—')}”</div><span class="muted" style="font-size:13px">${v.da === 'admin' ? 'Giudizio cambiato dall\'amministratore.' : 'Claude: ' + esc(v.motivo || '')} · Punti richiesti: ${esc(d.criteri)}</span>
        <div class="row"><button class="btn small" data-val="${n}" data-ok="${v.ok ? 0 : 1}">${v.ok ? 'Segna come non corretta' : 'Segna come corretta'}</button></div></div>`;
    }).join('');
  };
  l.addEventListener('click', async e => { const b = e.target.closest('[data-val]'); if (!b) return; b.disabled = true;
    try { const j = await api('POST', `/api/p/invio/${id}/valuta`, { n: +b.dataset.val, ok: b.dataset.ok === '1' }); i.valutazioni[+b.dataset.val] = { ...(i.valutazioni[+b.dataset.val] || {}), ok: b.dataset.ok === '1', da: 'admin' }; i.punti = j.punti; i.esito = j.esito; draw(); refresh(); } catch (err) { toast(err.message); b.disabled = false; } });
  draw();
}

/* ---------- assistente in chat ---------- */
const CHAT = { msgs: [] };
function mdLite(src, fonti){
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, g) => g.split(/\s*,\s*/).map(n => fonti && fonti[+n - 1] ? `<button class="cit" data-prot="${fonti[+n - 1].id}" title="${esc(fonti[+n - 1].titolo)}">${n}</button>` : '').join(''));
  let html = '', list = null;
  const chiudi = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const l of String(src || '').split('\n')) {
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { chiudi(); html += '<ul>'; list = 'ul'; } html += `<li>${inl(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { chiudi(); html += '<ol>'; list = 'ol'; } html += `<li>${inl(m[1])}</li>`; continue; }
    chiudi(); if (l.trim()) html += `<p>${inl(l.replace(/^#+\s*/, ''))}</p>`;
  }
  chiudi(); return html;
}
function apriChat(){
  const l = layer(`<div class="modal-h"><div class="eyebrow">Risponde solo dai protocolli che puoi vedere</div><h2>Assistente</h2><button class="x-btn" data-x aria-label="Chiudi">${I.x}</button></div>
    <div class="modal-b"><div class="chat-list"></div></div>
    <div class="modal-f"><div class="chat-in"><textarea class="inp" rows="1" data-dom placeholder="Fai una domanda sui protocolli…"></textarea><button class="btn primary" data-invia>Invia</button></div></div>`, 'wide chat');
  const lista = l.querySelector('.chat-list'), box = l.querySelector('.modal-b'), ta = l.querySelector('[data-dom]');
  const draw = (attesa) => {
    lista.innerHTML = (CHAT.msgs.length ? '' : '<p class="muted">Chiedi qualcosa sui protocolli: la risposta indica con un numero da quale protocollo arriva. Tocca il numero per aprirlo.</p>')
      + CHAT.msgs.map(m => m.role === 'user' ? `<div class="msg u">${esc(m.content)}</div>` : `<div class="msg a">${mdLite(m.content, m.fonti)}</div>`).join('')
      + (attesa ? '<div class="msg a"><span class="spin" style="width:16px;height:16px;border-width:2px"></span> Cerco nei protocolli…</div>' : '');
    box.scrollTop = box.scrollHeight;
  };
  async function invia(){
    const t = ta.value.trim(); if (!t) return;
    CHAT.msgs.push({ role: 'user', content: t }); ta.value = ''; draw(true);
    try { const j = await api('POST', '/api/p/chat', { messages: CHAT.msgs.map(m => ({ role: m.role, content: m.content })) }); CHAT.msgs.push({ role: 'assistant', content: j.text, fonti: j.fonti }); }
    catch (e) { CHAT.msgs.pop(); ta.value = t; toast(e.message); }
    draw(false);
  }
  l.addEventListener('click', e => { if (e.target.closest('[data-invia]')) invia(); const c = e.target.closest('[data-prot]'); if (c) apriProt(c.dataset.prot); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); invia(); } });
  draw(false); setTimeout(() => ta.focus(), 50);
}
function bottoneChat(){
  if (document.querySelector('.fab')) return;
  const b = document.createElement('button'); b.className = 'fab';
  b.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Assistente';
  b.onclick = apriChat; document.body.append(b);
}

/* ---------- avvio: protocolli + flussi (API esistente) ---------- */
(async () => {
  try {
    const [p, f] = await Promise.all([api('GET', '/api/p/state'), api('GET', '/api/state')]);
    S = p; S.flows = f.flows; S.figureAcc = f.figure || [];
    me = S.me;
    if (MODE === 'admin' && !isAdmin()) { location.href = '/'; return; }
    if (!isAdmin()) proteggi();
    const iniz = (me.name || me.username || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
    if (isAdmin() && MODE !== 'admin') history.replaceState(null, '', '/admin');
    document.getElementById('who').innerHTML = `<span class="txt"><b>${esc(me.name || me.username)}</b><span>${esc(isAdmin() ? 'Amministratore' : (me.figura ? figNome(me.figura) : 'Collaboratore'))}</span></span><span class="av">${esc(iniz)}</span>`;
    view = adminArea() ? 'contenitore' : (new URLSearchParams(location.search).get('v') === 'test' ? 'mieitest' : 'prot');
    render(); if (!isAdmin()) bottoneChat();
  } catch (e) { document.getElementById('main').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
})();
async function refresh(){ const [p, f] = await Promise.all([api('GET', '/api/p/state'), api('GET', '/api/state')]); S = p; S.flows = f.flows; S.figureAcc = f.figure || []; render(); }
</script>
