<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mappa dei Protocolli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una tela a tutto schermo (come Freeform) con barra in alto, pannello laterale per la fase e cassetto per l'assistente */
:root{
  --bg:#E9EFEE; --dot:#C3CFCD; --surface:#FFFFFF; --surface-2:#F3F7F6; --fg:#13201F; --muted:#586866;
  --line:#D3DDDB; --accent:#0B6B63; --accent-soft:#D6ECE9; --accent-fg:#FFFFFF; --edge:#33423F;
  --danger:#B42318; --danger-soft:#FBE3E0; --wm:rgba(11,107,99,.11); --shadow:0 1px 2px rgba(16,32,30,.06),0 8px 28px rgba(16,32,30,.10);
  --n-mkt:#F3AE66; --n-fase:#F5D568; --n-op:#8EC7F0; --n-ok:#8DD09D; --n-ko:#EF8C80; --n-care:#EF8DB9; --n-fg:#171A19;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1615; --dot:#23312F; --surface:#162120; --surface-2:#1C2928; --fg:#E3EDEB; --muted:#94A6A3;
  --line:#2A3A38; --accent:#4DBDB0; --accent-soft:#16312E; --accent-fg:#06201D; --edge:#9FB2AF;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --wm:rgba(120,210,200,.10); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --n-mkt:#E39A50; --n-fase:#E2C052; --n-op:#79B5E0; --n-ok:#78BD89; --n-ko:#E07A6E; --n-care:#DE7BA8; --n-fg:#121514; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1615; --dot:#23312F; --surface:#162120; --surface-2:#1C2928; --fg:#E3EDEB; --muted:#94A6A3;
  --line:#2A3A38; --accent:#4DBDB0; --accent-soft:#16312E; --accent-fg:#06201D; --edge:#9FB2AF;
  --danger:#FF8A7A; --danger-soft:#3A1D1A; --wm:rgba(120,210,200,.10); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --n-mkt:#E39A50; --n-fase:#E2C052; --n-op:#79B5E0; --n-ok:#78BD89; --n-ko:#E07A6E; --n-care:#DE7BA8; --n-fg:#121514; color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{display:flex;flex-direction:column;height:100%}
/* Header */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:nowrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
.brand-mark svg{width:18px;height:18px}
.brand h1{font:700 18px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tab.add{color:var(--accent);display:flex;align-items:center;gap:4px}
.tab.add svg{width:15px;height:15px}
.actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;line-height:1.15;text-align:left}
.who b{display:block;font-weight:700}
.who span{color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.av.admin{background:var(--accent);color:var(--accent-fg)}

/* Stage & canvas */
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
#viewport.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
#edges marker path{fill:var(--edge);stroke:none}
.node{position:absolute;width:calc(180px*var(--z,1));transform:translate(-50%,-50%);border:none;border-radius:calc(11px*var(--z,1));padding:calc(9px*var(--z,1)) calc(12px*var(--z,1)) calc(10px*var(--z,1));
  background:var(--n-op);color:var(--n-fg);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.08);
  transition:box-shadow .15s, transform .15s;user-select:none;-webkit-user-select:none;touch-action:none}
.node:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--n-fg) 30%,transparent),0 6px 18px rgba(0,0,0,.14)}
.node .nl{display:block;font-weight:800;font-size:calc(12.5px*var(--z,1));line-height:1.2;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.node ul{margin:calc(5px*var(--z,1)) 0 0;padding:0;list-style:none;text-align:left;font-size:calc(11.5px*var(--z,1));line-height:1.3;font-weight:600}
.node li{padding-left:10px;position:relative}
.node li::before{content:"•";position:absolute;left:0}
.node .badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--surface);color:var(--fg);
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 1px 4px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.node .badge svg{width:11px;height:11px;stroke-width:2.2}
.node.locked{opacity:.38;filter:saturate(.25);cursor:not-allowed}
.node.locked:hover{box-shadow:none}
.node.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--accent)}
.node.linking{outline:2.5px dashed var(--accent);outline-offset:4px}
.c-mkt{background:var(--n-mkt)}.c-fase{background:var(--n-fase)}.c-op{background:var(--n-op)}.c-ok{background:var(--n-ok)}.c-ko{background:var(--n-ko)}.c-care{background:var(--n-care)}
.editing .node{cursor:move}
.editing #viewport,#viewport.editing{cursor:default}
#viewport.editing.space,#viewport.space{cursor:grab}
.node.drop{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
#edges .hit{stroke:transparent;stroke-width:16;fill:none}
.editing #edges .hit{pointer-events:stroke;cursor:pointer}
#edges g.on .ln{stroke:var(--accent);stroke-width:3}
#edges marker.on path{fill:var(--accent)}
#edges .tmp{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 5}
#selLayer{position:absolute;left:0;top:0}
.selbox{position:absolute;border:calc(1.5px*var(--inv,1)) dashed var(--accent);border-radius:calc(8px*var(--inv,1));pointer-events:none}
.h-resize{position:absolute;width:calc(16px*var(--inv,1));height:calc(16px*var(--inv,1));transform:translate(-50%,-50%);background:var(--surface);border:calc(2.5px*var(--inv,1)) solid var(--accent);border-radius:calc(4px*var(--inv,1));cursor:nwse-resize;touch-action:none}
.h-conn{position:absolute;width:calc(24px*var(--inv,1));height:calc(24px*var(--inv,1));transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:crosshair;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none}
.h-conn svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.h-conn:hover{transform:translate(-50%,-50%) scale(1.15)}
.marq{position:absolute;border:calc(1.5px*var(--inv,1)) solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none}
.editbar .sep{width:1px;align-self:stretch;background:var(--line)}
.editbar .ctx{font-size:14px;flex:0 1 auto;min-width:0}
.seg.tools{flex:none}
.seg.tools button{display:flex;align-items:center;gap:6px}
.auto-on{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);padding:0 6px;white-space:nowrap}
.mini-sw{display:flex;gap:5px;flex-wrap:wrap}
.mini-sw .swatch{width:26px;height:26px;border-radius:8px}

/* Floating controls */
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:3}
.zoom button{border:none;background:none;width:40px;height:40px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--surface-2)}
.legend-btn{position:absolute;left:16px;bottom:16px;z-index:3}
.legend{position:absolute;left:16px;bottom:64px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:7px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:9px}
.sw{width:16px;height:12px;border-radius:4px;flex:none}
.ask{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:9px;
  background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:12px 20px 12px 16px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.ask:hover{transform:translateX(-50%) translateY(-1px)}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  box-shadow:var(--shadow);padding:7px 8px 7px 16px;font-size:13.5px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.hint button{border:none;background:var(--surface-2);border-radius:999px;width:26px;height:26px;display:grid;place-items:center;flex:none}
.hint button svg{width:14px;height:14px}
.editbar{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
.editbar input{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;font-weight:700;min-width:0;flex:1 1 180px;max-width:320px}
.editbar .tip{font-size:13px;color:var(--muted);flex:1 1 220px}
.linkbar{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.linkbar .tip{color:var(--accent-fg);font-weight:600}
.empty-flow{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);pointer-events:none}

/* Side sheet */
.sheet{position:absolute;top:12px;right:12px;bottom:12px;width:min(390px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sheet-h h2{font:700 21px/1.2 var(--f-display);margin:6px 36px 0 0;text-wrap:balance}
.sheet-h ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.x{position:absolute;top:12px;right:12px;border:none;background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.sheet-b{padding:14px 18px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sec-t{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.docs{display:flex;flex-direction:column;gap:8px}
.doc-row{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px}
.doc-row:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.doc-ic{width:34px;height:40px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.doc-row b{display:block;font-weight:700;line-height:1.3}
.doc-row small{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:1px 6px;background:var(--accent-soft);color:var(--fg);margin-right:4px}
.tag.ex{background:var(--n-fase);color:var(--n-fg)}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;color:var(--fg);font-weight:500;font-size:15px;width:100%}
.field textarea{resize:vertical;min-height:90px;line-height:1.45}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.swatch.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.conn{display:flex;flex-direction:column;gap:6px}
.conn div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 6px 6px 10px;font-size:13.5px}
.conn div span{flex:1;min-width:0}
.conn button{border:none;background:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.conn button:hover{background:var(--danger-soft);color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:none;background:none;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(8,16,15,.42);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal.wide{width:min(900px,100%)}
.modal-h{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-h h2{font:700 21px/1.2 var(--f-display);margin:0 40px 0 0}
.modal-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.modal-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Profiles */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.profile{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px}
.profile:hover,.profile.on{border-color:var(--accent)}
.profile b{display:block}
.profile small{color:var(--muted);display:block;line-height:1.3}
.av.lg{width:40px;height:40px;font-size:14px}

/* Users admin */
.users{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:0}
.u-list{display:flex;flex-direction:column;gap:6px}
.u-row{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:11px;padding:8px}
.u-row:hover{background:var(--surface-2)}
.u-row.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.u-row b{display:block;font-size:14px}
.u-row small{color:var(--muted);font-size:12.5px;display:block;line-height:1.25}
.u-edit{display:flex;flex-direction:column;gap:14px;min-width:0}
.acc{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.acc h4{margin:0;font:700 16px/1.2 var(--f-display)}
.nodes-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px;max-height:260px;overflow:auto;padding:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--fg);padding:3px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent);flex:none;margin:0}
.linkish{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 4px}

/* Reader */
.reader{width:min(760px,100%);height:100%}
.reader .modal-h{background:var(--surface)}
.doc-wrap{position:relative;overflow:auto;flex:1}
.doc-body{padding:24px 28px 40px;max-width:68ch;margin:0 auto;font-size:16px;line-height:1.65;position:relative;z-index:1}
.doc-body h3{font:700 18px/1.3 var(--f-display);margin:22px 0 6px}
.doc-body h3:first-child{margin-top:0}
.doc-body p{margin:0 0 10px}
.doc-body ul,.doc-body ol{margin:0 0 12px;padding-left:22px}
.doc-body li{margin:3px 0}
.doc-body blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.wm{position:absolute;inset:0;z-index:2;pointer-events:none;background-repeat:repeat}
.protected .doc-body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.shield .doc-body{filter:blur(9px)}
.readonly{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:10px 20px;border-top:1px solid var(--line)}
.readonly svg{width:15px;height:15px}
.example{margin:14px 28px 0;font-size:13.5px;background:var(--n-fase);color:var(--n-fg);border-radius:10px;padding:8px 12px;font-weight:600}

/* Chat */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:15;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-h{padding:14px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.chat-h h2{font:700 20px/1.2 var(--f-display);margin:0}
.chat-h p{margin:2px 40px 0 0;color:var(--muted);font-size:13.5px}
.src{border-bottom:1px solid var(--line)}
.src summary{list-style:none;padding:10px 18px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px}
.src summary::-webkit-details-marker{display:none}
.src summary .chev{margin-left:auto;transition:transform .2s}
.src[open] summary .chev{transform:rotate(180deg)}
.src-list{padding:0 18px 12px;max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.src-list .grp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:8px 0 2px}
.log{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;line-height:1.55;font-size:15px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);padding:9px 14px;border-radius:16px 16px 4px 16px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);padding:11px 14px;border-radius:16px 16px 16px 4px}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:4px 0 8px;padding-left:20px}
.msg.bot h3{font:700 15.5px/1.3 var(--f-body);margin:8px 0 4px}
.msg.bot blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface)}
.cite{border:none;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:6px;padding:0 5px;vertical-align:1px;margin:0 1px;font-variant-numeric:tabular-nums}
.msg .err{color:var(--danger);font-size:13.5px;margin-top:6px}
.msg .mnote{color:var(--muted);font-size:13px;margin-top:6px}
.thinking{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:14px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.sugg button:hover{border-color:var(--accent)}
.compose{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;resize:none;max-height:140px;font-size:15px;line-height:1.4}
.send{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}

/* Ricerca */
.search .modal-h{padding-bottom:14px}
.sbox{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);background:var(--surface-2);border-radius:12px;padding:0 12px;margin-top:12px}
.sbox input{flex:1;min-width:0;border:none;background:none;padding:11px 0;font-size:16px;outline:none}
.sbox svg{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px;text-align:left;width:100%}
.res:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.res-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.res b{font-weight:700;line-height:1.3}
.res .where{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.res .snip{font-size:14px;line-height:1.45;color:var(--fg)}
.res-foot{display:flex;gap:6px;flex-wrap:wrap}
.res-foot .linkish{padding:2px 0;margin-right:12px}
mark{background:color-mix(in srgb,var(--n-fase) 75%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.phase-hit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;text-align:left;font-size:14px}
.phase-hit:hover{border-color:var(--accent)}
.phase-hit .sw{width:14px;height:11px}
.phase-hits{display:flex;flex-wrap:wrap;gap:6px}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-fg)}
.doc-body.pdf{max-width:none;padding:16px}
.pdf-page{display:block;margin:0 auto 14px;max-width:900px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (max-width:720px){
  .top{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .tabs{order:3;flex-basis:100%}
  .btn .lbl{display:none}
  .btn{padding:7px 9px}
  .who .txt{display:none}
  .who{padding:3px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:72%;border-radius:18px 18px 0 0;border-bottom:none;padding-bottom:env(safe-area-inset-bottom,0px)}
  .users{grid-template-columns:1fr}
  .u-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .u-row{flex:none}
  .scrim{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94%}
  .reader{height:94%}
  .doc-body{padding:18px 18px 32px}
  .example{margin:12px 18px 0}
  .zoom{bottom:84px}
  .legend-btn{bottom:84px}
  .legend{bottom:132px}
  .editbar .tip{display:none}
  .seg.tools span{display:none}
  .editbar .sep{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" class="i"><rect x="3" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="10" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><path d="M6.5 8v8M10 5.5h3.5a2 2 0 0 1 2 2V10"/></svg></div>
      <h1>Mappa dei protocolli</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Flussi"></nav>
    <div class="actions" id="actions"></div>
  </header>
  <main id="stage">
    <div id="viewport"><div id="world"><svg id="edges"></svg><div id="nodes"></div><div id="selLayer"></div></div></div>
    <div id="overlay"></div>
    <button class="btn legend-btn" id="legendBtn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="4" rx="1"/><rect x="3" y="10" width="6" height="4" rx="1"/><rect x="3" y="16" width="6" height="4" rx="1"/><path d="M13 6h8M13 12h8M13 18h8"/></svg><span class="lbl">Legenda</span></button>
    <div class="zoom">
      <button id="zin" aria-label="Ingrandisci"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zout" aria-label="Riduci"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zfit" aria-label="Mostra tutto il flusso"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <button class="ask" id="askBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.5L12 15l-1.8-4.5L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Chiedi ai protocolli</button>
  </main>
</div>
<div id="layers"></div>

<script>
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { try { return new Date(d + 'T12:00').toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}); } catch(e) { return d; } };
const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const I = {
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  doc:'<svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  users:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  link:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg>',
  send:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>',
  stop:'<svg class="i" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>',
  chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  marquee:'<svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M12 4h0M16 4h3a1 1 0 0 1 1 1v3M20 12h0M20 16v3a1 1 0 0 1-1 1h-3M12 20h0M8 20H5a1 1 0 0 1-1-1v-3M4 12h0" stroke-dasharray="0"/></svg>',
  hand:'<svg class="i" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6.5 7S5 17.5 4 15l-1-2.5a1.5 1.5 0 0 1 2.7-1.2L8 14"/></svg>',
  undo:'<svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  minus:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  swap:'<svg class="i" viewBox="0 0 24 24"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg>',
  wand:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20L15 9M13 7l4 4"/><path d="M18 3v3M16.5 4.5h3M20 9v2M19 10h2M9 3v2M8 4h2"/></svg>',
  shield:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z"/></svg>',
};
const COLORS = {
  mkt:  'Acquisizione e marketing',
  fase: 'Fasi e campagne',
  op:   'Attività operativa',
  ok:   'Esito positivo',
  ko:   'Esito negativo',
  care: 'Customer care',
};
const DOC_TYPES = ['Protocollo', 'Procedura', 'Script', 'Checklist', 'Modulo'];

/* ---------- stato (dal server) ---------- */
const MODE = location.pathname.startsWith('/admin') ? 'admin' : 'view';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} },
};
let S = {flows: [], docs: [], users: []};
let me = null, aiReady = false;
let curFlowId = store.get('mp-flow');
let editMode = false, linkFrom = null, sheetNode = null, legendOpen = false;
const view = {x: 0, y: 0, s: 1};

const flow = () => S.flows.find(f => f.id === curFlowId);
const getNode = (id, f = flow()) => f?.nodes.find(n => n.id === id);
const isAdmin = () => me?.role === 'admin' && MODE === 'admin';
function access(u, fid){ if (u.role === 'admin') return {mode:'all'}; return u.access?.[fid] || {mode:'none'}; }
function canOpen(u, fid, nid){ if (u.role === 'admin') return true; const n = getNode(nid, S.flows.find(f => f.id === fid)); return !!n && !n.locked; }
function visibleFlows(){ return S.flows; }
function docsFor(fid, nid){ return S.docs.filter(d => d.flowId === fid && d.nodeId === nid).sort((a, b) => a.title.localeCompare(b.title)); }
function accessibleDocs(){ return S.docs.filter(d => { const f = S.flows.find(x => x.id === d.flowId); return f && f.nodes.some(n => n.id === d.nodeId) && canOpen(me, d.flowId, d.nodeId); }); }

async function api(method, url, body){
  const opt = {method, headers: {}, credentials: 'same-origin'};
  if (body instanceof FormData) opt.body = body;
  else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); opt.keepalive = method === 'PUT' && opt.body.length < 60000; }
  let r;
  try { r = await fetch(url, opt); } catch (e) { throw new Error('Connessione assente. Controlla internet e riprova.'); }
  if (r.status === 401) { location.href = '/login' + (MODE === 'admin' ? '?next=/admin' : ''); throw new Error('Accesso richiesto'); }
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(j.error || 'Qualcosa non ha funzionato. Riprova.');
  return j;
}
async function loadState(){
  const j = await api('GET', '/api/state');
  me = j.me; aiReady = j.ai; S.sso = j.sso || null; S.flows = j.flows; S.docs = j.docs; S.users = j.users || []; S.figure = j.figure || [];
  markSynced();
}
// salvataggio dei flussi sul server (solo area admin)
const synced = {};
const flowJSON = f => JSON.stringify({name: f.name, nodes: f.nodes.map(({locked, ...n}) => n), edges: f.edges, manual: !!f.manual});
function markSynced(){ S.flows.forEach(f => synced[f.id] = flowJSON(f)); }
let saveT, saving = false;
function save(){ if (!isAdmin()) return; clearTimeout(saveT); saveT = setTimeout(syncFlows, 500); }
async function syncFlows(){
  if (saving) { save(); return; }
  saving = true; clearTimeout(saveT); saveT = null;
  try {
    for (const f of S.flows) {
      const j = flowJSON(f); if (synced[f.id] === j) continue;
      try { await api('PUT', '/api/flows/' + f.id, JSON.parse(j)); synced[f.id] = j; }
      catch (e) { toast('Modifica non salvata: ' + e.message); }
    }
  } finally { saving = false; }
}
const unsaved = () => isAdmin() && S.flows.some(f => synced[f.id] !== flowJSON(f));
window.addEventListener('beforeunload', e => { if (unsaved()) { syncFlows(); e.preventDefault(); e.returnValue = ''; } });

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- header ---------- */
function renderHeader(){
  const flows = visibleFlows();
  $('#tabs').innerHTML = flows.map(f => `<button class="tab ${f.id === curFlowId ? 'on' : ''}" data-flow="${f.id}">${esc(f.name)}</button>`).join('')
    + (isAdmin() ? `<button class="tab add" id="newFlow">${I.plus}Nuovo flusso</button>` : '');
  $('#actions').innerHTML = `<button class="btn" id="searchBtn" title="Cerca nei protocolli (Ctrl+K)">${I.search}<span class="lbl">Cerca</span></button>` + (isAdmin() ? `
      <button class="btn ${editMode ? 'on' : ''}" id="editBtn" title="Modifica il flusso">${I.edit}<span class="lbl">${editMode ? 'Fine modifica' : 'Modifica flusso'}</span></button>
      <button class="btn" id="usersBtn" title="Collaboratori e permessi">${I.users}<span class="lbl">Collaboratori</span></button>`
      : me.role === 'admin' ? `<a class="btn" href="/admin" title="Apri l'area amministratore">${I.edit}<span class="lbl">Area admin</span></a>` : '')
    + `<button class="who" id="whoBtn" title="Il tuo account"><span class="av ${me.role === 'admin' ? 'admin' : ''}">${esc(initials(me.name || me.username))}</span><span class="txt"><b>${esc(me.name || me.username)}</b><span>${isAdmin() ? 'Area admin' : me.role === 'admin' ? 'Amministratore' : esc(me.title)}</span></span></button>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-flow]'); if (t) { switchFlow(t.dataset.flow); return; }
  if (e.target.closest('#newFlow')) openNewFlow();
  if (e.target.closest('#editBtn')) setEdit(!editMode);
  if (e.target.closest('#usersBtn')) openUsers();
  if (e.target.closest('#searchBtn')) openSearch();
  if (e.target.closest('#whoBtn')) openAccount();
});

/* ---------- selezione, annulla ---------- */
let sel = new Set(), selEdge = null, spaceDown = false;
let tool = matchMedia('(pointer: fine)').matches ? 'select' : 'hand';
const undoStack = [];
function pushUndo(){ undoStack.push(JSON.stringify(S.flows)); if (undoStack.length > 60) undoStack.shift(); const u = $('#undoBtn'); if (u) u.disabled = false; }
function undo(){
  const snap = undoStack.pop(); if (!snap) { toast('Non c\'è nulla da annullare'); return; }
  const prev = JSON.parse(snap), ids = new Set(S.flows.map(f => f.id));
  S.flows = prev.filter(f => ids.has(f.id)); save();
  S.docs.forEach(d => { const fl = S.flows.find(x => x.id === d.flowId); d.orphan = !fl?.nodes.some(n => n.id === d.nodeId); });
  if (!flow()) curFlowId = visibleFlows()[0]?.id || null;
  sel = new Set([...sel].filter(id => getNode(id))); selEdge = null;
  renderHeader(); renderFlow(); renderOverlay(); refreshSheet(); toast('Modifica annullata');
}
function refreshSheet(){ if (sheetNode && getNode(sheetNode)) openSheet(sheetNode); else closeSheet(); }

function switchFlow(id, keepView){
  curFlowId = id; if (id) store.set('mp-flow', id); sel.clear(); selEdge = null; linkFrom = null; sheetNode = null;
  renderHeader(); renderFlow(); renderOverlay(); closeSheet();
  const f = flow();
  if (f && !f.manual) (document.fonts?.ready || Promise.resolve()).then(() => { if (flow() === f) autoLayout(keepView ? 'change' : 'open'); });
  else if (!keepView) requestAnimationFrame(() => fitView(true));
}
function setEdit(on){
  editMode = on; sel.clear(); selEdge = null; linkFrom = null;
  $('#viewport').classList.toggle('editing', on);
  if (!on) syncFlows();
  closeSheet(); renderHeader(); renderFlow(); renderOverlay();
}

/* ---------- canvas ---------- */
const vp = $('#viewport'), world = $('#world'), nodesEl = $('#nodes'), edgesEl = $('#edges'), selLayer = $('#selLayer');
function nodeVisible(n){ const a = access(me, curFlowId); return !(a.mode === 'some' && a.hide && !canOpen(me, curFlowId, n.id)); }
function renderFlow(){
  const f = flow();
  if (!f) { nodesEl.innerHTML = ''; edgesEl.innerHTML = ''; selLayer.innerHTML = ''; return; }
  nodesEl.innerHTML = f.nodes.filter(nodeVisible).map(n => {
    const open = canOpen(me, f.id, n.id); const cnt = docsFor(f.id, n.id).length;
    const cls = ['node', 'c-' + n.c, (!open && !editMode) ? 'locked' : '', sel.has(n.id) ? 'sel' : '', linkFrom === n.id ? 'linking' : ''].join(' ');
    const badge = (!open && !editMode) ? `<span class="badge">${I.lock}</span>` : cnt ? `<span class="badge" title="${cnt} documenti">${I.doc}${cnt}</span>` : '';
    return `<button class="${cls}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;--z:${n.z || 1}" aria-label="${esc(n.label)}${open ? '' : ' (non accessibile)'}">
      <span class="nl">${esc(n.label)}</span>${n.sub.length ? `<ul>${n.sub.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}${badge}</button>`;
  }).join('');
  drawEdges(); drawSel();
}
function placeNodes(ids){
  ids.forEach(id => { const n = getNode(id), el = nodesEl.querySelector(`[data-id="${id}"]`); if (n && el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.setProperty('--z', n.z || 1); } });
}
function nodeBox(id){ const n = getNode(id), el = nodesEl.querySelector(`[data-id="${id}"]`); return (n && el) ? {x: n.x, y: n.y, w: el.offsetWidth, h: el.offsetHeight} : null; }
function drawEdges(){
  const f = flow(); if (!f) return;
  const els = {}; nodesEl.querySelectorAll('.node').forEach(el => els[el.dataset.id] = el);

  const dfs = u => { st[u] = 1; for (const e of out[u]) { if (st[e.b] === 1) back.add(e.i); else if (!st[e.b]) dfs(e.b); } st[u] = 2; };

  const fwd = edges.filter(e => !back.has(e.i));
  // 2. livelli (percorso più lungo)
  const indeg = {}, fo = {}, layer = {}; ids.forEach(id => { indeg[id] = 0; fo[id] = []; });
  fwd.forEach(e => { indeg[e.b]++; fo[e.a].push(e); });
  const q = order.filter(id => !indeg[id]); q.forEach(id => layer[id] = 0);
  for (let k = 0; k < q.length; k++) { const u = q[k]; for (const e of fo[u]) { layer[e.b] = Math.max(layer[e.b] ?? 0, layer[u] + 1); if (--indeg[e.b] === 0) q.push(e.b); } }
  const fin = new Set(fwd.map(e => e.b));
  ids.forEach(id => { if (!fin.has(id) && fo[id].length) layer[id] = Math.min(...fo[id].map(e => layer[e.b])) - 1; });
  const L = Math.max(...ids.map(id => layer[id])) + 1;
  // 3. nodi fittizi per le frecce lunghe
  const V = {}; ids.forEach(id => V[id] = {id, layer: layer[id], w: W, ups: [], downs: [], src: id});
  const chain = {};
  fwd.forEach(e => {
    let prev = e.a; chain[e.i] = [];
    for (let l = layer[e.a] + 1; l < layer[e.b]; l++) { const d = `~${e.i}_${l}`; V[d] = {id: d, layer: l, w: DW, ups: [prev], downs: [], src: e.a, dummy: true}; V[prev].downs.push(d); chain[e.i].push(d); prev = d; }
    V[prev].downs.push(e.b); V[e.b].ups.push(prev);
  });
  const layers = Array.from({length: L}, () => []);
  Object.values(V).forEach(v => layers[v.layer].push(v.id));
  const ox = id => getNode(V[id].src).x;
  layers.forEach(Ly => Ly.sort((p, r) => ox(p) - ox(r)));
  // 4. ordine nei livelli (baricentro) — tiene l'ordine con meno incroci
  const pos = {}; const idxs = () => layers.forEach(Ly => Ly.forEach((id, i) => pos[id] = i)); idxs();
  const crossings = () => { let c = 0; for (let l = 0; l < L - 1; l++) { const segs = []; layers[l].forEach(id => V[id].downs.forEach(d => segs.push([pos[id], pos[d]]))); for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) if ((segs[i][0] - segs[j][0]) * (segs[i][1] - segs[j][1]) < 0) c++; } return c; };
  let best = layers.map(Ly => [...Ly]), bestC = crossings();
  for (let it = 0; it < 24; it++) {
    const down = it % 2 === 0, seq = down ? layers.slice(1) : layers.slice(0, -1).reverse();
    seq.forEach(Ly => {
      const bc = {}; Ly.forEach(id => { const nb = down ? V[id].ups : V[id].downs; bc[id] = nb.length ? nb.reduce((s, x) => s + pos[x], 0) / nb.length : pos[id]; });
      Ly.sort((p, r) => bc[p] - bc[r]); Ly.forEach((id, i) => pos[id] = i);
    });
    const c = crossings(); if (c < bestC) { bestC = c; best = layers.map(Ly => [...Ly]); }
  }
  best.forEach((Ly, l) => layers[l] = Ly); idxs();
  // 5. posizioni orizzontali (minimi quadrati con distanza minima)
  const X = {};
  layers.forEach(Ly => { let x = 0; Ly.forEach((id, i) => { if (i) x += (V[Ly[i - 1]].w + V[id].w) / 2 + GAPX; X[id] = x; }); });
  const place = (Ly, des) => {
    const blocks = [];
    Ly.forEach(id => {
      blocks.push({items: [id], rel: {[id]: 0}, sum: des[id], n: 1, pos: des[id]});
      while (blocks.length > 1) {
        const B = blocks[blocks.length - 1], A = blocks[blocks.length - 2];
        const lastA = A.items[A.items.length - 1], gap = (V[lastA].w + V[B.items[0]].w) / 2 + GAPX;
        if (A.pos + A.rel[lastA] + gap <= B.pos) break;
        const off = A.rel[lastA] + gap;
        B.items.forEach(it => { A.rel[it] = B.rel[it] + off; A.items.push(it); });
        A.sum += B.sum - off * B.n; A.n += B.n; A.pos = A.sum / A.n; blocks.pop();
      }
    });
    blocks.forEach(b => b.items.forEach(it => X[it] = b.pos + b.rel[it]));
  };
  for (let it = 0; it < 30; it++) {
    const mode = it < 24 ? (it % 2 ? 'up' : 'down') : 'both';
    const seq = mode === 'up' ? layers.slice(0, -1).reverse() : mode === 'down' ? layers.slice(1) : layers;
    seq.forEach(Ly => {
      const des = {};
      Ly.forEach(id => { const v = V[id]; let nb = mode === 'down' ? v.ups : mode === 'up' ? v.downs : [...v.ups, ...v.downs]; if (!nb.length) nb = [...v.ups, ...v.downs]; des[id] = nb.length ? nb.reduce((s, x) => s + X[x], 0) / nb.length : X[id]; });
      place(Ly, des);
    });
  }
  // 6. posizioni verticali: fasi dello stesso livello allineate in alto
  const top = [], bot = []; let y = 0;
  for (let l = 0; l < L; l++) { const hh = Math.max(24, ...layers[l].filter(id => !V[id].dummy).map(id => H[id])); top[l] = y; bot[l] = y + hh; y += hh + GAPY; }
  const minX = Math.min(...Object.values(X));
  ids.forEach(id => { const n = getNode(id); n.x = Math.round(X[id] - minX); n.y = Math.round(top[layer[id]] + H[id] / 2); });
  // 7. percorsi delle frecce
  const srcSlots = {};
  for (let l = 0; l < L; l++) { const srcs = layers[l].filter(id => V[id].downs.length); srcs.forEach((id, k) => srcSlots[id] = (k + 1) / (srcs.length + 1)); }
  const trunkY = (fromId, l) => Math.round(bot[l] + 14 + (GAPY - 28) * (srcSlots[fromId] ?? .5));
  edges.forEach(e => {
    const E = f.edges[e.i];
    if (back.has(e.i)) return;
    const la = layer[e.a], lb = layer[e.b];
    if (lb === la + 1) { E[2] = {k: 'v', y: trunkY(e.a, la)}; return; }
    const ch = chain[e.i]; const lx = Math.round(ch.reduce((s, d) => s + X[d], 0) / ch.length - minX);
    E[2] = {k: 'r', x: lx, y1: trunkY(e.a, la), y2: Math.round(top[lb] - 16)};
  });
  // frecce all'indietro: corsia libera a destra delle fasi coinvolte
  let bi = 0;
  [...back].forEach(i => {
    const E = f.edges[i], a = getNode(E[0]), b = getNode(E[1]);
    const la = layer[E[0]], lb = layer[E[1]], lo = Math.min(la, lb), hi = Math.max(la, lb);
    let right = -Infinity; ids.forEach(id => { if (layer[id] >= lo && layer[id] <= hi) right = Math.max(right, getNode(id).x + W / 2); });
    E[2] = {k: 'r', x: Math.round(right + 34 + (bi++ % 4) * 16), y1: Math.round(bot[la] + 10), y2: Math.round(top[lb] - 10)};
  });
  save(); renderFlow(); if (mode !== 'open') refreshSheet(); renderOverlay();
  if (mode === 'open') fitView(true);
  if (mode === 'button') { requestAnimationFrame(() => fitView(false)); toast('Flusso riordinato: da ora si riordina da solo a ogni modifica'); }
}

    const toolSeg = `<div class="seg tools" role="group" aria-label="Strumento"><button data-tool="select" class="${tool === 'select' ? 'on' : ''}" title="Trascina sul vuoto per selezionare più fasi">${I.marquee}<span>Seleziona</span></button><button data-tool="hand" class="${tool === 'hand' ? 'on' : ''}" title="Trascina per muovere la vista">${I.hand}<span>Muovi</span></button></div>`;

        <span class="mini-sw">${Object.entries(COLORS).map(([k, v]) => `<button class="swatch c-${k}" data-gcolor="${k}" title="${v}" aria-label="Colore: ${v}"></button>`).join('')}</span>
        <button class="btn danger" id="delSel">${I.trash}<span class="lbl">Elimina</span></button>`;
    } else if (sel.size === 1) {
      ctx = `<span class="tip">Trascina un pallino blu verso un'altra fase per collegarla, o nel vuoto per creare una fase nuova. L'angolo in basso a destra ingrandisce o riduce.</span>`;
    } else {
      ctx = `<input id="flowName" aria-label="Nome del flusso" value="${esc(f.name)}"><span class="tip">Trascina sul vuoto per selezionare più fasi · Maiusc+clic per aggiungerne · Spazio+trascina per muovere la vista</span>

function renderLegend(){

function addNode(){

  const n = {id: uid('n'), label: 'Nuova fase', sub: [], c: 'op', x: Math.round((r.width / 2 - view.x) / view.s), y: Math.round((r.height / 2 - view.y) / view.s)};

document.addEventListener('click', e => {
  const s = e.target.closest('#sheet'); if (!s) return;

  if (e.target.closest('[data-close]')) { if (editMode) clearSelection(); else closeSheet(); return; }
  const d = e.target.closest('[data-doc]'); if (d) return openReader(d.dataset.doc);
  if (e.target.closest('[data-newdoc]')) return openDocEditor(null, sheetNode);
  if (e.target.closest('[data-askphase]')) { openChat(); setTimeout(() => sendChat(`Riassumi i protocolli della fase “${n.label}”: cosa devo fare, in che ordine e a cosa fare attenzione?`), 50); return; }
  const c = e.target.closest('[data-color]'); if (c) { pushUndo(); n.c = c.dataset.color; save(); renderFlow(); openSheet(n.id); return; }
  const sz = e.target.closest('[data-size]');
  if (sz) { pushUndo(); setManual(); n.z = sz.dataset.size === 'reset' ? 1 : +clamp((n.z || 1) * +sz.dataset.size, 0.45, 3).toFixed(3); save(); renderFlow(); openSheet(n.id); return; }
  const ul = e.target.closest('[data-unlink]'); if (ul) { pushUndo(); const [a, b] = ul.dataset.unlink.split('|'); f.edges = f.edges.filter(x => !(x[0] === a && x[1] === b)); save(); renderFlow(); relayout(); openSheet(n.id); return; }
  if (e.target.closest('[data-link]')) { linkFrom = n.id; renderFlow(); renderOverlay(); if (innerWidth < 720) $('#sheet')?.remove(); return; }

});

/* ---------- lettore documento ---------- */
function mdLite(src, cite){
  const inline = s => { s = esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); if (cite) s = s.replace(/\[(\d+(?:\s*[,;]\s*\d+)*)\]/g, (m, g) => cite(g.split(/[,;]/).map(x => +x.trim()))); return s; };
  let html = '', list = null, para = [];
  const fp = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const fl = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of String(src).split('\n')) {
    const l = raw.trim(); let m;
    if (!l) { fp(); fl(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { fp(); fl(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { fp(); if (list !== 'ul') { fl(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { fp(); if (list !== 'ol') { fl(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { fp(); fl(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    fl(); para.push(l);
  }
  fp(); fl(); return html;
}
function watermarkCss(){
  const c = getComputedStyle(document.documentElement).getPropertyValue('--wm').trim() || 'rgba(0,0,0,.08)';
  const t = `${me.name || me.username} · ${new Date().toLocaleDateString('it-IT')} · Riservato`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='210'><text x='180' y='110' text-anchor='middle' transform='rotate(-24 180 105)' font-family='Figtree, sans-serif' font-weight='700' font-size='15' fill='${c}'>${esc(t)}</text></svg>`;
  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
}
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; ko(new Error('Lettore PDF non disponibile')); };
    document.head.append(s);
  });
  return pdfjsReady;
}
async function renderPdf(docId, host){
  host.innerHTML = '<p class="muted">Apro il documento…</p>';
  try {
    const [lib, buf] = await Promise.all([loadPdfJs(), fetch(`/api/docs/${docId}/file`, {credentials: 'same-origin'}).then(r => { if (!r.ok) throw new Error('Documento non disponibile'); return r.arrayBuffer(); })]);
    const pdf = await lib.getDocument({data: buf}).promise;
    host.innerHTML = '';
    const width = Math.min(host.clientWidth || 700, 900), ratio = Math.min(devicePixelRatio || 1, 2);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({scale: 1}), scale = width / v1.width, vpt = page.getViewport({scale: scale * ratio});
      const c = document.createElement('canvas'); c.width = vpt.width; c.height = vpt.height; c.style.width = '100%'; c.className = 'pdf-page';
      host.append(c);
      await page.render({canvasContext: c.getContext('2d'), viewport: vpt}).promise;
      if (!host.isConnected) return;
    }
  } catch (e) { host.innerHTML = `<p class="note">${esc(e.message)}</p>`; }
}

  if (d.hasFile) renderPdf(d.id, l.querySelector('.doc-body'));
  else if (terms?.length) { const first = highlightIn(l.querySelector('.doc-body'), terms); if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 60); }
  if (prot) ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => wrap.addEventListener(ev, e => { e.preventDefault(); if (ev === 'copy') toast('La copia dei documenti è disattivata.'); }));
  l.addEventListener('click', async e => {
    if (e.target.closest('[data-edoc]')) { closeLayer(l); openDocEditor(d.id); }
    const del = e.target.closest('[data-ddoc]');
    if (del) {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.innerHTML = `${I.trash}Conferma eliminazione`; return; }
      try { await api('DELETE', '/api/docs/' + d.id); S.docs = S.docs.filter(x => x.id !== d.id); closeLayer(l); renderFlow(); if (sheetNode) openSheet(sheetNode); toast('Documento eliminato'); }
      catch (err) { toast(err.message); }
    }
  });
}
document.addEventListener('visibilitychange', () => document.querySelectorAll('.doc-wrap.protected').forEach(w => w.classList.toggle('shield', document.hidden)));

/* ---------- editor documento (solo admin) ---------- */

        ${d?.hasFile ? `<label class="chk"><input type="checkbox" id="df-rmfile">Rimuovi il PDF e usa solo il testo</label>` : ''}</div>
        <small class="muted" style="font-weight:500">PDF: si vede com'è, con filigrana; il testo viene estratto per ricerca e assistente. Word: viene convertito in testo modificabile.</small></div>
      <label class="field">Testo${d?.hasFile ? ' estratto dal PDF (usato da ricerca e assistente)' : ''}<textarea id="df-body" rows="10" placeholder="## Titolo di sezione&#10;Testo normale&#10;- punto elenco&#10;1. passaggio numerato&#10;> nota importante">${esc(d?.body || '')}</textarea></label>
      <small class="muted">Formattazione: <b>##</b> titolo · <b>-</b> elenco · <b>1.</b> passaggi · <b>&gt;</b> nota · <b>**grassetto**</b></small>

    <div class="modal-f"><button class="btn" data-x>Annulla</button><button class="btn primary" id="df-save">Salva documento</button></div>`);
  setTimeout(() => $('#df-title').focus(), 30);

  l.querySelector('#df-file').addEventListener('change', e => {
    file = e.target.files[0] || null; if (!file) return;

    else if (/\.docx$/i.test(file.name)) { $('#df-body').value = ''; $('#df-body').placeholder = 'Il testo del Word verrà convertito al salvataggio.'; }
    else if (/\.pdf$/i.test(file.name)) { $('#df-body').value = ''; $('#df-body').placeholder = 'Il testo del PDF verrà estratto al salvataggio.'; }

    try {
      await api(d ? 'PUT' : 'POST', d ? '/api/docs/' + d.id : '/api/docs', fd);

}

/* ---------- ricerca ---------- */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const plain = s => String(s || '').replace(/^#+\s*/gm, '').replace(/^\s*[-*•>]\s*/gm, '').replace(/^\s*\d+[.)]\s*/gm, '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
// radice semplice: "richiamo" trova anche "richiami", "obiezione" anche "obiezioni"
const termsOf = q => [...new Set(norm(q).split(/[^a-z0-9]+/).filter(t => t.length > 1).map(t => t.length > 4 ? t.replace(/[aeio]$/, '') : t))];
function markText(text, terms){
  // evidenzia i termini ignorando accenti e maiuscole; la stringa normalizzata ha la stessa lunghezza per le lettere italiane
  const n = norm(text); if (n.length !== text.length) return esc(text);
  const hits = [];
  terms.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) !== -1) { hits.push([i, i + t.length]); i += t.length; } });
  if (!hits.length) return esc(text);
  hits.sort((a, b) => a[0] - b[0]); const merged = [];
  hits.forEach(h => { const l = merged[merged.length - 1]; if (l && h[0] <= l[1]) l[1] = Math.max(l[1], h[1]); else merged.push([...h]); });
  let out = '', p = 0; merged.forEach(([a, b]) => { out += esc(text.slice(p, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; p = b; });
  return out + esc(text.slice(p));
}
function highlightIn(root, terms){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t => { const h = markText(t.nodeValue, terms); if (h.includes('<mark>')) { const s = document.createElement('span'); s.innerHTML = h; t.replaceWith(s); } });
  return root.querySelector('mark');
}
function snippet(body, terms){
  const t = plain(body), n = norm(t); let at = -1;
  for (const x of terms) { const i = n.indexOf(x); if (i !== -1 && (at === -1 || i < at)) at = i; }
  if (at === -1) return esc(t.slice(0, 150)) + (t.length > 150 ? '…' : '');
  const a = Math.max(0, at - 60), b = Math.min(t.length, at + 110);
  return (a ? '…' : '') + markText(t.slice(a, b), terms) + (b < t.length ? '…' : '');
}
function searchAll(q, type){
  const terms = termsOf(q); if (!terms.length) return {terms, docs: [], phases: []};
  const docs = (isAdmin() ? S.docs : accessibleDocs()).filter(d => type === 'Tutti' || d.type === type).map(d => {
    const f = S.flows.find(x => x.id === d.flowId), n = getNode(d.nodeId, f);
    const title = norm(d.title), body = norm(plain(d.body)), phase = norm(n?.label + ' ' + (n?.sub || []).join(' '));
    let score = 0;
    for (const t of terms) {
      const inT = title.includes(t), inB = body.includes(t), inP = phase.includes(t);
      if (!inT && !inB && !inP) return null;
      score += (inT ? 6 : 0) + (inP ? 3 : 0) + (inB ? 1 + Math.min(4, body.split(t).length - 1) * .5 : 0);
    }
    return {d, f, n, score};
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  const phases = [];
  if (type === 'Tutti') visibleFlows().forEach(f => f.nodes.forEach(n => {
    if (!canOpen(me, f.id, n.id)) return;
    const hay = norm(n.label + ' ' + n.sub.join(' '));
    if (terms.every(t => hay.includes(t))) phases.push({f, n});
  }));
  return {terms, docs, phases};
}
let sQuery = '', sType = 'Tutti';
function openSearch(){
  if ($('.search')) return;
  const l = layer(`<div class="modal-h"><h2>Cerca nei protocolli</h2><p>In tutti i flussi e in tutti i documenti che puoi leggere.</p><button class="x" data-x aria-label="Chiudi">${I.x}</button>
      <div class="sbox">${I.search}<input id="sq" type="search" placeholder="Es. obiezioni, richiamo, autoclave…" autocomplete="off" value="${esc(sQuery)}"></div>
      <div class="chips" id="schips">${['Tutti', ...DOC_TYPES].map(t => `<button class="chip ${t === sType ? 'on' : ''}" data-type="${t}">${t}</button>`).join('')}</div></div>
    <div class="modal-b" id="sres"></div>`, 'wide search');
  const input = l.querySelector('#sq');
  const run = () => renderResults(l.querySelector('#sres'));
  input.addEventListener('input', () => { sQuery = input.value; run(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { const r = l.querySelector('[data-open]'); if (r) r.click(); } });
  l.addEventListener('click', e => {
    const c = e.target.closest('[data-type]'); if (c) { sType = c.dataset.type; l.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on', x === c)); run(); return; }
    const go = e.target.closest('[data-goto]'); if (go) { e.stopPropagation(); const [fid, nid] = go.dataset.goto.split('|'); closeLayer(l); goToPhase(fid, nid); return; }
    const o = e.target.closest('[data-open]'); if (o) openReader(o.dataset.open, termsOf(sQuery));
  });
  run(); setTimeout(() => { input.focus(); input.select(); }, 30);
}
function renderResults(el){
  const {terms, docs, phases} = searchAll(sQuery, sType);
  const all = isAdmin() ? S.docs : accessibleDocs();
  if (!terms.length) {
    const recent = [...all].sort((a, b) => b.updated.localeCompare(a.updated)).slice(0, 5);
    el.innerHTML = `<div class="sec-t">Aggiornati di recente</div><div class="results">${recent.map(d => resRow({d, f: S.flows.find(x => x.id === d.flowId), n: getNode(d.nodeId, S.flows.find(x => x.id === d.flowId))}, [])).join('')}</div>
      <p class="muted" style="margin:0;font-size:13px">Puoi leggere ${all.length} documenti. Scorciatoia da tastiera: Ctrl+K.</p>`;
    return;
  }
  el.innerHTML = (phases.length ? `<div class="sec-t">Fasi del flusso · ${phases.length}</div><div class="phase-hits">${phases.slice(0, 12).map(({f, n}) => `<button class="phase-hit" data-goto="${f.id}|${n.id}"><span class="sw c-${n.c}"></span><span>${markText(n.label, terms)} <span class="muted">· ${esc(f.name)}</span></span></button>`).join('')}</div>` : '')
    + `<div class="sec-t">Documenti · ${docs.length}</div>`
    + (docs.length ? `<div class="results">${docs.map(r => resRow(r, terms)).join('')}</div>`
      : `<p class="note">Nessun documento contiene “${esc(sQuery)}”${sType !== 'Tutti' ? ` tra i documenti di tipo ${sType}` : ''}. Prova con meno parole o con un sinonimo.</p>`);
}
function resRow({d, f, n}, terms){
  return `<div class="res" role="button" tabindex="0" data-open="${d.id}">
    <div class="res-t"><b>${markText(d.title, terms)}</b><span class="tag">${esc(d.type)}</span></div>
    <div class="where"><span class="sw c-${n?.c || 'op'}"></span>${esc(f?.name)} › ${esc(n?.label || 'fase eliminata')}</div>
    <div class="snip">${snippet(d.body, terms)}</div>
    <div class="res-foot"><button class="linkish" data-open="${d.id}">Leggi</button><button class="linkish" data-goto="${f.id}|${n?.id}">${'Mostra sulla mappa'}</button></div></div>`;
}
function goToPhase(fid, nid){
  closeChat();
  if (editMode) setEdit(false);
  if (curFlowId !== fid) switchFlow(fid, true);
  requestAnimationFrame(() => {
    const n = getNode(nid), r = vp.getBoundingClientRect(); if (!n) return;
    view.s = Math.max(view.s, 0.9);
    const sheetW = innerWidth >= 720 ? 400 : 0, usableH = innerWidth >= 720 ? r.height : r.height * 0.28;
    view.x = (r.width - sheetW) / 2 - n.x * view.s; view.y = usableH / 2 + (innerWidth >= 720 ? 0 : 10) - n.y * view.s;
    applyView(); openSheet(nid);
    const el = nodesEl.querySelector(`[data-id="${nid}"]`); el?.animate?.([{transform: 'translate(-50%,-50%) scale(1.12)'}, {transform: 'translate(-50%,-50%) scale(1)'}], {duration: 500, iterations: 2});
  });
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Enter' && e.target.matches?.('.res[data-open]')) e.target.click();
});

/* ---------- assistente (stile NotebookLM) ---------- */
let chatSel = null, msgs = [], busy = false, chatCtl = null;
$('#askBtn').onclick = () => openChat();
function openChat(){
  if ($('#chat')) return;
  const docs = accessibleDocs();
  if (!chatSel) chatSel = new Set(docs.map(d => d.id));
  const c = document.createElement('section'); c.id = 'chat'; c.className = 'chat'; c.setAttribute('aria-label', 'Assistente protocolli');
  c.innerHTML = `<div class="chat-h"><h2>Chiedi ai protocolli</h2><p>Risponde solo con i documenti che puoi leggere e indica da quale li ha presi.</p><button class="x" id="chatX" aria-label="Chiudi">${I.x}</button></div>
    <details class="src"><summary>${I.doc}<span id="srcCount"></span>${I.chev}</summary><div class="src-list" id="srcList"></div></details>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="compose" id="compose"><textarea id="q" rows="1" placeholder="Scrivi una domanda sui protocolli…"></textarea><button class="send" id="sendBtn" type="submit" aria-label="Invia">${I.send}</button></form>`;
  document.body.append(c);
  renderSources(); renderChat();
  const q = $('#q');
  q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#compose').requestSubmit(); } });
  $('#compose').addEventListener('submit', e => { e.preventDefault(); if (busy) { chatCtl?.abort(); return; } const v = q.value.trim(); if (v) { q.value = ''; q.style.height = 'auto'; sendChat(v); } });
  $('#chatX').onclick = closeChat;
  c.addEventListener('change', e => { const t = e.target; if (t.dataset.src) { t.checked ? chatSel.add(t.dataset.src) : chatSel.delete(t.dataset.src); updateSrcCount(); } });
  c.addEventListener('click', e => {
    const s = e.target.closest('[data-sugg]'); if (s) sendChat(s.textContent);
    const ci = e.target.closest('[data-cite]'); if (ci) openReader(ci.dataset.cite);
    const all = e.target.closest('[data-srcall]'); if (all) { const on = all.dataset.srcall === '1'; accessibleDocs().forEach(d => on ? chatSel.add(d.id) : chatSel.delete(d.id)); renderSources(); }
  });
  if (innerWidth >= 720) setTimeout(() => q.focus(), 30);
}
function closeChat(){ chatCtl?.abort(); $('#chat')?.remove(); }
function updateSrcCount(){ const n = accessibleDocs().filter(d => chatSel.has(d.id)).length; const t = $('#srcCount'); if (t) t.textContent = `Fonti selezionate: ${n} di ${accessibleDocs().length}`; }
function renderSources(){
  const docs = accessibleDocs(); const el = $('#srcList'); if (!el) return;
  const groups = {};
  docs.forEach(d => { const f = S.flows.find(x => x.id === d.flowId); (groups[f.name] = groups[f.name] || []).push(d); });
  el.innerHTML = `<div class="row"><button class="linkish" data-srcall="1">Seleziona tutte</button><button class="linkish" data-srcall="0">Nessuna</button></div>`
    + (docs.length ? Object.entries(groups).map(([g, ds]) => `<div class="grp">${esc(g)}</div>` + ds.map(d => `<label class="chk"><input type="checkbox" id="src-${d.id}" data-src="${d.id}" ${chatSel.has(d.id) ? 'checked' : ''}>${esc(d.title)} <span class="muted">· ${esc(getNode(d.nodeId, S.flows.find(x => x.id === d.flowId))?.label)}</span></label>`).join('')).join('')
      : '<p class="muted">Non hai ancora documenti a cui accedere.</p>');
  updateSrcCount();
}
const SUGG = ['Cosa faccio se il paziente non risponde dopo la terza chiamata?', 'Come rispondo a un paziente che dice che costa troppo?', 'Cosa devo controllare in una prima visita?', 'Ogni quanto si fanno i richiami di igiene?'];
function renderChat(){
  const log = $('#log'); if (!log) return;
  const docs = accessibleDocs();
  if (!msgs.length) {
    const kw = docs.map(d => d.title + ' ' + d.body).join(' ').toLowerCase();
    const sug = SUGG.filter(s => s.toLowerCase().split(/\W+/).filter(w => w.length > 5).some(w => kw.includes(w))).slice(0, 3);
    log.innerHTML = `<p class="muted" style="margin:0">Fai una domanda come la faresti a un collega esperto. Ad esempio:</p><div class="sugg">${(sug.length ? sug : SUGG.slice(0, 2)).map(s => `<button data-sugg>${esc(s)}</button>`).join('')}</div>`;
  } else {
    log.innerHTML = msgs.map(m => {
      if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
      const cite = nums => nums.map(k => { const id = m.srcIds[k - 1]; return id ? `<button class="cite" data-cite="${id}" title="${esc(S.docs.find(d => d.id === id)?.title || '')}">${k}</button>` : ''; }).join('');
      const body = m.pending ? `<div class="thinking"><i></i><i></i><i></i><span>Sto leggendo i documenti…</span></div>` : mdLite(m.text, cite);
      return `<div class="msg bot">${body}${m.note ? `<div class="mnote">${esc(m.note)}</div>` : ''}${m.error ? `<div class="err">${esc(m.error)}</div>` : ''}</div>`;
    }).join('');
  }
  log.scrollTop = log.scrollHeight;
  const sb = $('#sendBtn'); if (sb) { sb.innerHTML = busy ? I.stop : I.send; sb.setAttribute('aria-label', busy ? 'Interrompi' : 'Invia'); }
}
async function sendChat(q){
  if (busy) return;
  if (!$('#chat')) openChat();
  const srcs = accessibleDocs().filter(d => chatSel.has(d.id));
  msgs.push({role: 'user', text: q});
  if (!srcs.length) { msgs.push({role: 'bot', text: '', srcIds: [], error: 'Seleziona almeno una fonte in “Fonti selezionate”.'}); renderChat(); return; }
  if (!aiReady) { msgs.push({role: 'bot', text: '', srcIds: [], error: me.role === 'admin' ? 'L\'assistente non è ancora configurato: imposta AI_PROVIDER e la chiave API su Render.' : 'L\'assistente non è ancora attivo. Avvisa l\'amministratore.'}); renderChat(); return; }
  const a = {role: 'bot', text: '', srcIds: srcs.map(d => d.id), pending: true}; msgs.push(a);
  const hist = msgs.slice(0, -1).filter(m => m.text && !m.error).slice(-10).map(m => ({role: m.role === 'user' ? 'user' : 'assistant', content: m.text}));
  busy = true; chatCtl = new AbortController(); renderChat();
  try {
    const r = await fetch('/api/chat', {method: 'POST', credentials: 'same-origin', signal: chatCtl.signal, headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: hist, sourceIds: srcs.map(d => d.id)})});
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(j.error || 'L\'assistente non ha risposto. Riprova.');
    a.text = j.text; a.srcIds = j.sourceIds || a.srcIds;
    if (j.mode === 'search') a.note = j.chunks ? `Ho cercato nei documenti e letto ${j.chunks} passaggi da ${a.srcIds.length} ${a.srcIds.length === 1 ? 'protocollo' : 'protocolli'}.` : 'Non ho trovato passaggi pertinenti: prova con altre parole o scegli le fonti a mano.';
  } catch (e) {
    if (e.name === 'AbortError') a.note = 'Domanda annullata.'; else a.error = e.message;
  }
  a.pending = false; busy = false; chatCtl = null; renderChat();
}

const stageEl = $('#stage'); stageEl.addEventListener('scroll', () => { stageEl.scrollTop = 0; stageEl.scrollLeft = 0; });
boot();
