<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Accedi · Mappa dei Protocolli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#E9EFEE;--dot:#C3CFCD;--surface:#fff;--surface-2:#F3F7F6;--fg:#13201F;--muted:#586866;--line:#D3DDDB;--accent:#0B6B63;--accent-fg:#fff;--danger:#B42318;--danger-soft:#FBE3E0}
@media (prefers-color-scheme: dark){:root{--bg:#0E1615;--dot:#23312F;--surface:#162120;--surface-2:#1C2928;--fg:#E3EDEB;--muted:#94A6A3;--line:#2A3A38;--accent:#4DBDB0;--accent-fg:#06201D;--danger:#FF8A7A;--danger-soft:#3A1D1A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--fg);font:16px/1.5 "Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(16,32,30,.12)}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-bottom:14px}
.mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 24px/1.2 "Bricolage Grotesque","Figtree",sans-serif;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:15px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:14px}
input{font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;font:inherit;font-weight:700;border:none;border-radius:11px;padding:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer;margin-top:4px}
button:disabled{opacity:.6}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:14px}
.foot{margin:18px 0 0;font-size:13px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="mark"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="10" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><path d="M6.5 8v8M10 5.5h3.5a2 2 0 0 1 2 2V10"/></svg></div>
  <h1 id="h">Mappa dei protocolli</h1>
  <p id="sub">Entra con il nome utente e la password che ti ha dato lo studio.</p>
  <div class="err" id="err" hidden></div>
  <form id="f">
    <label>Nome utente<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button id="b" type="submit">Entra</button>
  </form>
  <p class="foot">Password dimenticata? Chiedi all'amministratore dello studio.</p>
</main>
<script>
const next = new URLSearchParams(location.search).get('next');
const safeNext = next && /^\/(?!\/)/.test(next) ? next : null;
if (safeNext === '/admin') { document.getElementById('h').textContent = 'Area amministratore'; document.getElementById('sub').textContent = 'Entra con le credenziali da amministratore.'; }
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; b.textContent = 'Accesso…'; err.hidden = true;
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Accesso non riuscito. Riprova.');
    location.href = safeNext && (safeNext !== '/admin' || j.role === 'admin') ? safeNext : '/';
  } catch (x) {
    err.textContent = x.message; err.hidden = false; b.disabled = false; b.textContent = 'Entra';
  }
});
</script>
</body>
</html>
