# Blueprint di Render: un solo servizio per Protocolli e Calendario eventi (vedi index.js),
# collegato al database PostgreSQL del gruppo (schemi "mappa" e "calendario").
# Su Render: New > Blueprint > scegli questo repository.
services:
  - type: web
    name: mappa-protocolli
    runtime: node
    # Prova gratuita: il sito si spegne dopo 15 minuti senza visite (riavvio in circa 1 minuto).
    # Per l'uso quotidiano cambia in 0.5c-512mb (7 $/mese) dalla dashboard di Render.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Database già esistente: incolla la "Internal Database URL" (stessa regione) o la "External Database URL"
      - key: DATABASE_URL
        sync: false
      # Le tabelle di questa app stanno nello schema "mappa", separate da quelle dell'altra app
      - key: DB_SCHEMA
        value: mappa
      - key: SESSION_SECRET
        generateValue: true
      # Amministratore principale: li inserisci tu nella dashboard di Render
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Assistente AI: openai, anthropic oppure gemini
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

