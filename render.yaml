# Blueprint di Render: crea il sito e il database in un colpo solo.
# Su Render: New > Blueprint > scegli questo repository.
services:
  - type: web
    name: mappa-protocolli
    runtime: node
    # Prova gratuita: il sito si spegne dopo 15 minuti senza visite (riavvio in circa 1 minuto).
    # Per l'uso quotidiano cambia in 0.5c-512mb (7 $/mese) dalla dashboard di Render.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mappa-protocolli-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Amministratore principale: li inserisci tu nella dashboard di Render
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Assistente AI: openai, anthropic oppure gemini
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: mappa-protocolli-db
    databaseName: mappa_protocolli
    # ATTENZIONE: il database gratuito scade dopo 30 giorni e dopo altri 14 viene cancellato con tutti i dati.
    # Prima della scadenza passalo a un piano a pagamento dalla dashboard di Render (nessun dato si perde).
    plan: free
